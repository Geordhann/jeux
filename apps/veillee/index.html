<style>
.wheel-box { flex: none; position: relative; width: min(100%, 330px); aspect-ratio: 1; max-width: 100%; margin: 6px auto 0; }
.wheel { pointer-events: none; width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 0 0 6px var(--paper), 0 16px 36px rgba(0,0,0,.45); }
.pointer { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--gold); z-index: 2; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
.phase { text-align: center; padding: 16px; border-radius: var(--r); display: flex; flex-direction: column; gap: 2px; }
.phase.night { background: #0c1a33; border: 1px solid #263a63; color: #e1e8ff; }
.phase.day { background: var(--gold); color: var(--ink); }
.phase small { text-transform: uppercase; letter-spacing: .14em; font-size: .75rem; font-weight: 800; opacity: .8; }
.phase strong { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 8vw, 2rem); line-height: 1.15; }
.steps-mj { display: flex; flex-direction: column; gap: 8px; }
.step-mj { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 var(--paper-edge); }
.step-mj .step-go { display: flex; gap: 12px; text-align: left; color: var(--ink); }
.step-mj .ic { font-size: 1.5rem; flex: none; width: 1.4em; text-align: center; }
.step-mj b { display: block; }
.step-mj b i { font-weight: 600; font-size: .8rem; color: var(--ink-soft); }
.step-mj .t { font-family: var(--font-card); font-style: italic; font-size: 1rem; line-height: 1.4; display: block; }
.step-mj small { display: block; color: var(--ink-soft); font-size: .82rem; margin-top: 4px; }
.step-mj.done { opacity: .5; }
.step-mj .potions { gap: 8px; padding-left: calc(1.4em + 12px); }
.step-mj .potions > * { flex: 0 0 auto; }
.step-mj .mini { border: 1px solid var(--paper-edge); background: #fff; }
.step-mj .mini.red { border-color: var(--red); background: var(--red); }
.card .role-ic { font-size: 4.2rem; line-height: 1; text-align: center; }
.card.dead { filter: grayscale(.85); }
.card.verso.shuffle { animation: shuffle .45s ease-in-out infinite alternate; }
@keyframes shuffle { from { transform: rotate(-4deg) scale(.98); } to { transform: rotate(4deg) scale(1.02); } }
@media (prefers-reduced-motion: reduce) { .card.verso.shuffle { animation: none; } }
/* Téléphone dessiné */
.gp-compose { display: flex; flex-direction: column; gap: 12px; }
.gp-canvas { width: 100%; aspect-ratio: 1; display: block; background: #fff; border-radius: 14px; touch-action: none; cursor: crosshair; box-shadow: 0 3px 0 var(--paper-edge), 0 12px 28px rgba(0,0,0,.3); }
.gp-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--felt); box-shadow: 0 0 0 2px var(--felt-line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--gold); }
.tool-b { min-width: 42px; height: 42px; border-radius: 10px; background: rgba(0,0,0,.25); border: 1px solid var(--felt-line); font-weight: 700; font-size: .88rem; padding: 0 10px; display: inline-grid; place-items: center; }
.tool-b[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.size-dot { display: block; border-radius: 50%; background: currentColor; }
.gp-prompt { background: var(--paper); color: var(--ink); border-radius: 14px; padding: 14px 16px; text-align: center; font-family: var(--font-card); font-size: clamp(1.2rem, 5.5vw, 1.45rem); line-height: 1.3; overflow-wrap: anywhere; }
.gp-prompt small { display: block; font-family: var(--font-body); font-size: .75rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 800; color: var(--red); margin-bottom: 2px; }
.gp-img { width: 100%; aspect-ratio: 1; border-radius: 14px; background: #fff; display: block; object-fit: contain; box-shadow: 0 3px 0 var(--paper-edge); }
#gpText { font: 1.1rem/1.4 var(--font-body); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--paper-edge); background: #fff; color: var(--ink); width: 100%; box-sizing: border-box; resize: none; }
.gp-time { font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; color: var(--paper); min-height: 1.2em; }
.album { display: flex; flex-direction: column; gap: 14px; }
.album .it { display: flex; flex-direction: column; gap: 4px; animation: deal .35s cubic-bezier(.2,.9,.3,1.2); }
.album .by { font-size: .8rem; color: var(--muted); font-weight: 700; }
.bub { background: var(--paper); color: var(--ink); padding: 12px 16px; border-radius: 16px; font-family: var(--font-card); font-size: 1.25rem; line-height: 1.3; overflow-wrap: anywhere; }
.bub.miss { font-style: italic; color: var(--ink-soft); font-size: 1rem; }
@media (prefers-reduced-motion: reduce) { .album .it { animation: none; } }
/* Décor : forêt de nuit et village dans sa clairière ; le jour, l'aube se lève sur la forêt */
:root { --felt: #08161a; --felt-2: #10292c; --felt-line: #24464a; --muted: #a9c6c2; --gold: #f1b95c; }
body { background-attachment: fixed; }
body[data-scene="night"], body[data-scene="evening"] { --sky1: #03080f; --sky2: #0a1a2a; --sky3: #123437; --far: #0d2228; --pfar: #0b1d22; --mid: #0a1a1e; --pmid: #071317; --near: #061013; --pnear: #03090b; --wall: #1a2a33; --roof: #22323f; --win: #ffc463; --water: #2f5f7a; --fog: #9fc3cf; }
body[data-scene="day"] { --sky1: #2a3f6a; --sky2: #c58a8f; --sky3: #f3c48a; --far: #4f6b6a; --pfar: #3f5a58; --mid: #33504a; --pmid: #24403a; --near: #1d342e; --pnear: #13261f; --wall: #c9b48f; --roof: #8a4a3a; --win: #5a4a3a; --water: #7fb2c9; --fog: #fff1dc; }
body[data-scene] { background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 58%, var(--sky3) 100%) fixed; }
#scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#scene svg { width: 100%; height: 100%; display: block; }
#scene path, #scene rect, #scene polygon, #scene circle, #scene ellipse { transition: fill 1.8s, opacity 1.8s; }
#scene .far { fill: var(--far); } #scene .mid { fill: var(--mid); } #scene .near { fill: var(--near); }
#scene .p-far { fill: var(--pfar); } #scene .p-mid { fill: var(--pmid); } #scene .p-near { fill: var(--pnear); }
#scene .wall { fill: var(--wall); } #scene .roof { fill: var(--roof); }
#scene .win { fill: var(--win); } #scene .belfry { fill: var(--win); opacity: .85; }
body:not([data-scene="day"]) #scene .win { filter: drop-shadow(0 0 4px var(--win)); animation: glow 5s ease-in-out infinite alternate; }
#scene .w2 { animation-delay: -2.5s; }
#scene .stream { fill: none; stroke: var(--water); stroke-width: 9; stroke-linecap: round; opacity: .5; }
#scene .shine { stroke: #fff; stroke-width: 2; stroke-dasharray: 6 22; opacity: .3; animation: flow 6s linear infinite; }
#scene .fog { fill: var(--fog); opacity: .07; animation: drift 26s ease-in-out infinite alternate; }
#scene .f2 { opacity: .06; animation-duration: 34s; animation-direction: alternate-reverse; }
#scene .stars circle { fill: #fff; opacity: 0; transition: opacity 2s; }
body:not([data-scene="day"]) #scene .stars circle { opacity: .9; animation: twinkle 3.5s ease-in-out infinite alternate; }
#scene .moon { fill: #f4f0dc; } #scene .crater { fill: #dcd6bd; } #scene .moon-glow { fill: #dfe9ff; opacity: .09; }
body[data-scene="day"] #scene .moon, body[data-scene="day"] #scene .moon-glow, body[data-scene="day"] #scene .crater { opacity: 0; }
#scene .sun { fill: #ffd9a0; opacity: 0; } #scene .sun-glow { fill: #ffd9a0; opacity: 0; }
body[data-scene="day"] #scene .sun { opacity: .9; } body[data-scene="day"] #scene .sun-glow { opacity: .22; }
#scene .flies circle { fill: #fff3a0; opacity: 0; }
body:not([data-scene="day"]) #scene .flies circle { animation: firefly 7s ease-in-out infinite; }
@keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
@keyframes glow { from { opacity: .7; } to { opacity: 1; } }
@keyframes flow { to { stroke-dashoffset: -280; } }
@keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
@keyframes firefly { 0%, 100% { opacity: 0; transform: translate(0, 0); } 30% { opacity: .9; } 50% { opacity: .2; transform: translate(14px, -10px); } 75% { opacity: .85; transform: translate(-6px, -18px); } }
@media (prefers-reduced-motion: reduce) { #scene * { animation: none !important; } }
/* Loup-Garou : écharpe du maire, appels de la nuit, votes */
.sash { display: inline-flex; align-items: center; vertical-align: middle; margin-left: 6px; padding: 1px 8px; border-radius: 3px; background: linear-gradient(90deg, #1f4fa8 0 33.3%, #fff 33.3% 66.6%, #d8343f 66.6%); box-shadow: 0 1px 3px rgba(0,0,0,.5); transform: rotate(-4deg); }
.sash b { font-size: .58rem; letter-spacing: .14em; color: #10203a; font-weight: 800; text-shadow: 0 0 2px #fff, 0 0 2px #fff; }
.sash.big { padding: 3px 14px; margin: 0 8px 0 0; }
.sash.big b { font-size: .72rem; }
.card.has-sash > .sash { position: absolute; top: 18px; right: -10px; transform: rotate(32deg); padding: 4px 28px; z-index: 2; margin: 0; }
.mayor-band { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.08); font-weight: 800; }
.tag-i { margin-left: 4px; }
.camp-t { font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); font-weight: 800; margin-top: 4px; }
.card.call { text-align: left; align-items: stretch; }
.card.call .kind { text-align: left; }
.call-t { font-size: clamp(1.1rem, 5vw, 1.3rem) !important; font-style: italic; text-align: left !important; }
.card.call .sub { text-align: left; }
.done-l { color: #1f7a4a !important; font-weight: 700; }
.wait-dot { animation: glow 1.2s ease-in-out infinite alternate; }
.night-order { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: n; }
.night-order li { counter-increment: n; }
.night-order button { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--felt-line); background: rgba(0,0,0,.25); font-size: .8rem; font-weight: 700; }
.night-order button::before { content: counter(n) ". "; color: var(--gold); }
.night-order button.now { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.night-order button.now::before { color: var(--ink); }
.night-order button.past { opacity: .45; }
.panel.ask { border-color: var(--gold); box-shadow: 0 0 24px rgba(241,185,92,.25); }
.ask-t { font-family: var(--font-card); font-style: italic; font-size: 1.2rem; }
.pick-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.mini-card { padding: 14px 8px; border-radius: 12px; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 3px 0 var(--paper-edge); }
.mini-card span { font-size: 2rem; }
.tally { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tally li { display: grid; grid-template-columns: minmax(0, 1fr) 2fr auto; align-items: center; gap: 8px; }
.tally li small { grid-column: 1 / -1; color: var(--muted); font-size: .78rem; }
.tally .bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.08); overflow: hidden; }
.tally .bar i { display: block; height: 100%; background: var(--gold); }
.tally li.top b { color: var(--gold); }
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alerts .banner { justify-content: space-between; text-align: left; }
/* Tu préfères et Action ou Vérité */
.tp-duel { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.tp-opt { padding: 22px 18px; border-radius: 18px; font-family: var(--font-card); font-size: clamp(1.2rem, 5.5vw, 1.45rem); line-height: 1.3; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.25); transition: transform .12s; }
.tp-opt.a { background: #ffd27a; } .tp-opt.b { background: #9fd8ff; }
.tp-opt[aria-pressed="true"] { outline: 4px solid #fff; transform: scale(1.02); }
.tp-or { text-align: center; font-family: var(--font-display); color: var(--gold); font-size: 1.3rem; }
.tp-res { position: relative; overflow: hidden; border-radius: 16px; padding: 14px 16px; background: rgba(9,12,30,.6); display: flex; flex-direction: column; gap: 2px; }
.tp-res > * { position: relative; }
.tp-res .tp-bar { position: absolute; inset: 0 auto 0 0; opacity: .35; }
.tp-res.a .tp-bar { background: #ffd27a; } .tp-res.b .tp-bar { background: #9fd8ff; }
.tp-res b { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; color: var(--gold); }
.tp-res span { font-family: var(--font-card); font-size: 1.15rem; }
.tp-res small { color: var(--muted); }
.tp-res.minor { box-shadow: inset 0 0 0 3px var(--red); }
.av-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.reacts { display: flex; justify-content: center; gap: 10px; }
.reacts button { width: 58px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.1); font-size: 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.reacts b { font-size: .7rem; color: var(--gold); min-height: .8em; }
/* Lisibilité par-dessus le décor */
.panel, .plist li { background: rgba(9, 12, 30, .58); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.howto, .hint, .tag, .sec-title, .foot, .turn small { text-shadow: 0 1px 4px rgba(0, 0, 0, .85); }
.phase.night { background: rgba(8, 14, 38, .78); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.phase.day { background: linear-gradient(135deg, #f6c96a, #ee9a5a); }
</style>

<script>
const WHEEL_COLORS = [['--red', '--paper'], ['--paper', '--ink'], ['--gold', '--ink'], ['--felt-2', '--fg']];
function wheelSvg(segs, angle) {
  const n = segs.length, seg = 360 / n, R = 96, C = 100;
  const pt = a => [C + R * Math.cos((a - 90) * Math.PI / 180), C + R * Math.sin((a - 90) * Math.PI / 180)];
  const fs = n <= 6 ? 10 : n <= 10 ? 8.5 : 7;
  const parts = segs.map((sg, i) => {
    const [bg, fg] = WHEEL_COLORS[i % WHEEL_COLORS.length === 0 && i === n - 1 && n % 4 === 1 ? 1 : i % WHEEL_COLORS.length];
    const [x0, y0] = pt(i * seg), [x1, y1] = pt((i + 1) * seg);
    const label = sg.label.length > 13 ? sg.label.slice(0, 12) + '…' : sg.label;
    const mid = i * seg + seg / 2;
    return `<path d="M${C} ${C}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" style="fill:var(${bg});stroke:var(--felt);stroke-width:1"/>
      <text x="${C + R - 8}" y="${C}" transform="rotate(${mid - 90} ${C} ${C})" text-anchor="end" dominant-baseline="middle" style="fill:var(${fg});font:800 ${fs}px var(--font-body)">${esc(label)}</text>`;
  }).join('');
  return `<div class="wheel-box"><span class="pointer" aria-hidden="true"></span>
    <svg class="wheel" id="wheel" viewBox="0 0 200 200" role="img" aria-label="Roue" style="transform:rotate(${angle}deg)">${parts}
      <circle cx="100" cy="100" r="14" style="fill:var(--paper);stroke:var(--red);stroke-width:3"/></svg></div>`;
}

/* ---------- Loup-Garou, version ultime ---------- */
// Tous les personnages des boîtes en cartes (jeu de base, Nouvelle Lune, Personnages, Le Village : 47 cartes),
// l'ordre d'appel officiel de la nuit, et les téléphones qui participent : la voyante voit la carte sur son écran,
// Cupidon choisit ses amoureux, la sorcière ses potions, le village vote… Le meneur garde toujours la main.
const LG_MAX = 47;
const LG = {
  // Le village
  villageois: { name: 'Simple villageois', short: 'Villageois', icon: '🧑‍🌾', camp: 'village', box: 9, desc: "Aucun pouvoir, juste ton flair et ta voix au vote. Démasque les loups avant qu'il ne soit trop tard." },
  villvill: { name: 'Villageois-Villageois', short: 'Villageois-Villageois', icon: '😇', camp: 'village', box: 1, desc: "Ta carte a deux faces Villageois : tout le monde sait que tu es innocent. Sers-t'en pour guider le village." },
  voyante: { name: 'Voyante', short: 'Voyante', icon: '🔮', camp: 'village', box: 1, desc: "Chaque nuit, tu découvres sur ton téléphone la vraie carte d'un joueur de ton choix." },
  sorciere: { name: 'Sorcière', short: 'Sorcière', icon: '🧪', camp: 'village', box: 1, desc: "Deux potions, une seule fois chacune : la potion de vie sauve la victime des loups, la potion de mort élimine qui tu veux." },
  chasseur: { name: 'Chasseur', short: 'Chasseur', icon: '🏹', camp: 'village', box: 1, desc: "Si tu meurs, tu tires une dernière balle : tu emportes immédiatement le joueur de ton choix." },
  cupidon: { name: 'Cupidon', short: 'Cupidon', icon: '💘', camp: 'village', box: 1, desc: "La première nuit, tu désignes deux amoureux (toi compris si tu veux). Si l'un meurt, l'autre meurt de chagrin." },

      H.extra[k] = p.role; p.role = taken;
      res = `Tu es maintenant ${lgRole(taken).name} ${lgRole(taken).icon}`; log = `Le voleur a pris la carte ${lgRole(taken).name}.`; break;

    case 'cupidon': if (!okPicks) return; H.lovers = P.map(x => x.cid); res = `Tu as uni ${names}. 💘`; log = `Amoureux : ${names}.`; break;
    case 'chienloup': if (!['village', 'loup'].includes(d.camp)) return; p.dog = d.camp; res = d.camp === 'loup' ? 'Tu rejoins la meute. 🐺' : 'Tu restes le fidèle chien du village. 🐕'; log = `Le chien-loup a choisi : ${d.camp === 'loup' ? 'loup-garou' : 'village'}.`; break;
    case 'voyante': if (!okPicks) return; res = `${names} est ${lgRole(P[0].role).name} ${lgRole(P[0].role).icon}`; log = `La voyante a sondé ${names} (${lgRole(P[0].role).name}).`; break;
    case 'renard': {

    }
    case 'enfant': if (!okPicks) return; p.model = P[0].cid; res = `Ton modèle est ${names}. Tant qu'il vit, tu es du village.`; log = `L'enfant sauvage a choisi ${names} comme modèle.`; break;
    case 'corbeau': if (!okPicks) return; H.crow = P[0].cid; res = `${names} aura deux voix contre lui demain.`; log = `Le corbeau a désigné ${names}.`; break;
    case 'salvateur': if (!okPicks) return; H.protect = P[0].cid; res = `Tu protèges ${names} cette nuit.`; log = `Le salvateur protège ${names}.`; break;

function lgTally(H) {
  const v = H.vote, score = {}, voters = {};
  Object.entries(v.ballots).forEach(([from, to]) => {
    const w = v.kind === 'exil' && H.mayor === from ? 2 : 1;
    score[to] = (score[to] || 0) + w; (voters[to] = voters[to] || []).push((mpP(from) || {}).name + (w > 1 ? ' (×2)' : ''));
  });
  if (v.kind === 'exil' && H.crow && mpP(H.crow) && mpP(H.crow).alive) { score[H.crow] = (score[H.crow] || 0) + 2; (voters[H.crow] = voters[H.crow] || []).push('🪶 le corbeau (×2)'); }
  const rows = Object.keys(score).map(c => ({ cid: c, name: mpP(c).name, votes: score[c], voters: voters[c] })).sort((a, b) => b.votes - a.votes);
  const top = rows.length ? rows.filter(r => r.votes === rows[0].votes) : [];
  return { rows, top };
}

    <button class="btn big" data-a="lg-spin" ${d.err || MP.status !== 'open' ? 'disabled' : ''}>Lancer la roue</button>`;
  }
  if (H.step === 'spin') return `<div class="turn"><small>La roue distribue</small><strong>${n} cartes</strong></div>${wheelSvg(H.cards.slice(0, 24).map(r => ({ label: lgRole(r).short })), H.spin.from)}<p class="howto">Chacun reçoit sa carte en secret sur son téléphone.</p>`;
  const tags = p => [lgRole(p.role).name + (p.role !== p.card ? ` (était ${lgRole(p.card).short})` : ''),
    p.infected ? 'infecté' : '', p.role === 'chienloup' && p.dog ? (p.dog === 'loup' ? 'devenu loup' : 'reste chien') : '', p.wild ? 'devenu loup' : '',
    H.lovers.includes(p.cid) ? '💘' : '', p.charmed ? '🎶 charmé' : '', p.oiled ? '🛢️ huilé' : '', H.protect === p.cid ? '🛡️ protégé' : '', p.group ? (p.group === 'lune' ? '🌙' : '☀️') : '',
    H.pending.some(([c]) => c === p.cid) ? '☠ ' + H.pending.filter(([c]) => c === p.cid).map(([, b]) => ({ loups: 'loups', gml: 'grand méchant loup', loupblanc: 'loup blanc', poison: 'poison', feu: 'feu', mj: 'meneur' }[b])).join(', ') : '',
    p.on ? '' : 'déconnecté·e', H.step === 'deal' && !p.seen ? 'carte pas encore vue' : ''].filter(Boolean).join(' · ');
  const list = acts => `<ul class="plist">${H.players.map(p => `<li class="${p.alive ? '' : 'dead'} ${H.pending.some(([c]) => c === p.cid) ? 'target' : ''}"><span class="ic" aria-hidden="true">${lgRole(p.role).icon}</span>
    <span class="nm"><b>${esc(p.name)}${H.mayor === p.cid ? ' ' + sash() : ''}</b><small>${tags(p)}</small></span>${acts ? acts(p) : ''}</li>`).join('')}</ul>`;
  if (H.step === 'deal') {
    const seen = H.players.filter(p => p.seen).length;
    return `<div class="turn"><small>Cartes distribuées</small><strong>${seen} / ${n} vues</strong></div>
    <p class="howto">Chacun regarde sa carte en secret. Toi seul vois toutes les cartes : cache bien ton écran.</p>
    ${H.extra.length ? `<p class="howto">Cartes du voleur : ${H.extra.map(r => lgRole(r).icon + ' ' + lgRole(r).name).join(' et ')}</p>` : ''}
    ${H.comRoles.length && lgHas(H, 'comedien') ? `<p class="howto">Rôles du comédien : ${H.comRoles.map(r => lgRole(r).icon + ' ' + lgRole(r).name).join(', ')}</p>` : ''}
    <section class="panel"><h3><span>Les cartes</span></h3>${list()}</section>
    <button class="btn big" data-a="lg-start">🌙 La nuit tombe</button>
    <button class="btn ghost" data-a="lg-respin">Relancer la roue</button>`;
  }
  if (H.step === 'end') return `<div class="turn"><small>Fin de partie</small><strong>${LG_WIN[H.winner || '']}</strong></div>
    <div class="card">${cardIdx('☾')}<p class="kind">Toutes les cartes</p>${lgRevealList(MPG.lg.view(MP_CID).reveal)}</div>
    <div class="row"><button class="btn" data-a="lg-again">Nouvelle partie</button><button class="btn ghost" data-a="mp-quit">Fermer</button></div>`;
  // Partie en cours
  const night = H.phase === 'night', win = lgWinner(H), alive = lgAlive(H).length;
  const alerts = H.alerts.length ? `<div class="alerts">${H.alerts.map((a, i) => `<div class="banner gold"><span>${esc(a)}</span><button class="mini" data-a="lg-alert" data-v="${i}" aria-label="Compris">OK</button></div>`).join('')}</div>` : '';
  let body = '';
  if (night) {
    const steps = lgSteps(H), cur = steps.find(s => s.id === H.cur);
    const curCard = cur ? (() => {
      const actor = lgActor(H, cur), dead = !H.players.some(p => p.alive && (cur.wolves ? lgWolf(p) : p.role === (cur.need || cur.role)));
      const wait = actor && !H.done[cur.id] ? `<p class="sub wait-dot">⏳ En attente du choix sur le téléphone de ${esc(actor.name)}…</p>` : '';
      const done = H.log[cur.id] ? `<p class="sub done-l">✓ ${esc(H.log[cur.id])}</p>` : '';
      let extra = '';
      if (cur.id === 'loups' && lgHas(H, 'petitefille')) extra += `<p class="sub">👧 La petite fille peut espionner en entrouvrant les yeux.</p>`;
      if (cur.id === 'loups') extra += `<p class="sub">Touche ☠ sur la victime dans la liste des joueurs.</p>`;
      if (cur.id === 'infect') { const vic = H.pending.find(([, b]) => b === 'loups'); extra += vic ? `<button class="btn paper" data-a="lg-infect">${H.infectOn ? 'Annuler l\'infection' : `Infecter ${esc(mpP(vic[0]).name)}`}</button>` : '<p class="sub">Pas encore de victime des loups.</p>'; }
      if (cur.id === 'comedien' && H.comNight) extra += `<p class="sub">Appelle le comédien au tour de : ${lgRole(H.comNight).name}.</p>`;
      return `<div class="card compact call"><p class="kind">${cur.title}${dead ? ' · mort·e : appelle quand même' : ''}</p><p class="text call-t">« ${cur.text} »</p>${wait}${done}${extra}
        <div class="row"><button class="btn" data-a="lg-next">${steps.indexOf(cur) === steps.length - 1 ? 'Terminer la nuit' : 'Suivant ›'}</button></div></div>`;
    })() : H.allDone ? `<div class="card compact call"><p class="kind">Nuit ${H.n}</p><p class="text call-t">Tous les personnages ont été appelés.</p><p class="sub">Réveille le village quand tu es prêt·e.</p></div>`
      : `<div class="card compact call"><p class="kind">Nuit ${H.n}</p><p class="text call-t">« La nuit tombe sur le village. Tout le monde ferme les yeux… »</p>
        <button class="btn" data-a="lg-next">Appeler le premier personnage</button></div>`;
    body = `${curCard}
      <section class="panel"><h3><span>L'ordre de la nuit</span><span>${steps.length} appels</span></h3>
        <ol class="night-order">${steps.map(s => `<li><button data-a="lg-goto" data-v="${s.id}" class="${s.id === H.cur ? 'now' : ''} ${H.done[s.id] || (H.cur && steps.indexOf(s) < steps.findIndex(x => x.id === H.cur)) ? 'past' : ''}">${s.title}</button></li>`).join('')}</ol>
        ${lgHas(H, 'sorciere') ? `<p class="hint">Potions de la sorcière : vie ${H.potions.vie ? 'disponible' : 'utilisée'}, mort ${H.potions.mort ? 'disponible' : 'utilisée'}.</p>` : ''}</section>`;
  } else {
    const t = H.vote ? lgTally(H) : null;
    const voteCtl = !H.vote ? `<div class="row">${!H.mayor ? `<button class="btn paper" data-a="lg-vote-start" data-v="maire">🎖️ Élire le maire</button>` : ''}<button class="btn" data-a="lg-vote-start" data-v="exil">🗳️ Lancer le vote</button></div>`
      : !H.vote.revealed ? `<button class="btn" data-a="lg-vote-reveal">Révéler le vote (${Object.keys(H.vote.ballots).length} / ${H.players.filter(x => lgCanVote(H, x)).length})</button>`
      : `<div class="row">${t.top.length === 1 ? (H.vote.kind === 'maire' ? `<button class="btn" data-a="lg-mayor" data-v="${esc(t.top[0].cid)}">🎖️ ${esc(t.top[0].name)} devient maire</button>` : `<button class="btn red" data-a="lg-kill" data-v="${esc(t.top[0].cid)}">Éliminer ${esc(t.top[0].name)}</button>`)
          : t.top.length ? `<p class="howto">Égalité entre ${esc(t.top.map(r => r.name).join(' et '))}. ${H.mayor ? 'Le maire tranche.' : 'On revote.'}</p>${t.top.map(r => H.vote.kind === 'maire' ? `<button class="btn paper" data-a="lg-mayor" data-v="${esc(r.cid)}">${esc(r.name)}</button>` : `<button class="btn ghost" data-a="lg-kill" data-v="${esc(r.cid)}">${esc(r.name)}</button>`).join('')}` : ''}
        ${H.vote.kind === 'exil' && t.top.length > 1 && H.players.some(p => p.alive && p.role === 'bouc') ? `<button class="btn red" data-a="lg-bouc">Égalité : le bouc émissaire meurt</button>` : ''}
        ${H.vote.kind === 'exil' && lgHas(H, 'juge') && !H.judgeUsed ? `<button class="btn ghost" data-a="lg-judge">⚖️ Le juge bègue demande un second vote</button>` : ''}
        <button class="btn ghost" data-a="lg-vote-close">Fermer le vote</button></div>`;
    const tips = [lgHas(H, 'montreur') && H.players.some(p => p.alive && p.role === 'montreur') ? "🐻 Un loup est-il assis à côté du montreur d'ours ? Si oui, grogne !" : '', lgHas(H, 'garde') ? '📯 Le garde champêtre veut-il faire une annonce ?' : '', lgHas(H, 'gitane') ? '🧿 Le spirite de la gitane pose-t-il sa question à un mort ?' : '', ...(H.mjNotes || [])].filter(Boolean);
    body = `${lgNewsCard(H.news)}${tips.length ? `<section class="panel"><h3><span>Pour le meneur</span></h3>${tips.map(x => `<p class="hint">${esc(x)}</p>`).join('')}</section>` : ''}
      ${H.cfg.phoneVote ? `${lgVoteBox(MPG.lg.view(MP_CID), true)}${voteCtl}` : `<p class="howto">Le village débat, puis vote à main levée. Touche « Éliminer » sur le condamné.</p>`}`;
  }
  const acts = p => {
    if (!p.alive) return `<span class="acts"><button class="mini" data-a="lg-revive" data-v="${esc(p.cid)}">Ramener</button></span>`;
    const pend = H.pending.some(([c, b]) => c === p.cid && b === 'mj' || c === p.cid && b === 'loups');
    let b = night ? `<button class="mini ${pend ? 'red' : ''}" data-a="lg-target" data-v="${esc(p.cid)}" aria-pressed="${pend}" aria-label="Victime de la nuit">☠</button>`
      : `<button class="mini red" data-a="lg-kill" data-v="${esc(p.cid)}">Éliminer</button>`;
    if (!night) b = `<button class="mini ${H.mayor === p.cid ? 'on' : ''}" data-a="lg-mayor" data-v="${esc(p.cid)}" aria-label="Nommer maire">🎖️</button>` + b;
    return `<span class="acts">${b}</span>`;
  };
  return `<div class="phase ${H.phase}"><small>${night ? 'Nuit' : 'Jour'} ${H.n} · ${alive} en vie</small><strong>${night ? '🌙 Le village dort' : '☀️ Le village débat'}</strong></div>
    ${win ? `<div class="banner gold"><b>${LG_WIN[win]}</b> <button class="mini" data-a="lg-end" data-v="${win}">Annoncer la fin</button></div>` : ''}
    ${H.needMayor ? `<div class="banner">Le maire est mort : il désigne son successeur. Touche 🎖️ sur le nouveau maire.</div>` : ''}
    ${alerts}${body}
    <section class="panel"><h3><span>Les joueurs</span><span>${alive} / ${n}</span></h3>${list(acts)}</section>
    <button class="btn big ${night ? '' : 'red'}" data-a="${night ? 'lg-dawn' : 'lg-night'}">${night ? '☀️ Le village se réveille' : '🌙 La nuit tombe'}</button>
    <button class="btn ghost" data-a="lg-end" data-v="">Arrêter et révéler les cartes</button>`;
}

/* --- L'écran des joueurs --- */
function lgAskBox(a) {
  const pick = MP.pick || [];
  const names = l => `<div class="vote">${l.map(n => `<button data-a="lg-pick" data-v="${esc(n)}" aria-pressed="${pick.includes(n)}">${esc(n)}</button>`).join('')}</div>`;
  let body = '';
  if (a.kind === 'pick') body = `${names(a.choices)}<div class="row">${a.skip ? `<button class="btn ghost" data-a="lg-do-skip">Personne cette nuit</button>` : ''}<button class="btn" data-a="lg-do" ${pick.length === a.count ? '' : 'disabled'}>${a.count > 1 ? `Valider (${pick.length} / ${a.count})` : 'Valider'}</button></div>`;
  else if (a.kind === 'cards' || a.kind === 'roles') body = `<div class="pick-cards">${a.cards.map((r, i) => `<button class="mini-card" data-a="lg-card" data-v="${a.kind === 'cards' ? i : r}"><span>${lgRole(r).icon}</span><b>${lgRole(r).name}</b></button>`).join('')}</div>${a.kind === 'cards' && !a.must ? `<button class="btn ghost" data-a="lg-card" data-v="keep">Garder ma carte</button>` : a.must ? '<p class="hint">Deux loups : tu dois en prendre un.</p>' : ''}`;
  else if (a.kind === 'camp') body = `<div class="row"><button class="btn paper" data-a="lg-camp" data-v="village">🐕 Chien du village</button><button class="btn red" data-a="lg-camp" data-v="loup">🐺 Loup-garou</button></div>`;
  else if (a.kind === 'fire') body = `${a.oiled.length ? `<button class="btn red" data-a="lg-fire">🔥 Mettre le feu (${esc(a.oiled.join(', '))})</button>` : ''}<p class="hint">Ou asperge une maison d'huile :</p>${names(a.choices)}<button class="btn" data-a="lg-do" ${pick.length === 1 ? '' : 'disabled'}>Asperger</button>`;
  else if (a.kind === 'witch') body = `<p class="hint">${a.victims.length ? `Victime${a.victims.length > 1 ? 's' : ''} de cette nuit : <b>${esc(a.victims.join(', '))}</b>` : 'Pas de victime des loups cette nuit.'}</p>
    ${a.vie && a.victims.length ? `<div class="row">${a.victims.map(n => `<button class="btn paper" data-a="lg-save" data-v="${esc(n)}" aria-pressed="${MP.save === n}">💚 Sauver ${esc(n)}</button>`).join('')}</div>` : `<p class="hint">${a.vie ? '' : 'Potion de vie déjà utilisée.'}</p>`}
    ${a.mort ? `<p class="hint">☠ Potion de mort sur :</p>${names(a.choices)}` : '<p class="hint">Potion de mort déjà utilisée.</p>'}
    <button class="btn" data-a="lg-witch">${MP.save || pick.length ? 'Valider' : 'Ne rien faire'}</button>`;
  return `<section class="panel ask"><h3><span>🌙 À toi de jouer</span><span>en secret</span></h3><p class="ask-t">${esc(a.title)}</p>${body}</section>`;
}
function lgGuest(v) {
  const others = v.players.map(p => `<span class="chip tap ${p.alive ? '' : 'off'}">${p.alive ? '' : '☠ '}${esc(p.name)}${lgTags(p)}</span>`).join('');
  if (v.step === 'lobby') return `${roomBox(false)}
    <section class="panel"><h3><span>Dans la partie</span><span>${v.players.length}</span></h3><div class="chips">${others}</div></section>
    <p class="howto">Le meneur prépare les cartes. Garde ton téléphone près de toi : ta carte va arriver.</p>`;
  if (v.step === 'spin') return `<div class="turn"><small>Loup-Garou</small><strong>La roue tourne…</strong></div><div class="card verso shuffle"><p class="text">Ta carte arrive</p></div>`;
  if (v.step === 'end') return `<div class="turn"><small>Fin de partie</small><strong>${LG_WIN[v.winner || '']}</strong></div>
    <div class="card">${cardIdx('☾')}<p class="kind">Toutes les cartes</p>${lgRevealList(v.reveal)}</div>
    <p class="howto">Le meneur peut relancer une partie : reste connecté·e.</p>`;
  const me = v.me || { role: 'villageois', alive: true }, R = lgRole(me.role);
  const phase = v.step === 'deal' ? `<div class="phase night"><small>Loup-Garou</small><strong>Découvre ta carte en secret</strong></div>`
    : v.phase === 'night' ? `<div class="phase night"><small>Nuit ${v.n}</small><strong>🌙 Ferme les yeux</strong></div>`
    : `<div class="phase day"><small>Jour ${v.n}</small><strong>☀️ Débattez et votez</strong></div>`;
  const facts = [
    me.mayor ? `${sash(true)}<b>Tu es le maire !</b> Ta voix compte double. Si tu meurs, tu désignes ton successeur.` : '',
    me.infected ? '🧛 Tu as été infecté·e : tu es maintenant un loup-garou, en secret.' : '',
    me.wild ? '🧒 Ton modèle est mort : tu es maintenant un loup-garou.' : '',
    me.role === 'chienloup' && me.dog ? (me.dog === 'loup' ? '🐺 Tu as rejoint la meute.' : '🐕 Tu es le fidèle chien du village.') : '',
    v.mates ? (v.mates.length ? `🐺 Tes complices : <b>${esc(v.mates.join(', '))}</b>` : '🐺 Tu es le seul loup encore en vie.') : '',
    v.lover ? `💘 Tu es amoureux·se de <b>${esc(v.lover)}</b>. Si l'un meurt, l'autre aussi.` : '',
    v.kin ? `${R.icon} ${me.role === 'soeurs' ? 'Ta sœur' : 'Tes frères'} : <b>${esc(v.kin.join(', '))}</b>` : '',
    me.charmed ? `🎶 Tu es charmé·e${v.charmed && v.charmed.length ? `, comme <b>${esc(v.charmed.join(', '))}</b>` : ''}.` : '',
    me.group ? `${me.group === 'lune' ? '🌙 Tu es du groupe de la Lune' : '☀️ Tu es du groupe du Soleil'}.` : '',
    v.model ? `🧒 Ton modèle : <b>${esc(v.model)}</b>` : '',
    v.com ? `🎭 Tes rôles : ${v.com.map(c => `${c.used ? '<s>' : ''}${lgRole(c.r).icon} ${lgRole(c.r).name}${c.used ? '</s>' : ''}`).join(', ')}` : '',
  ].filter(Boolean).map(x => `<p class="sub">${x}</p>`).join('');
  const face = MP.peek
    ? `<div class="card ${me.alive ? '' : 'dead'} ${me.mayor ? 'has-sash' : ''}" role="button" tabindex="0" data-a="lg-peek" aria-label="Cacher ma carte">${me.mayor ? sash(true) : ''}${cardIdx(R.icon)}<p class="kind">Ta carte</p><p class="role-ic" aria-hidden="true">${R.icon}</p><p class="text">${R.name}</p><p class="sub">${R.desc}</p>${facts}<p class="sub">Touche pour cacher.</p></div>`
    : `<div class="card verso" role="button" tabindex="0" data-a="lg-peek" aria-label="Voir ma carte"><p class="text">Touche pour voir ta carte</p><p class="sub">${me.mayor ? '🎖️ Tu es le maire' : 'Personne ne doit voir ton écran'}</p></div>`;
  return `${phase}${me.alive ? '' : `<div class="banner">☠ Tu es mort·e. Chut ! Tu peux suivre la partie en silence.</div>`}
    ${me.mayor && !MP.peek ? `<div class="mayor-band">${sash(true)}<span>Monsieur ou Madame le Maire</span></div>` : ''}
    ${v.ask && me.alive ? lgAskBox(v.ask) : v.res && v.phase === 'night' ? `<div class="banner gold">${esc(v.res)}</div>` : ''}
    ${lgNewsCard(v.news)}${v.phase === 'day' ? lgVoteBox(v, false) : ''}${face}
    ${v.step === 'game' ? `<section class="panel"><h3><span>Le village</span><span>${v.players.filter(p => p.alive).length} en vie</span></h3><div class="chips">${others}</div></section>` : ''}`;
}

Object.assign(actions, {
  // Composition
  'lg-w'(v) { const c = MP.H.cfg; c.loups = Math.min(8, Math.max(0, c.loups + +v)); store.set('lgCfg2', c); mpPush(); },
  'lg-sp'(r) { const c = MP.H.cfg; c.roles = c.roles.includes(r) ? c.roles.filter(x => x !== r) : c.roles.concat(r); store.set('lgCfg2', c); mpPush(); },
  'lg-preset'(k) { lgPreset(MP.H, k); store.set('lgCfg2', MP.H.cfg); mpPush(); },
  'lg-opt'(k) { const c = MP.H.cfg; c[k] = !c[k]; store.set('lgCfg2', c); mpPush(); },
  'lg-spin'() {
    const H = MP.H, d = lgCards(H);
    if (d.err) { toast(d.err); return; }
    const from = H.spin ? H.spin.to % 360 : 0;
    H.cards = shuffle(d.cards); H.step = 'spin'; H.spin = { from, to: from + 1800 + rand(360), at: Date.now() };
    mpPush();
    mpTimer('lgT', () => MP.H === H && H.step === 'spin' && lgDeal(), 3600);
  },
  'lg-respin'() { MP.H.step = 'lobby'; actions['lg-spin'](); },
  // Nuit
  'lg-start'() { Object.assign(MP.H, { step: 'game', phase: 'night', n: 1, cur: null, allDone: false, done: {}, res: {}, log: {} }); mpPush(); },
  'lg-next'() {
    const H = MP.H, steps = lgSteps(H), i = steps.findIndex(s => s.id === H.cur);
    if (i === steps.length - 1) { H.cur = null; H.allDone = true; toast('Tous les personnages ont été appelés : réveille le village.'); }
    else H.cur = steps[i + 1].id;
    if (H.cur === 'loups') sfx('howl');
    mpPush();
  },
  'lg-goto'(id) { MP.H.cur = id; if (id === 'loups') sfx('howl'); mpPush(); },
  'lg-target'(cid) {
    const H = MP.H, by = H.cur === 'loups' || !H.cur ? 'loups' : 'mj', i = H.pending.findIndex(([c, b]) => c === cid && ['loups', 'mj'].includes(b));
    if (i >= 0) H.pending.splice(i, 1); else H.pending.push([cid, by]);
    mpPush();
  },
  'lg-infect'() {
    const H = MP.H, vic = H.pending.find(([, b]) => b === 'loups');
    if (!vic) return;
    if (H.infectOn) { H.infectOn = null; H.infectUsed = false; } else { H.infectOn = vic[0]; H.infectUsed = true; H.log.infect = `${mpP(vic[0]).name} sera infecté·e au lieu de mourir.`; }
    mpPush();
  },
  'lg-dawn'() { lgDawn(); mpPush(); },
  // Jour
  'lg-night'() { const H = MP.H; Object.assign(H, { phase: 'night', n: H.n + 1, cur: null, allDone: false, done: {}, res: {}, log: {}, pending: [], news: null, vote: null, crow: null, comNight: null, mjNotes: [] }); mpPush(); },
  'lg-kill'(cid) {
    const H = MP.H, p = mpP(cid);
    if (!p || !p.alive) return;
    if (H.phase === 'day' && p.role === 'idiot' && !p.idiotOut) { p.idiotOut = true; H.news = { title: 'Le village a tranché', lines: [], empty: `${p.name} est l'idiot du village ! Gracié·e, mais ne vote plus.` }; H.vote = null; mpPush(); return; }
    const out = lgKill([[cid, H.phase === 'day' ? 'vote' : 'mj']], H.phase === 'day' ? 'vote' : 'nuit');
    if (H.phase === 'day') { H.news = lgNewsOf('Le village a tranché', out, 'vote'); H.vote = null; }
    mpPush();

function vgDraw(H, key, list) {
  H.used = H.used || {};

  let free = list.map((_, i) => i).filter(i => !u.includes(i));
  if (!free.length) { H.used[key] = []; free = list.map((_, i) => i); }
  const i = free[rand(free.length)];
  H.used[key].push(i);
  return list[i];
}

  const H = MP.H, cur = avCur(H), kind = k === 'random' ? (rand(2) ? 'action' : 'verite') : k;
  const txt = vgDraw(H, 'av' + H.level + kind, AV_CARDS[H.level][kind]);
  Object.assign(H, { step: 'card', card: { kind, html: vgFill(txt, vgOther(H, cur.cid)) }, react: {}, gage: null });
  mpPush();
}
function avEnd(how) {
  const H = MP.H, cur = avCur(H);
  if (how === 'joker') { cur.jokers = (cur.jokers || 0) + 1; H.gage = vgDraw(H, 'gage', VG_GAGES); } else cur.done = (cur.done || 0) + 1;
  H.step = 'after'; mpPush();
}
function avScreen(v) {
  const host = MP.role === 'host';
  if (v.step === 'lobby') return vgLobby(v, 'av-start', `<section class="panel"><h3><span>Niveau</span></h3>${vgLevelBox(v.level, 'av-level')}<p class="hint">Soft pour tout le monde, Piquant pour les grands.</p></section>`);
  const scores = `<section class="panel"><h3><span>Les braves</span><span>défis · jokers</span></h3><div class="chips">${v.players.slice().sort((a, b) => b.done - a.done).map(p => `<span class="chip tap ${p.name === v.turn ? 'on' : ''}">${esc(p.name)}<span class="n">${p.done}${p.jokers ? ` · ${p.jokers}🃏` : ''}</span></span>`).join('')}</div></section>`;
  const head = `<div class="turn"><small>Tour ${v.n + 1}</small><strong>${v.myTurn ? 'À toi !' : esc(v.turn || '…')}</strong></div>`;
  if (v.step === 'choose') return `${head}
    ${v.myTurn ? `<div class="av-pick"><button class="btn big" data-a="av-pick" data-v="action">Action</button><button class="btn big red" data-a="av-pick" data-v="verite">Vérité</button></div><button class="btn ghost" data-a="av-pick" data-v="random">🎲 Au hasard</button>`
      : `<div class="card verso"><p class="text">${esc(v.turn)} choisit…</p><p class="sub">Action ou Vérité ?</p></div>`}
    ${host && !v.myTurn ? `<button class="btn ghost" data-a="av-skip">Passer ce joueur</button>` : ''}${scores}`;
  const card = v.card ? `<div class="card ${v.card.kind === 'verite' ? 'black' : ''}">${cardIdx(v.card.kind === 'action' ? 'A' : 'V')}<p class="kind">${v.card.kind === 'action' ? 'Action' : 'Vérité'} pour ${esc(v.turn)}</p><p class="text">${v.card.html}</p></div>` : '';
  const reacts = `<div class="reacts">${VG_REACT.map(e => `<button data-a="av-react" data-v="${e}" aria-label="Réagir ${e}">${e}<b>${v.react[e] || ''}</b></button>`).join('')}</div>`;
  if (v.step === 'card') return `${head}${card}${reacts}
    ${v.myTurn ? `<div class="row"><button class="btn" data-a="av-done">Fait ✓</button><button class="btn ghost" data-a="av-joker">Joker (un gage)</button></div>` : `<p class="howto">On attend que ${esc(v.turn)} relève le défi…</p>`}
    ${host && !v.myTurn ? `<button class="btn ghost" data-a="av-force">Valider pour ${esc(v.turn)}</button>` : ''}${scores}`;
  return `${head}${card}
    ${v.gage ? `<div class="card compact"><p class="kind">Joker ! Gage pour ${esc(v.turn)}</p><p class="text">${esc(v.gage)}</p></div>` : `<div class="banner gold">Bravo ${esc(v.turn)} ! 👏</div>`}
    ${host ? `<button class="btn big" data-a="av-next">Joueur suivant</button>${vgLevelBox(v.level, 'av-level')}` : `<p class="howto">L'hôte passe au joueur suivant.</p>`}${scores}`;
}
Object.assign(actions, {
  'tp-level'(k) { MP.H.level = k; store.set('tpLevel', k); mpPush(); },
  'tp-start'() { MP.H.players = MP.H.players.filter(p => p.on); tpNext(); },
  'tp-vote'(c) { sfx('tick'); mpSend({ t: 'tp-vote', c: +c }); },
  'tp-reveal'() { tpReveal(); },
  'tp-next'() { tpNext(); },
  'av-level'(k) { MP.H.level = k; store.set('avLevel', k); mpPush(); },
  'av-start'() { const H = MP.H; H.players = H.players.filter(p => p.on); Object.assign(H, { order: shuffle(H.players.map(p => p.cid)), turn: 0, step: 'choose' }); mpPush(); },
  'av-pick'(k) { mpSend({ t: 'av-pick', k }); },
  'av-done'() { mpSend({ t: 'av-done' }); },
  'av-joker'() { mpSend({ t: 'av-done', joker: true }); },
  'av-react'(e) { mpSend({ t: 'av-react', e }); },
  'av-force'() { avEnd('done'); },
  'av-skip'() { const H = MP.H; H.turn++; mpPush(); },
  'av-next'() {
    const H = MP.H;
    H.players.filter(p => p.on && !H.order.includes(p.cid)).forEach(p => H.order.push(p.cid)); // les nouveaux venus prennent la file
    Object.assign(H, { turn: H.turn + 1, n: H.n + 1, step: 'choose', card: null, gage: null, react: {} }); mpPush();
  },
});

/* ---------- Décor : un village dans une clairière, au cœur de la forêt ---------- */
// Nuit étoilée par défaut ; l'aube se lève sur la forêt pendant le jour du Loup-Garou.
(function forestDecor() {
  const R = (a, b) => a + Math.random() * (b - a);
  const stars = Array.from({ length: 60 }, () => `<circle cx="${R(0, 400).toFixed(1)}" cy="${R(8, 460).toFixed(1)}" r="${R(.5, 1.7).toFixed(2)}" style="animation-delay:${R(0, 4).toFixed(2)}s"/>`).join('');
  // Un sapin : trois étages de branches
  const pine = (x, y, h, cls) => { const w = h * .46; return `<polygon class="${cls}" points="${x},${y - h} ${x + w * .32},${y - h * .62} ${x + w * .2},${y - h * .62} ${x + w * .44},${y - h * .3} ${x + w * .3},${y - h * .3} ${x + w * .5},${y} ${x - w * .5},${y} ${x - w * .3},${y - h * .3} ${x - w * .44},${y - h * .3} ${x - w * .2},${y - h * .62} ${x - w * .32},${y - h * .62}"/><rect class="${cls}" x="${x - 1.5}" y="${y - 2}" width="3" height="8"/>`; };
  const row = (from, to, step, y, h, cls, jitter) => { let s = ''; for (let x = from; x <= to; x += step) s += pine(x + R(-jitter, jitter), y + R(-6, 6), h * R(.8, 1.2), cls); return s; };
  const base = 610;
  const houses = [[154, 22, 22], [174, 18, 30], [190, 24, 20], [228, 22, 26], [248, 18, 19], [264, 24, 25], [286, 18, 18]];
  const house = ([x, w, h]) => `<rect class="wall" x="${x}" y="${base - h}" width="${w}" height="${h + 10}"/>
    <polygon class="roof" points="${x - 3},${base - h} ${x + w + 3},${base - h} ${x + w / 2},${base - h - 11}"/>
    <rect class="win" x="${x + w * .22}" y="${base - h + 6}" width="4" height="5"/>${w > 19 ? `<rect class="win w2" x="${x + w * .6}" y="${base - h + 6}" width="4" height="5"/>` : ''}`;
  const flies = Array.from({ length: 12 }, () => `<circle cx="${R(20, 380).toFixed(1)}" cy="${R(600, 780).toFixed(1)}" r="1.7" style="animation-delay:${R(0, 7).toFixed(2)}s;animation-duration:${R(5, 9).toFixed(1)}s"/>`).join('');
  const el = document.createElement('div');
  el.id = 'scene'; el.setAttribute('aria-hidden', 'true');
  el.innerHTML = `<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice">
    <g class="stars">${stars}</g>
    <circle class="moon-glow" cx="312" cy="128" r="60"/><circle class="moon" cx="312" cy="128" r="26"/><circle class="crater" cx="304" cy="120" r="4"/><circle class="crater" cx="320" cy="136" r="3"/>
    <circle class="sun-glow" cx="80" cy="420" r="90"/><circle class="sun" cx="80" cy="420" r="30"/>
    <path class="hill far" d="M0 540 C 70 505 130 528 200 500 C 270 474 330 512 400 490 L400 800 L0 800Z"/>
    <g>${row(-10, 410, 13, 528, 34, 'p-far', 4)}</g>
    <path class="hill mid" d="M0 600 C 70 578 140 598 210 590 C 290 580 340 598 400 586 L400 800 L0 800Z"/>
    <g>${row(-10, 130, 15, 606, 52, 'p-mid', 4)}${row(310, 410, 15, 600, 52, 'p-mid', 4)}</g>
    <rect class="wall" x="208" y="${base - 58}" width="14" height="68"/><polygon class="roof" points="205,${base - 58} 225,${base - 58} 215,${base - 84}"/>
    <rect class="belfry" x="212" y="${base - 52}" width="6" height="9" rx="3"/>
    ${houses.map(house).join('')}
    <ellipse class="fog f1" cx="200" cy="625" rx="260" ry="16"/>
    <path class="hill near" d="M0 690 C 90 664 180 690 260 672 C 330 656 370 672 400 664 L400 800 L0 800Z"/>
    <path class="stream" d="M-10 770 C 70 740 150 788 240 758 S 360 742 410 766"/>
    <path class="stream shine" d="M-10 770 C 70 740 150 788 240 758 S 360 742 410 766"/>
    <g>${pine(18, 800, 210, 'p-near')}${pine(70, 806, 150, 'p-near')}${pine(352, 800, 200, 'p-near')}${pine(398, 806, 160, 'p-near')}</g>
    <ellipse class="fog f2" cx="200" cy="735" rx="300" ry="20"/>
    <g class="flies">${flies}</g>

  document.body.prepend(el);

/* ---------- Musique : une valse de guinguette, accordéon et guitare ---------- */
const VG_PROG = [[43, [0, 4, 7]], [40, [0, 3, 7]], [36, [0, 4, 7]], [38, [0, 4, 7, 10]], [43, [0, 4, 7]], [47, [0, 3, 7]], [36, [0, 4, 7]], [38, [0, 4, 7, 10]]];
const G_MAJ = [7, 9, 11, 0, 2, 4, 6];
const FC_PROG = [[45, [0, 3, 7]], [41, [0, 4, 7]], [48, [0, 4, 7]], [43, [0, 4, 7]]]; // la mineur, fa, do, sol
let fcMel = 76;
let vgMel = 74;
function vgStep(m, k) { // k pas dans la gamme de sol majeur
  let n = m;
  for (let i = 0; i < Math.abs(k); i++) { n += Math.sign(k); while (!G_MAJ.includes(((n % 12) + 12) % 12)) n += Math.sign(k); }
  return Math.min(81, Math.max(67, n));
}
Object.assign(APP, {
  tuneLabel: 'Feu de camp ou guinguette',
  ambLabel: 'La forêt : vent, ruisseau, grillons, chouette, loups au loin',
  sfxLabel: 'Roue, cartes, cloche du village, dessins…',
  tunes: {
    // Feu de camp : guitare en arpèges et petite flûte, en la mineur
    feu: { label: 'Feu de camp', bpm: 76, div: 3, play(step, t, sd) {
      const s = step % 12, barN = Math.floor(step / 12), [root, iv] = FC_PROG[barN % 4];
      const arp = [0, 7, 12, iv[1] + 12, 12, 7];
      INST.pluck(t, root + 12 + arp[s % 6], .04, .5);
      if (s === 0 || s === 6) INST.bass(t, root, sd * 5, .16);
      if (barN % 8 >= 2 && Math.random() < (s % 3 ? .06 : .22)) { fcMel = [69, 72, 74, 76, 79, 81][Math.max(0, Math.min(5, [69, 72, 74, 76, 79, 81].indexOf(fcMel) + [-1, 0, 1, 1, -1][rand(5)]))] || 76; INST.flute(t, fcMel, sd * (3 + rand(4)), .035); }
    } },
    guinguette: { label: 'Guinguette', bpm: 104, div: 2, play(step, t, sd) {
      const s = step % 6, barN = Math.floor(step / 6), bar = barN % 8, [root, iv] = VG_PROG[bar];
      if (s === 0) INST.bass(t, barN % 16 >= 8 && bar % 2 ? root + 7 : root, sd * 1.6, .2);
      if (s === 2 || s === 4) iv.slice(0, 3).forEach((i, k) => INST.pluck(t + k * .014, root + 12 + i, .045));
      if (barN % 16 >= 12) return; // l'accordéon respire
      const p = { 0: .9, 2: .55, 4: .6, 5: .22 }[s] || 0;
      if (Math.random() > p) return;
      if (s === 0) { // sur le premier temps, une note de l'accord
        const tones = iv.map(i => (root + i) % 12);
        let best = vgMel;
        for (let d = 0; d <= 5; d++) { if (tones.includes((vgMel + d) % 12)) { best = vgMel + d; break; } if (tones.includes((vgMel - d + 12) % 12)) { best = vgMel - d; break; } }
        vgMel = Math.min(81, Math.max(67, best));
      } else vgMel = vgStep(vgMel, [-2, -1, -1, 1, 1, 2][rand(6)]);
      INST.musette(t, vgMel, s === 5 ? sd * .8 : sd * 1.7, .045);
    } },
  },
  ambiances: {
    // Nuit d'été : vent léger, ruisseau au loin, grillons, crapaud, chouette
    night(out, parts) { vWind(out, parts, .011); vStream(out, parts, .032); vCrickets(out, parts, 4, .011);
      every(parts, 2.1, 2.7, t => tone(out, t, 1260, .09, .009, { a: .01, pan: -.55 }));
      every(parts, 24, 50, t => SFX.owl(t, out, .7));
      every(parts, 45, 90, t => SFX.howl(t, out, .35)); },
    // Soir : les grillons commencent, un merle chante encore
    evening(out, parts) { vWind(out, parts, .009); vStream(out, parts, .028); vCrickets(out, parts, 2, .008); vBirds(out, parts, .011, 7, 16); },
    // Après-midi : cigales, oiseaux, brise
    day(out, parts) { vWind(out, parts, .007); vCicadas(out, parts, .045); vBirds(out, parts, .015, 3, 8); vStream(out, parts, .014); },
  },
  scene: veilleeScene,
  decor() {
    const v = S.screen === 'mp' ? lgView() : null;
    document.body.dataset.scene = v && v.step === 'game' && v.phase === 'day' ? 'day' : 'night';
  },
});
const vWind = (out, parts, v) => loopNoise(out, parts, { f: 340, q: .4, v, lfoF: .05, lfoDepth: 140, lfoV: v * .5 });
function vStream(out, parts, v) {
  const a = loopNoise(out, parts, { buf: SON.noise, type: 'bandpass', f: 1700, q: .8, v, pan: .35 });
  const b = loopNoise(out, parts, { buf: SON.noise, type: 'bandpass', f: 700, q: .9, v: v * .8, pan: .45 });
  every(parts, .07, .16, t => {
    a.g.gain.setTargetAtTime(v * (.35 + Math.random()), t, .04);
    a.fl.frequency.setTargetAtTime(1300 + rand(1400), t, .05);
    b.g.gain.setTargetAtTime(v * .8 * (.4 + Math.random() * .8), t, .06);
  });
}
function vCrickets(out, parts, n, v) {
  for (let k = 0; k < n; k++) {
    const f = 4300 + k * 330 + rand(150), pan = [-.7, .5, -.2, .8][k % 4], rate = .6 + Math.random() * .5;
    every(parts, rate, rate * 1.35, t => { const pulses = 3 + rand(2); for (let i = 0; i < pulses; i++) tone(out, t + i * .042, f, .018, v * (.6 + Math.random() * .4), { a: .003, pan }); });
  }
}
function vBirds(out, parts, v, min, max) {
  every(parts, min, max, t => {
    const n = 2 + rand(4), b = 2300 + rand(1500), pan = Math.random() * 1.6 - .8;
    for (let i = 0; i < n; i++) tone(out, t + i * .13, b + rand(500), .07, v, { to: b + 800 + rand(700), a: .012, pan });
  });
}
function vCicadas(out, parts, v) {
  [[-.6, 6200, 210], [.55, 5600, 185]].forEach(([pan, f, am]) => {
    const c = SON.ctx, src = c.createBufferSource(), bp = c.createBiquadFilter(), mod = c.createGain(), g = c.createGain(), osc = c.createOscillator(), d = c.createGain();
    src.buffer = SON.noise; src.loop = true;
    bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 3;
    mod.gain.value = .5; osc.type = 'square'; osc.frequency.value = am; d.gain.value = .5;
    osc.connect(d); d.connect(mod.gain);
    g.gain.value = .0001;
    src.connect(bp); bp.connect(mod); mod.connect(g); route(g, out, 0, pan);
    src.start(); osc.start(); parts.push(src, osc);
    // Une cigale chante par vagues : elle monte, tient, puis se tait
    every(parts, 5, 11, t => { g.gain.setTargetAtTime(v * (.6 + Math.random() * .4), t, .8); g.gain.setTargetAtTime(.0001, t + 2.5 + Math.random() * 3, .6); });
  });
}
function lgView() { return MP && MP.game === 'lg' ? (MP.role === 'host' ? MPG.lg.view(MP_CID) : MP.view) : null; }
// Ambiance du Loup-Garou : soir dans le salon, nuit dès la distribution, puis nuit ou jour selon la partie
function veilleeScene() {
  const v = S.screen === 'mp' ? lgView() : null;
  if (!v) return null;
  if (v.step === 'game') return v.phase;
  return v.step === 'deal' ? 'night' : 'evening';
}

/* ---------- Bruitages des jeux ---------- */
MPG.lg.sound = (prev, v) => {
  if (v.step === 'spin' && prev.step !== 'spin') sfx(MP.role === 'host' ? 'wheel' : 'shuffle', 3400);
  if (v.step === 'deal' && prev.step !== 'deal') sfx('deal');
  if (v.step === 'game' && (prev.step !== 'game' || prev.phase !== v.phase || prev.n !== v.n)) sfx(v.phase === 'night' ? 'owl' : 'bell');
  const alive = l => l.filter(p => p.alive).length;
  if (v.step === 'game' && alive(v.players) < alive(prev.players)) setTimeout(() => sfx('death'), v.phase === 'day' && prev.phase === 'night' ? 1900 : 0);
  if (v.step === 'end' && prev.step !== 'end') sfx('tada');
  if (v.lover && !prev.lover) sfx('reveal');
  const mayor = l => (l.find(p => p.mayor) || {}).name;
  if (mayor(v.players) && mayor(v.players) !== mayor(prev.players)) sfx('fanfare');
  if (v.ask && !(prev.ask && prev.ask.id === v.ask.id)) sfx('ping');
  if (v.vote && !prev.vote) sfx('pop');
  if (v.vote && v.vote.revealed && !(prev.vote && prev.vote.revealed)) sfx('reveal');
};
MPG.gp.sound = (prev, v) => {
  if (v.task && (!prev.task || prev.task.id !== v.task.id)) sfx('pop');
  if (v.step === 'album' && v.album && (prev.step !== 'album' || !prev.album || v.album.items.length !== prev.album.items.length || v.album.c !== prev.album.c)) sfx('flip');
  if (v.step === 'end' && prev.step !== 'end') sfx('tada');
};

start();
</script>
