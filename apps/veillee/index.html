<style>
/* La Veillée : bleu nuit, comme une veillée au coin du feu */
:root { --felt: #121a33; --felt-2: #1d2a52; --felt-line: #34457a; --muted: #aab5d8; }
.wheel-box { flex: none; position: relative; width: min(100%, 330px); aspect-ratio: 1; max-width: 100%; margin: 6px auto 0; }
.wheel { pointer-events: none; width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 0 0 6px var(--paper), 0 16px 36px rgba(0,0,0,.45); }
.pointer { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--gold); z-index: 2; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
.phase { text-align: center; padding: 16px; border-radius: var(--r); display: flex; flex-direction: column; gap: 2px; }
.phase.night { background: #0c1a33; border: 1px solid #263a63; color: #e1e8ff; }
.phase.day { background: var(--gold); color: var(--ink); }
.phase small { text-transform: uppercase; letter-spacing: .14em; font-size: .75rem; font-weight: 800; opacity: .8; }
.phase strong { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 8vw, 2rem); line-height: 1.15; }
.steps-mj { display: flex; flex-direction: column; gap: 8px; }
.step-mj { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 var(--paper-edge); }
.step-mj .step-go { display: flex; gap: 12px; text-align: left; color: var(--ink); }
.step-mj .ic { font-size: 1.5rem; flex: none; width: 1.4em; text-align: center; }
.step-mj b { display: block; }
.step-mj b i { font-weight: 600; font-size: .8rem; color: var(--ink-soft); }
.step-mj .t { font-family: var(--font-card); font-style: italic; font-size: 1rem; line-height: 1.4; display: block; }
.step-mj small { display: block; color: var(--ink-soft); font-size: .82rem; margin-top: 4px; }
.step-mj.done { opacity: .5; }
.step-mj .potions { gap: 8px; padding-left: calc(1.4em + 12px); }
.step-mj .potions > * { flex: 0 0 auto; }
.step-mj .mini { border: 1px solid var(--paper-edge); background: #fff; }
.step-mj .mini.red { border-color: var(--red); background: var(--red); }
.card .role-ic { font-size: 4.2rem; line-height: 1; text-align: center; }
.card.dead { filter: grayscale(.85); }
.card.verso.shuffle { animation: shuffle .45s ease-in-out infinite alternate; }
@keyframes shuffle { from { transform: rotate(-4deg) scale(.98); } to { transform: rotate(4deg) scale(1.02); } }
@media (prefers-reduced-motion: reduce) { .card.verso.shuffle { animation: none; } }
/* Téléphone dessiné */
.gp-compose { display: flex; flex-direction: column; gap: 12px; }
.gp-canvas { width: 100%; aspect-ratio: 1; display: block; background: #fff; border-radius: 14px; touch-action: none; cursor: crosshair; box-shadow: 0 3px 0 var(--paper-edge), 0 12px 28px rgba(0,0,0,.3); }
.gp-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--felt); box-shadow: 0 0 0 2px var(--felt-line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--gold); }
.tool-b { min-width: 42px; height: 42px; border-radius: 10px; background: rgba(0,0,0,.25); border: 1px solid var(--felt-line); font-weight: 700; font-size: .88rem; padding: 0 10px; display: inline-grid; place-items: center; }
.tool-b[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.size-dot { display: block; border-radius: 50%; background: currentColor; }
.gp-prompt { background: var(--paper); color: var(--ink); border-radius: 14px; padding: 14px 16px; text-align: center; font-family: var(--font-card); font-size: clamp(1.2rem, 5.5vw, 1.45rem); line-height: 1.3; overflow-wrap: anywhere; }
.gp-prompt small { display: block; font-family: var(--font-body); font-size: .75rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 800; color: var(--red); margin-bottom: 2px; }
.gp-img { width: 100%; aspect-ratio: 1; border-radius: 14px; background: #fff; display: block; object-fit: contain; box-shadow: 0 3px 0 var(--paper-edge); }
#gpText { font: 1.1rem/1.4 var(--font-body); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--paper-edge); background: #fff; color: var(--ink); width: 100%; box-sizing: border-box; resize: none; }
.gp-time { font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; color: var(--paper); min-height: 1.2em; }
.album { display: flex; flex-direction: column; gap: 14px; }
.album .it { display: flex; flex-direction: column; gap: 4px; animation: deal .35s cubic-bezier(.2,.9,.3,1.2); }
.album .by { font-size: .8rem; color: var(--muted); font-weight: 700; }
.bub { background: var(--paper); color: var(--ink); padding: 12px 16px; border-radius: 16px; font-family: var(--font-card); font-size: 1.25rem; line-height: 1.3; overflow-wrap: anywhere; }
.bub.miss { font-style: italic; color: var(--ink-soft); font-size: 1rem; }
@media (prefers-reduced-motion: reduce) { .album .it { animation: none; } }
</style>

  hooks: ['La nuit tombe sur le village…', 'Qui est le loup ? Personne ne le sait.', 'Ton dessin va finir en catastrophe. Et c\'est le but.', 'Ce soir, on ne fait confiance à personne.', 'Une phrase, dix dessins, zéro rapport.'],
  deal: ['🌙', '🐺', '✏️'],
  games: [

  legal: {

      ['Public concerné', `<p>La Veillée est tout public. Les morts du Loup-Garou sont fictives et font partie du jeu. Les phrases et dessins du Téléphone dessiné sont créés par les joueurs, qui restent responsables de ce qu'ils écrivent et dessinent : on reste bienveillant, surtout avec des enfants autour de la table.</p>
        <p>Les moins de 15 ans utilisent l'application avec l'accord d'un parent.</p>`],
    ],
    ip: `<p>Le Loup-Garou est un jeu de société traditionnel dont les règles sont libres. « Les Loups-garous de Thiercelieux » est une marque de ses ayants droit : La Veillée n'y est pas affiliée et n'en reprend ni les illustrations ni les textes. Le Téléphone dessiné reprend le principe du jeu du téléphone (ou « téléphone arabe ») en dessin ; La Veillée n'est affiliée à aucun autre jeu ou service du même genre.</p>`,
  },
};
</script>
<script src="shared/salon.js"></script>
<script>
const WHEEL_COLORS = [['--red', '--paper'], ['--paper', '--ink'], ['--gold', '--ink'], ['--felt-2', '--fg']];
function wheelSvg(segs, angle) {
  const n = segs.length, seg = 360 / n, R = 96, C = 100;
  const pt = a => [C + R * Math.cos((a - 90) * Math.PI / 180), C + R * Math.sin((a - 90) * Math.PI / 180)];
  const fs = n <= 6 ? 10 : n <= 10 ? 8.5 : 7;
  const parts = segs.map((sg, i) => {
    const [bg, fg] = WHEEL_COLORS[i % WHEEL_COLORS.length === 0 && i === n - 1 && n % 4 === 1 ? 1 : i % WHEEL_COLORS.length];
    const [x0, y0] = pt(i * seg), [x1, y1] = pt((i + 1) * seg);
    const label = sg.label.length > 13 ? sg.label.slice(0, 12) + '…' : sg.label;
    const mid = i * seg + seg / 2;
    return `<path d="M${C} ${C}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" style="fill:var(${bg});stroke:var(--felt);stroke-width:1"/>
      <text x="${C + R - 8}" y="${C}" transform="rotate(${mid - 90} ${C} ${C})" text-anchor="end" dominant-baseline="middle" style="fill:var(${fg});font:800 ${fs}px var(--font-body)">${esc(label)}</text>`;
  }).join('');
  return `<div class="wheel-box"><span class="pointer" aria-hidden="true"></span>
    <svg class="wheel" id="wheel" viewBox="0 0 200 200" role="img" aria-label="Roue" style="transform:rotate(${angle}deg)">${parts}
      <circle cx="100" cy="100" r="14" style="fill:var(--paper);stroke:var(--red);stroke-width:3"/></svg></div>`;
}

/* ---------- Loup-Garou ---------- */
const LG_ROLES = {
  loup: { name: 'Loup-Garou', short: 'Loup', icon: '🐺', desc: "Chaque nuit, avec les autres loups, tu choisis une victime. Le jour, fais-toi passer pour un innocent villageois." },
  villageois: { name: 'Simple villageois', short: 'Villageois', icon: '🧑‍🌾', desc: "Aucun pouvoir, juste ton flair et ta voix au vote. Démasque les loups avant qu'il ne soit trop tard." },
  voyante: { name: 'Voyante', short: 'Voyante', icon: '🔮', desc: "Chaque nuit, tu découvres la vraie carte d'un joueur de ton choix. Aide le village sans te faire repérer." },
  sorciere: { name: 'Sorcière', short: 'Sorcière', icon: '🧪', desc: "Deux potions, une seule fois chacune : la potion de vie sauve la victime des loups, la potion de mort élimine qui tu veux." },
  chasseur: { name: 'Chasseur', short: 'Chasseur', icon: '🏹', desc: "Si tu meurs, tu tires une dernière balle : tu emportes immédiatement le joueur de ton choix." },
  cupidon: { name: 'Cupidon', short: 'Cupidon', icon: '💘', desc: "La première nuit, tu désignes deux amoureux. Si l'un meurt, l'autre meurt de chagrin. Ensemble, ils peuvent gagner seuls." },
  petitefille: { name: 'Petite fille', short: 'Petite fille', icon: '👧', desc: "Pendant le tour des loups, tu peux entrouvrir les yeux pour les espionner. S'ils te surprennent, tu deviens leur proie." },
  salvateur: { name: 'Salvateur', short: 'Salvateur', icon: '🛡️', desc: "Chaque nuit, tu protèges un joueur de l'attaque des loups (toi compris), jamais le même deux nuits de suite." },
  ancien: { name: 'Ancien', short: 'Ancien', icon: '👴', desc: "Tu survis à la première attaque des loups. Mais si le village t'élimine, les villageois perdent tous leurs pouvoirs." },
  idiot: { name: 'Idiot du village', short: 'Idiot', icon: '🤪', desc: "Si le village vote contre toi, tu montres ta carte et tu restes en vie… mais tu ne votes plus." },
  loupblanc: { name: 'Loup blanc', short: 'Loup blanc', icon: '🐺', desc: "Tu te réveilles avec les loups, mais une nuit sur deux tu peux dévorer l'un d'eux. Tu gagnes seul : sois le dernier debout." },
};
const LG_SPECIALS = ['voyante', 'sorciere', 'chasseur', 'cupidon', 'petitefille', 'salvateur', 'ancien', 'idiot', 'loupblanc'];
const LG_NIGHT = [
  { id: 'cupidon', icon: '💘', title: 'Cupidon', first: true, text: "Cupidon, réveille-toi. Désigne les deux personnes qui tomberont follement amoureuses… Cupidon, rendors-toi.", note: "Touche 💘 sur les deux amoureux : ils le verront sur leur téléphone." },
  { id: 'amoureux', icon: '💞', title: 'Les amoureux', first: true, need: 'cupidon', text: "Amoureux, regardez votre téléphone, ouvrez les yeux et reconnaissez-vous… Puis rendormez-vous." },
  { id: 'salvateur', icon: '🛡️', title: 'Salvateur', text: "Salvateur, réveille-toi. Qui protèges-tu cette nuit ?… Salvateur, rendors-toi.", note: "Jamais le même joueur deux nuits de suite." },
  { id: 'voyante', icon: '🔮', title: 'Voyante', text: "Voyante, réveille-toi. Désigne la personne dont tu veux connaître la carte… Voyante, rendors-toi.", note: "Fais-lui comprendre le rôle par un geste ou à l'oreille, sans montrer ton écran." },
  { id: 'loup', icon: '🐺', title: 'Loups-garous', text: "Loups-garous, réveillez-vous. Mettez-vous d'accord en silence sur votre victime… Loups-garous, rendormez-vous.", note: "Touche ☠ sur la victime." },
  { id: 'loupblanc', icon: '🐺', title: 'Loup blanc', even: true, text: "Loup blanc, réveille-toi. Veux-tu dévorer un loup-garou ?… Loup blanc, rendors-toi.", note: "Une nuit sur deux. S'il dévore un loup, touche ☠ sur ce loup." },
  { id: 'sorciere', icon: '🧪', title: 'Sorcière', text: "Sorcière, réveille-toi. Voici la victime de cette nuit. Veux-tu utiliser ta potion de vie ? Ta potion de mort ?… Sorcière, rendors-toi.", note: "Potion de vie : retire le ☠ de la victime. Potion de mort : touche ☠ sur sa cible." },
];
const LG_WIN = { village: 'Le village gagne !', loups: 'Les loups-garous gagnent !', amoureux: 'Les amoureux gagnent !', loupblanc: 'Le loup blanc gagne seul !', personne: 'Plus personne en vie…', '': 'Partie terminée' };
const lgAuto = n => n >= 18 ? 4 : n >= 12 ? 3 : n >= 7 ? 2 : 1;
const isWolf = r => r === 'loup' || r === 'loupblanc';
const lgRole = r => LG_ROLES[r] || LG_ROLES.villageois;
function lgDeck(H) {
  const n = H.players.length, c = H.cfg;
  const w = Math.min(Math.max(c.wolves || lgAuto(n), 1), Math.max(1, Math.floor((n - 1) / 2)));
  const sp = LG_SPECIALS.filter(r => c.sp.includes(r));
  const vil = n - w - sp.length;
  return { w, sp, vil, err: n < 4 ? 'Il faut au moins 4 joueurs connectés.' : vil < 0 ? `Trop de cartes spéciales pour ${n} joueurs : retire-en ${-vil}.` : '', cards: [...Array(w).fill('loup'), ...sp, ...Array(Math.max(vil, 0)).fill('villageois')] };
}
function lgWinner(H) {
  const a = H.players.filter(p => p.alive);
  if (!a.length) return 'personne';
  if (H.lovers.length === 2 && a.length === 2 && a.every(p => H.lovers.includes(p.cid))) return 'amoureux';
  if (a.length === 1 && a[0].role === 'loupblanc') return 'loupblanc';
  if (!a.some(p => isWolf(p.role))) return 'village';
  if (a.every(p => isWolf(p.role)) && !a.some(p => p.role === 'loupblanc')) return 'loups';
  return null;
}
// Élimine des joueurs ; un amoureux emporte l'autre dans la mort
function lgKill(cids) {
  const H = MP.H, out = [];
  const kill = (p, why) => { if (!p || !p.alive) return; p.alive = false; out.push({ name: p.name, role: p.role, why }); };
  cids.forEach(cid => kill(mpP(cid)));
  out.slice().forEach(d => {
    const p = H.players.find(x => x.name === d.name);
    if (H.lovers.length === 2 && H.lovers.includes(p.cid)) kill(mpP(H.lovers.find(c => c !== p.cid)), 'chagrin');
  });
  return out;
}
const lgNews = (title, out) => ({ title, lines: out });
MPG.lg = {
  narrator: true, // le créateur de la partie est le maître du jeu : il ne joue pas
  after: () => lgSpinAnim(),
  rules: () => ({ title: 'Loup-Garou', steps: [
    "Le maître du jeu (MJ) crée la partie sur son téléphone et donne le code. Il ne joue pas : il raconte et arbitre.",
    "Chaque joueur ouvre La Veillée sur son téléphone, touche « Rejoindre une partie » et tape le code.",
    "Le MJ choisit les cartes (nombre de loups, rôles spéciaux) puis lance la roue : chacun reçoit sa carte en secret sur son téléphone.",
    "La nuit, tout le monde ferme les yeux. Le MJ suit le déroulé affiché et appelle les rôles un par un ; il touche ☠ sur la victime des loups.",
    "Au réveil, le MJ annonce les morts, dont la carte est révélée. Le village débat, puis vote pour éliminer un suspect.",
    "Le village gagne s'il élimine tous les loups. Les loups gagnent s'ils dévorent tous les villageois. Les amoureux gagnent s'ils sont les deux derniers.",
  ], tips: [
    "Les morts gardent le silence jusqu'à la fin de la partie.",
    "Si un téléphone se met en veille ou perd le réseau, il se reconnecte tout seul et retrouve sa carte.",
    "Si le téléphone du MJ redémarre, il peut reprendre la partie depuis l'accueil.",
    "Le MJ voit toutes les cartes : qu'il garde son écran caché !",
  ] }),
  init: () => ({ step: 'lobby', players: [], cfg: store.get('lgCfg', { wolves: 0, sp: ['voyante', 'sorciere', 'chasseur'], mates: true }), phase: 'night', n: 1, pending: [], checks: {}, potions: { vie: true, mort: true }, lovers: [], news: null, winner: null, spin: null, cards: [] }),
  resume() { const H = MP.H; if (H.step === 'spin') lgDeal(); },
  act(cid, d) {
    const p = mpP(cid);
    if (d.t === 'seen' && p && !p.seen) { p.seen = true; mpPush(); }
  },
  view(cid) {
    const H = MP.H, p = mpP(cid);
    const v = { game: 'lg', step: H.step, phase: H.phase, n: H.n, winner: H.winner, news: H.phase === 'day' ? H.news : null,
      players: H.players.map(x => ({ name: x.name, on: !!x.on, alive: x.alive !== false })) };
    if (p && p.role && ['deal', 'game', 'end'].includes(H.step)) {
      v.me = { name: p.name, role: p.role, alive: p.alive };
      if (H.cfg.mates && isWolf(p.role)) v.mates = H.players.filter(x => x !== p && isWolf(x.role)).map(x => x.name);
      if (H.lovers.length === 2 && H.lovers.includes(cid)) v.lover = (mpP(H.lovers.find(c => c !== cid)) || {}).name;
    }
    if (H.step === 'end') v.reveal = H.players.map(x => ({ name: x.name, role: x.role, alive: x.alive }));
    return v;
  },
  notify(prev, v) {
    const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
    if (v.step === 'deal' && (!prev || prev.step !== 'deal')) { MP.peek = false; MP.saidSeen = false; buzz([80, 60, 80]); }
    if (prev && (prev.phase !== v.phase || prev.n !== v.n)) MP.peek = false; // carte recachée à chaque nuit et chaque jour
    if (prev && prev.me && prev.me.alive && v.me && !v.me.alive) buzz(400);
    if (v.lover && !(prev && prev.lover)) buzz([60, 40, 60, 40, 60]);
  },
  screen() { return MP.role === 'host' ? lgHost() : lgGuest(MP.view); },
};
function lgDeal() {
  const H = MP.H, deck = shuffle(H.cards);
  shuffle(H.players).forEach((p, i) => Object.assign(p, { role: deck[i] || 'villageois', alive: true, seen: false }));
  Object.assign(H, { step: 'deal', phase: 'night', n: 1, pending: [], checks: {}, potions: { vie: true, mort: true }, lovers: [], news: null, winner: null });
  ring(); mpPush();
}
function lgSpinAnim() {
  const H = MP.H, el = document.getElementById('wheel');
  if (!el || MP.role !== 'host' || H.step !== 'spin' || !H.spin) return;
  const left = Math.max(300, 3400 - (Date.now() - H.spin.at));
  el.getBoundingClientRect();
  el.style.transition = `transform ${left / 1000}s cubic-bezier(.12,.7,.15,1)`;
  el.style.transform = `rotate(${H.spin.to}deg)`;
}
const lgCards = list => `<div class="roles">${list.map(x => `<div class="${isWolf(x.role) ? 'imp' : ''}"><span>${x.alive ? '' : '☠ '}${esc(x.name)}</span><span>${lgRole(x.role).icon} ${lgRole(x.role).name}</span></div>`).join('')}</div>`;
function lgNewsCard(news) {
  if (!news) return '';
  const lines = news.lines.length ? news.lines.map(d => `<p class="text">${esc(d.name)}${d.why === 'chagrin' ? ' meurt de chagrin' : ' est mort·e'}.<br><em>${lgRole(d.role).icon} ${lgRole(d.role).name}</em></p>`).join('')
    : `<p class="text">Personne n'est mort.</p>`;
  return `<div class="card black"><p class="kind">${esc(news.title)}</p>${lines}</div>`;
}
function lgHost() {
  const H = MP.H, n = H.players.length;
  if (H.step === 'lobby') {
    const d = lgDeck(H), c = H.cfg;
    return `${roomBox(true)}
    <section class="panel"><h3><span>Joueurs connectés</span><span>${n}</span></h3>
      ${n ? `<ul class="plist">${H.players.map(p => `<li><span class="dot ${p.on ? '' : 'off'}"></span><span class="nm"><b>${esc(p.name)}</b>${p.on ? '' : '<small>déconnecté·e</small>'}</span><button class="mini" data-a="mp-kick" data-v="${esc(p.cid)}" aria-label="Retirer ${esc(p.name)}">✕</button></li>`).join('')}</ul>`
        : `<p class="hint">En attente des joueurs… Toi, tu es le maître du jeu : tu ne joues pas, tu racontes.</p>`}
    </section>
    <section class="panel"><h3><span>Les cartes</span><span>${n} joueur${n > 1 ? 's' : ''}</span></h3>
      <div class="stepper"><span><b>🐺 Loups-garous</b><br><span class="hint">${c.wolves ? 'Choisi à la main' : 'Automatique selon le nombre de joueurs'}</span></span>

  if (v.step === 'play') {
    const t = v.task, head = `<div class="turn"><small>Manche ${v.round + 1} / ${v.rounds}</small><strong class="q">${t ? { write: 'Écris une phrase', draw: 'Dessine !', guess: "Qu'est-ce que c'est ?" }[t.kind] : 'En cours'}</strong><span class="gp-time" id="gpTime"></span></div>`;
    const force = host ? `<button class="btn ghost" id="gpForce" data-a="gp-force" ${t && !v.done && MP.sent !== t.id ? 'hidden' : ''}>Passer à la suite sans les retardataires</button>` : '';
    if (!t || v.done || MP.sent === t.id) return `${head}<div class="card"><p class="kind">C'est envoyé</p><p class="text">En attente des autres…</p></div><section class="panel" id="gpStatus">${gpStatus(v)}</section>${force}`;
    if (GPD.id !== t.id) Object.assign(GPD, { id: t.id, strokes: [], text: '', eraser: false });
    let body;
    if (t.kind === 'draw') body = `<div class="gp-prompt"><small>Dessine</small>${t.prompt && t.prompt.v ? esc(t.prompt.v) : 'Ce que tu veux (la phrase est restée vide)'}</div>
      <canvas class="gp-canvas" id="gpCanvas" width="600" height="600" aria-label="Zone de dessin"></canvas>
      <div class="gp-tools">${GP_COLORS.map(c => `<button class="swatch" style="background:${c}" data-a="gp-color" data-v="${c}" aria-pressed="${!GPD.eraser && GPD.color === c}" aria-label="Couleur ${c}"></button>`).join('')}</div>
      <div class="gp-tools">${GP_SIZES.map(s => `<button class="tool-b" data-a="gp-size" data-v="${s}" aria-pressed="${GPD.size === s}" aria-label="Épaisseur ${s}"><span class="size-dot" style="width:${Math.round(s / 1.6) + 4}px;height:${Math.round(s / 1.6) + 4}px"></span></button>`).join('')}
        <button class="tool-b" data-a="gp-eraser" aria-pressed="${GPD.eraser}">Gomme</button><button class="tool-b" data-a="gp-undo">↶ Annuler</button><button class="tool-b" data-a="gp-clear">Effacer</button></div>
      <button class="btn big" data-a="gp-send">Envoyer mon dessin</button>`;
    else body = `${t.kind === 'guess' ? (t.prompt && t.prompt.v ? gpShow(t.prompt) : `<div class="gp-prompt">Pas de dessin cette fois : invente !</div>`) : `<p class="howto">Une phrase farfelue que le joueur suivant devra dessiner.</p>`}
      <textarea id="gpText" rows="2" maxlength="100" autocomplete="off" placeholder="${t.kind === 'write' ? 'Ex : un pingouin qui fait du ski' : 'Je pense que c\'est…'}" aria-label="Ta réponse">${esc(GPD.text)}</textarea>
      <div class="row">${t.kind === 'write' ? `<button class="btn ghost" data-a="gp-idea">Idée au hasard</button>` : ''}<button class="btn" data-a="gp-send">Envoyer</button></div>`;
    return `${head}<div id="gpCompose" class="gp-compose" data-task="${t.id}">${body}</div><section class="panel" id="gpStatus">${gpStatus(v)}</section>${force}`;
  }
  const a = v.album;
  if (v.step === 'album' && a) return `<div class="turn"><small>Album ${a.c + 1} / ${a.total}</small><strong class="q">L'histoire de ${esc(a.owner)}</strong></div>
    <div class="album">${a.items.map(e => `<div class="it"><span class="by">${esc(e.by || '?')} ${e.k === 'img' ? 'a dessiné' : 'a écrit'}</span>${gpShow(e)}</div>`).join('')}</div>
    ${host ? `<button class="btn big" data-a="gp-next">${!a.last ? 'Suivant' : a.c + 1 < a.total ? 'Album suivant' : 'Terminer'}</button>` : `<p class="howto">L'hôte fait défiler les albums.</p>`}`;
  return `<div class="turn"><small>Fin de partie</small><strong>Bravo les artistes !</strong></div>
    <p class="howto">Toutes les histoires ont été révélées.</p>
    ${host ? `<div class="row"><button class="btn" data-a="gp-again">Rejouer</button><button class="btn ghost" data-a="mp-quit">Fermer</button></div>` : `<p class="howto">L'hôte peut relancer une partie : reste connecté·e.</p>`}`;
}
function gpRedraw(ctx, k = 1) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 600 * k, 600 * k);
  GPD.strokes.forEach(s => gpLine(ctx, s, 0, k));
}
function gpLine(ctx, s, from, k = 1) {
  ctx.strokeStyle = ctx.fillStyle = s.c; ctx.lineWidth = s.s * k; ctx.lineCap = ctx.lineJoin = 'round';
  const p = s.p;
  if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0] * k, p[0][1] * k, s.s * k / 2, 0, 7); ctx.fill(); return; }
  ctx.beginPath(); ctx.moveTo(p[Math.max(0, from - 1)][0] * k, p[Math.max(0, from - 1)][1] * k);
  for (let i = Math.max(1, from); i < p.length; i++) ctx.lineTo(p[i][0] * k, p[i][1] * k);
  ctx.stroke();
}
function gpCanvasSetup() {
  const cv = document.getElementById('gpCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  gpRedraw(ctx);
  let cur = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 600), Math.round((e.clientY - r.top) / r.height * 600)]; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    cur = { c: GPD.eraser ? '#ffffff' : GPD.color, s: GPD.eraser ? Math.max(GPD.size, 26) : GPD.size, p: [pos(e)] };
    GPD.strokes.push(cur); gpLine(ctx, cur, 0);
  });
  cv.addEventListener('pointermove', e => {
    if (!cur) return;
    e.preventDefault();
    const n = cur.p.length;
    (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach(pe => cur.p.push(pos(pe)));
    if (cur.p.length > n) gpLine(ctx, cur, n);
  });
  const end = () => { cur = null; };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => cv.addEventListener(t, end));
}

Object.assign(actions, {
  // Loup-Garou (maître du jeu)
  'lg-w'(v) { const H = MP.H; H.cfg.wolves = Math.max(1, lgDeck(H).w + +v); store.set('lgCfg', H.cfg); mpPush(); },
  'lg-sp'(r) { const c = MP.H.cfg; c.sp = c.sp.includes(r) ? c.sp.filter(x => x !== r) : c.sp.concat(r); store.set('lgCfg', c); mpPush(); },
  'lg-mates'() { const c = MP.H.cfg; c.mates = !c.mates; store.set('lgCfg', c); mpPush(); },
  'lg-spin'() {
    const H = MP.H, d = lgDeck(H);
    if (d.err) { toast(d.err); return; }
    const from = H.spin ? H.spin.to % 360 : 0;
    H.cards = shuffle(d.cards); H.step = 'spin'; H.spin = { from, to: from + 1800 + rand(360), at: Date.now() };
    mpPush();
    mpTimer('lgT', () => MP.H === H && H.step === 'spin' && lgDeal(), 3600);
  },
  'lg-respin'() { MP.H.step = 'lobby'; actions['lg-spin'](); },
  'lg-start'() { Object.assign(MP.H, { step: 'game', phase: 'night', n: 1, checks: {} }); mpPush(); },
  'lg-check'(id) { const c = MP.H.checks; c[id] = !c[id]; mpPush(); },
  'lg-potion'(k) { const p = MP.H.potions; p[k] = !p[k]; mpPush(); },
  'lg-target'(cid) { const H = MP.H; H.pending = H.pending.includes(cid) ? H.pending.filter(c => c !== cid) : H.pending.concat(cid); mpPush(); },
  'lg-love'(cid) { const H = MP.H; H.lovers = H.lovers.includes(cid) ? H.lovers.filter(c => c !== cid) : H.lovers.length < 2 ? H.lovers.concat(cid) : H.lovers; mpPush(); },
  'lg-dawn'() {
    const H = MP.H, out = lgKill(H.pending);
    Object.assign(H, { pending: [], phase: 'day', news: lgNews(`Ce matin, au village`, out) });
    if (out.some(d => d.role === 'chasseur')) toast('Le chasseur est mort : il tire sur quelqu\'un. Touche « Éliminer » sur sa cible.');
    mpPush();
  },
  'lg-kill'(cid) {
    const H = MP.H, out = lgKill([cid]);
    H.news = lgNews('Le village a tranché', out);
    if (out.some(d => d.role === 'chasseur')) toast('Le chasseur tire sur quelqu\'un : touche « Éliminer » sur sa cible.');
    mpPush();
  },
  'lg-revive'(cid) { const p = mpP(cid); if (p) p.alive = true; mpPush(); },
  'lg-night'() { const H = MP.H; Object.assign(H, { phase: 'night', n: H.n + 1, checks: {}, pending: [], news: null }); mpPush(); },
  'lg-end'(w) { Object.assign(MP.H, { step: 'end', winner: w || '' }); mpPush(); },
  'lg-again'() { const H = MP.H; H.players.forEach(p => { delete p.role; delete p.alive; delete p.seen; }); Object.assign(H, { step: 'lobby', lovers: [], pending: [], news: null, winner: null }); mpPush(); },
  'lg-peek'() {
    MP.peek = !MP.peek;
    if (MP.peek && !MP.saidSeen) { MP.saidSeen = true; mpSend({ t: 'seen' }); }
    render(false);
  },
  // Téléphone dessiné
  'gp-secs'(v) { MP.H.cfg.secs = +v; store.set('gpSecs', +v); mpPush(); },
  'gp-start'() {
    const H = MP.H, on = H.players.filter(p => p.on);
    if (on.length < 3) return;
    H.players = on;
    Object.assign(H, { step: 'play', gid: H.gid + 1, round: 0, order: shuffle(on.map(p => p.cid)), album: null });
    H.chains = H.order.map(() => []);
    MP.sent = null;
    gpRound();
  },
  'gp-force'() { gpTimeUp(); mpTimer('gpG', gpFill, 1500); },
  'gp-send'() { gpSend(false); },
  'gp-idea'() { const el = document.getElementById('gpText'); GPD.text = GP_IDEAS[rand(GP_IDEAS.length)]; if (el) el.value = GPD.text; },
  'gp-color'(c) { GPD.color = c; GPD.eraser = false; render(false); },
  'gp-size'(s) { GPD.size = +s; render(false); },
  'gp-eraser'() { GPD.eraser = !GPD.eraser; render(false); },
  'gp-undo'() { GPD.strokes.pop(); render(false); },
  'gp-clear'() { GPD.strokes = []; render(false); },
  'gp-next'() {
    const H = MP.H, a = H.album, n = H.order.length;
    if (a.i < n - 1) a.i++;
    else if (a.c + 1 < n) { a.c++; a.i = 0; }
    else { H.step = 'end'; }
    mpPush();
    if (H.step === 'album') setTimeout(() => { const its = document.querySelectorAll('.album .it'); its.length && its[its.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
  },
  'gp-again'() { const H = MP.H; Object.assign(H, { step: 'lobby', album: null, chains: [], order: [], subs: {}, end: null }); mpPush(); },
});
app.addEventListener('input', e => { if (e.target.id === 'gpText') GPD.text = e.target.value; });

start();
</script>
