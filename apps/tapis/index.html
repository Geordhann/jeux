<script>
/* ---------- Cartes et jetons communs ---------- */
// Jetons fictifs uniquement : aucun argent réel, aucune mise réelle, aucun achat possible.
const SUIT_SYM = { s: '♠', h: '♥', d: '♦', c: '♣' };
const RANKS = '23456789TJQKA';
const CASINO_STACK = 1000;
const newDeck = (k = 1) => shuffle(Array.from({ length: 52 * k }, (_, i) => RANKS[i % 13] + 'shdc'[Math.floor(i / 13) % 4]));
const isCard = c => typeof c === 'string' && c.length === 2 && RANKS.includes(c[0]) && SUIT_SYM[c[1]];
const pcard = (c, cls = '') => isCard(c)
  ? `<span class="pc ${'hd'.includes(c[1]) ? 'red' : ''} ${cls}" aria-label="${c[0] === 'T' ? '10' : c[0]} ${SUIT_SYM[c[1]]}"><b>${c[0] === 'T' ? '10' : c[0]}</b><i>${SUIT_SYM[c[1]]}</i></span>`
  : `<span class="pc back ${cls}" aria-label="carte cachée"></span>`;
const pcards = (l, cls = '') => `<span class="pcs">${(l || []).map(c => pcard(c, cls)).join('')}</span>`;
const chipsTxt = n => `${(n || 0).toLocaleString('fr-FR')} jetons`;
const casinoNew = p => Object.assign(p, { chips: CASINO_STACK, re: 0 });
// Recave : un joueur à sec repart avec un tapis neuf (compté, pour la frime)
function casinoRebuy(p) { if (p && p.chips < 10) { p.chips = CASINO_STACK; p.re = (p.re || 0) + 1; mpPush(); } }
const casinoLobby = (v, opts) => {
  if (MP.role !== 'host') return `${roomBox(false)}<section class="panel"><h3><span>À la table</span><span>${v.players.length}</span></h3>
    <div class="chips">${v.players.map(p => `<span class="chip tap">${esc(p.name)}</span>`).join('')}</div></section>
    <p class="howto">L'hôte va ouvrir la table. Chacun commence avec ${chipsTxt(CASINO_STACK)} (fictifs).</p>`;
  const H = MP.H, n = H.players.filter(p => p.on).length;
  return `${roomBox(true)}
  <section class="panel"><h3><span>À la table</span><span>${H.players.length}</span></h3>
    <ul class="plist">${H.players.map(p => `<li><span class="dot ${p.on ? '' : 'off'}"></span><span class="nm"><b>${esc(p.name)}</b>${p.cid === MP_CID ? '<small>toi</small>' : p.on ? '' : '<small>déconnecté·e</small>'}</span>${p.cid === MP_CID ? '' : `<button class="mini" data-a="mp-kick" data-v="${esc(p.cid)}" aria-label="Retirer ${esc(p.name)}">✕</button>`}</li>`).join('')}</ul>
    <p class="hint">On peut aussi rejoindre la table en cours de partie, entre deux mains.</p>
  </section>
  ${opts.panel}
  <button class="btn big" data-a="${opts.start}" ${n < opts.min || MP.status !== 'open' ? 'disabled' : ''}>${n < opts.min ? `Il faut au moins ${opts.min} joueurs` : `Ouvrir la table (${n} joueurs)`}</button>`;
};

/* ---------- Blackjack ---------- */
// Chacun joue contre la banque, tenue par l'appli. Sabot de 6 jeux, la banque tire jusqu'à 17.
function bjTotal(cards) {
  let t = 0, aces = 0;
  cards.forEach(c => { if (!c) return; if (c[0] === 'A') { t += 11; aces++; } else t += 'TJQK'.includes(c[0]) ? 10 : +c[0]; });
  while (t > 21 && aces) { t -= 10; aces--; }
  return { t, soft: aces > 0 };
}
function bjDraw() { const H = MP.H; if (H.shoe.length < 60) H.shoe = newDeck(6); return H.shoe.pop(); }
const bjCur = () => { const H = MP.H; return H.step === 'play' ? mpP(H.order[H.turn]) : null; };
MPG.bj = {
  rules: () => ({ title: 'Blackjack', steps: [
    "Un joueur crée la table et donne le code ; les autres la rejoignent. La banque est tenue par l'appli.",
    "Chacun mise avec ses jetons (1 000 au départ, fictifs).",
    "Tu reçois deux cartes, la banque en montre une. But : t'approcher de 21 sans dépasser. Figures = 10, as = 1 ou 11.",
    "À ton tour : « Carte » pour en tirer une, « Je reste » pour t'arrêter, ou « Doubler » ta mise contre une seule carte.",
    "La banque tire jusqu'à 17. Tu gagnes si tu fais mieux qu'elle ou si elle saute. Un blackjack (as + 10 d'entrée) paie 3 pour 2.",
  ], tips: [
    "Gages de soirée (au choix de l'hôte) : chaque main perdue = une gorgée ou un gage, un blackjack = 2 à distribuer. L'abus d'alcool est dangereux pour la santé.",
    "Plus de jetons ? La recave te redonne 1 000 jetons.",
    "Jetons fictifs uniquement : on joue pour la gloire, jamais d'argent.",
  ] }),
  lateJoin: true,
  init: name => ({ step: 'lobby', players: [casinoNew({ cid: MP_CID, name: mpCleanName(name) || 'Hôte', on: true })], cfg: { gages: store.get('bjGages', 'sips') }, shoe: newDeck(6), dealer: [], order: [], turn: -1, n: 0 }),
  join: p => { casinoNew(p); Object.assign(p, { bet: 0, ready: false, hand: [], st: '' }); },
  resume() { if (MP.H.step === 'dealer') bjDealer(); },
  act(cid, d) {
    const H = MP.H, p = mpP(cid);
    if (!p) return;
    if (d.t === 'bj-bet' && H.step === 'bet' && !p.ready) {
      const v = Math.floor(+d.v);
      if (!(v >= 10 && v <= p.chips)) return;
      Object.assign(p, { bet: v, last: v, ready: true }); p.chips -= v;
      const want = H.players.filter(x => x.on && (x.ready || x.chips >= 10));
      if (want.every(x => x.ready)) bjDeal(); else mpPush();
    } else if (d.t === 'bj-unbet' && H.step === 'bet' && p.ready) {
      p.chips += p.bet; Object.assign(p, { bet: 0, ready: false }); mpPush();
    } else if (d.t === 'bj-rebuy' && !['play', 'dealer'].includes(H.step) && !p.ready) casinoRebuy(p);
    else if (d.t === 'bj-act' && bjCur() === p) bjMove(p, d.a);
  },
  view(cid) {
    const H = MP.H, hide = H.step === 'play';
    const dc = hide ? [H.dealer[0], null] : H.dealer;
    return { game: 'bj', step: H.step, n: H.n, gages: H.cfg.gages !== 'off', mode: H.cfg.gages, alc: H.cfg.gages === 'sips',
      dealer: { cards: dc, t: H.dealer.length ? bjTotal(dc).t : null },
      turn: (bjCur() || {}).name || null,
      players: H.players.map(p => ({ name: p.name, on: !!p.on, chips: p.chips, bet: p.bet || 0, ready: !!p.ready, last: p.last || 50, hand: p.hand || [], t: p.hand && p.hand.length ? bjTotal(p.hand).t : null,
        st: p.st || '', res: p.res || '', gain: p.gain || 0, re: p.re || 0, me: p.cid === cid, inHand: H.order.includes(p.cid), canDouble: !!(p.hand && p.hand.length === 2 && p.chips >= p.bet) })) };
  },
  notify(prev, v) {
    const me = v.players.find(p => p.me);
    if (v.step === 'play' && v.turn === (me || {}).name && !(prev && prev.turn === v.turn && prev.step === 'play')) try { navigator.vibrate && navigator.vibrate(80); } catch (e) {}
    if (v.step === 'bet' && (!prev || prev.step !== 'bet')) MP.bjBet = null;
  },
  screen() { return bjScreen(MP.role === 'host' ? MPG.bj.view(MP_CID) : MP.view); },
};
function bjDeal() {
  const H = MP.H;
  mpTimer('bjT');
  H.order = H.players.filter(p => p.ready).map(p => p.cid);
  if (!H.order.length) return;
  H.players.forEach(p => { p.hand = []; p.st = ''; p.res = ''; p.gain = 0; });
  H.order.forEach(c => { const p = mpP(c); p.hand = [bjDraw(), bjDraw()]; p.st = bjTotal(p.hand).t === 21 ? 'bj' : 'play'; });
  H.dealer = [bjDraw(), bjDraw()]; H.n++; H.turn = -1;
  if (bjTotal(H.dealer).t === 21) { H.step = 'dealer'; bjSettle(); return; } // la banque a un blackjack : on révèle tout de suite
  bjNext();
}
function bjNext() {
  const H = MP.H;
  let i = H.turn + 1;
  while (i < H.order.length && mpP(H.order[i]).st !== 'play') i++;
  if (i < H.order.length) { H.turn = i; H.step = 'play'; mpPush(); return; }
  H.turn = -1; H.step = 'dealer'; mpPush(); bjDealer();
}
function bjMove(p, a) {
  if (a === 'hit') {
    p.hand.push(bjDraw());
    const t = bjTotal(p.hand).t;
    if (t > 21) p.st = 'bust'; else if (t === 21) p.st = 'stand';
  } else if (a === 'stand') p.st = 'stand';
  else if (a === 'double' && p.hand.length === 2 && p.chips >= p.bet) {
    p.chips -= p.bet; p.bet *= 2; p.hand.push(bjDraw());
    p.st = bjTotal(p.hand).t > 21 ? 'bust' : 'stand';
  } else return;
  if (p.st === 'play') mpPush(); else bjNext();
}
// La banque retourne sa carte puis tire, une carte à la fois pour le suspense
function bjDealer() {
  const H = MP.H, m = MP;
  const stands = H.order.some(c => ['stand', 'play'].includes(mpP(c).st));
  const go = () => {
    if (MP !== m || H.step !== 'dealer') return;
    if (stands && bjTotal(H.dealer).t < 17) { H.dealer.push(bjDraw()); mpPush(); mpTimer('bjT', go, 850); }
    else bjSettle();
  };
  mpTimer('bjT', go, 900);
}
function bjSettle() {
  const H = MP.H, d = bjTotal(H.dealer).t, dbj = H.dealer.length === 2 && d === 21;
  H.order.forEach(c => {
    const p = mpP(c), t = bjTotal(p.hand).t, b = p.bet;
    let res, back = 0;
    if (p.st === 'bust') res = 'lose';
    else if (p.st === 'bj') { if (dbj) { res = 'push'; back = b; } else { res = 'bj'; back = b + Math.floor(b * 1.5); } }
    else if (dbj) res = 'lose';
    else if (d > 21 || t > d) { res = 'win'; back = 2 * b; }
    else if (t === d) { res = 'push'; back = b; }
    else res = 'lose';
    p.chips += back; p.res = res; p.gain = back - b;
  });
  H.step = 'result'; mpPush();
}
const BJ_RES = { win: 'Gagné', bj: 'Blackjack !', push: 'Égalité', lose: 'Perdu' };
const BJ_ST = { bust: 'Sauté', bj: 'Blackjack', stand: 'Reste', play: 'Joue…' };
function bjScreen(v) {
  const host = MP.role === 'host', me = v.players.find(p => p.me) || { chips: 0, hand: [] };
  if (v.step === 'lobby') return casinoLobby(v, { start: 'bj-open', min: 1, panel: `<section class="panel">
    <h3><span>Gages de soirée</span></h3>
    <div class="levels three" role="group" aria-label="Gages de soirée">${[['off', 'Aucun'], ['sips', 'Gorgées'], ['gages', 'Gages']].map(([k, l]) => `<button data-a="bj-gages" data-v="${k}" aria-pressed="${v.mode === k}">${l}</button>`).join('')}</div>
    <p class="hint">${v.gages ? `Chaque main perdue : ${v.alc ? 'une gorgée' : 'un gage'}. Un blackjack : tu en distribues 2.` : 'On joue seulement pour les jetons.'}</p>
    <p class="hint">Blackjack payé 3 pour 2, la banque tire jusqu'à 17. Tu peux doubler sur tes deux premières cartes.</p></section>` });
  const stack = `<p class="howto"><span class="chipline">${chipsTxt(me.chips)}</span>${me.re ? ` · ${me.re} recave${me.re > 1 ? 's' : ''}` : ''}</p>`;
  if (v.step === 'bet') {
    const ready = v.players.filter(p => p.ready).length;
    let mine;
    if (me.ready) mine = `<div class="card compact"><p class="kind">Ta mise</p><p class="text big-result">${me.bet}</p><p class="sub">En attente des autres joueurs…</p></div>
      <button class="btn ghost" data-a="bj-unbet">Changer ma mise</button>`;
    else if (me.chips < 10) mine = `<div class="card"><p class="kind">Plus de jetons</p><p class="text">Tu es à sec !</p></div><button class="btn big" data-a="bj-rebuy">Recave : ${chipsTxt(CASINO_STACK)}</button>`;
    else {

  red: ['Rouge', n => RL_RED.has(n), 2], black: ['Noir', n => n > 0 && !RL_RED.has(n), 2],
  even: ['Pair', n => n > 0 && n % 2 === 0, 2], odd: ['Impair', n => n % 2 === 1, 2],

  c1: ['Colonne 1', n => n > 0 && n % 3 === 1, 3], c2: ['Colonne 2', n => n > 0 && n % 3 === 2, 3], c3: ['Colonne 3', n => n > 0 && n % 3 === 0, 3],
};
const rlOuter = k => Object.prototype.hasOwnProperty.call(RL_BETS, k);
const rlValid = k => rlOuter(k) || /^n([0-9]|[12][0-9]|3[0-6])$/.test(k);

function rlSpin() {

function rlFinish() {

    p.chips += won; p.gain = won - rlSum(p.bets);

});
const tpMe = v => v.players.find(p => p.me) || {};
const readyCount = v => v.players.filter(p => p.ready).length;
MPG.pk.sound = (prev, v) => {
  if (v.step === 'hand' && prev.step !== 'hand') { sfx('shuffle'); [600, 800].forEach(d => setTimeout(() => sfx('deal'), d)); return; }
  if (v.board && prev.board && v.board.length > prev.board.length) for (let i = 0; i < v.board.length - prev.board.length; i++) setTimeout(() => sfx('flip'), i * 160);
  if (v.step === 'hand' && v.pot > prev.pot) sfx('chips');
  if (v.me && v.me.turn && !(prev.me && prev.me.turn)) setTimeout(() => sfx('ping'), 250);
  if (v.step === 'show' && prev.step !== 'show' && v.res) sfx(v.res.lines.some(l => l.name === tpMe(v).name) ? 'win' : 'flip');
};
MPG.bj.sound = (prev, v) => {
  const me = tpMe(v), was = tpMe(prev);
  if (v.step === 'bet' && readyCount(v) > readyCount(prev)) sfx('chip');
  if (['play', 'dealer', 'result'].includes(v.step) && prev.step === 'bet') { [0, 180, 360, 540].forEach(d => setTimeout(() => sfx('deal'), d)); return; }
  if (v.dealer.cards.filter(Boolean).length > prev.dealer.cards.filter(Boolean).length) sfx('flip');
  if (me.hand && was.hand && me.hand.length > was.hand.length) sfx('deal');
  if (v.step === 'play' && v.turn === me.name && prev.turn !== me.name) setTimeout(() => sfx('ping'), 300);
  if (v.step === 'result' && prev.step !== 'result' && me.inHand) setTimeout(() => sfx(['win', 'bj'].includes(me.res) ? 'win' : me.res === 'lose' ? 'lose' : 'chip'), 400);
};
MPG.rl.sound = (prev, v) => {
  if (v.step === 'bet' && readyCount(v) > readyCount(prev)) sfx('chip');
  if (v.step === 'spin' && prev.step !== 'spin' && v.spin) sfx('roulette', v.spin.left);
  if (v.step === 'result' && prev.step !== 'result') { const me = tpMe(v); if (me.stake) sfx(me.gain > 0 ? 'win' : me.gain < 0 ? 'lose' : 'chip'); }
};

start();
</script>
