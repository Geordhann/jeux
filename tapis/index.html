<style>
/* Le Tapis : nuit de Las Vegas années 80, néons adoucis et or ; tables en feutre vert */
:root { --felt: #120c1e; --felt-2: #1f1533; --felt-line: #3d2c5a; --muted: #c3b3d9; --red: #d6456a; --gold: #eab94e; --neon: #ff5fa2; --teal: #3fd0c9; }
.pcs { display: inline-flex; gap: 5px; flex-wrap: wrap; justify-content: center; flex: none; }
.pc { width: 44px; height: 62px; border-radius: 7px; background: #fff; color: var(--ink); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; font-weight: 800; box-shadow: 0 2px 0 var(--paper-edge), 0 4px 10px rgba(0,0,0,.3); animation: deal .3s ease-out; }
.pc b { font-size: 1.15rem; }
.pc i { font-style: normal; font-size: 1.2rem; }
.pc.red { color: var(--red); }
.pc.back { background: var(--red) repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 4px, transparent 4px 9px); border: 3px solid #fff; }
.pc.slot { background: transparent; border: 2px dashed rgba(255,255,255,.25); box-shadow: none; animation: none; }
.pc.sm { width: 30px; height: 43px; border-radius: 5px; }
.pc.sm b, .pc.sm i { font-size: .8rem; }
.pc.sm.back { border-width: 2px; }
.pc.lg { width: 76px; height: 106px; border-radius: 10px; }
.pc.lg b { font-size: 1.9rem; }
.pc.lg i { font-size: 2rem; }
@media (prefers-reduced-motion: reduce) { .pc { animation: none; } }
.felt-table { background: radial-gradient(120% 90% at 50% 30%, #2a7a55, #17513a); border: 6px solid #6b4426; border-radius: 26px; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; box-shadow: inset 0 0 30px rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.35); }
.felt-table > small { text-transform: uppercase; letter-spacing: .14em; font-size: .72rem; font-weight: 800; color: var(--paper); opacity: .85; }
.felt-table .hint { color: var(--paper); opacity: .85; }
.pot { font-family: var(--font-display); font-size: 1.7rem; color: var(--gold); line-height: 1.1; }
.badge { display: inline-block; font-size: .64rem; font-weight: 800; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 1px 6px; margin-left: 5px; vertical-align: middle; }
.badge.d { background: var(--gold); }
.plist li.now { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
.chipline { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 800; }
.betbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.jeton { width: 60px; height: 60px; border-radius: 50%; font-weight: 800; color: #fff; border: 4px dashed rgba(255,255,255,.75); box-shadow: 0 3px 0 rgba(0,0,0,.4); }
.jeton.j10 { background: #2a62c9; } .jeton.j25 { background: #2f9e5a; } .jeton.j100 { background: #221c17; } .jeton.j500 { background: #8e44ad; }
.hand-btn { display: flex; justify-content: center; padding: 4px; }
.my-hand { align-items: center; text-align: center; }
.my-hand h3 { width: 100%; }
.raise input[type=range] { width: 100%; accent-color: var(--gold); }
/* Roulette */
.rl-box { position: relative; width: min(100%, 320px); aspect-ratio: 1; margin: 6px auto 0; flex: none; }
.rl-wheel { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 0 0 6px #6b4426, 0 0 0 9px var(--gold), 0 16px 36px rgba(0,0,0,.5); }
.rl-pointer { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 28px solid var(--paper); z-index: 2; filter: drop-shadow(0 3px 3px rgba(0,0,0,.5)); }
.rl-hist { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.rl-num { min-width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 800; font-size: .85rem; color: #fff; font-variant-numeric: tabular-nums; }
.rl-num.red { background: var(--red); } .rl-num.black { background: #221c17; border: 1px solid #555; } .rl-num.green { background: #2f9e5a; }
.rl-hist .rl-num:first-child { box-shadow: 0 0 0 3px var(--gold); }
.rl-board { display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 18px; background: #17513a; border: 5px solid #6b4426; }
.rl-grid, .rl-row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.rl-row6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.rl-cell { position: relative; min-height: 38px; border-radius: 6px; border: 1px solid rgba(255,255,255,.35); color: #fff; font-weight: 800; font-size: .9rem; background: rgba(0,0,0,.15); padding: 2px; }
.rl-cell.red { background: var(--red); } .rl-cell.black { background: #221c17; } .rl-cell.green { background: #2f9e5a; }
.rl-cell.zero { min-height: 44px; font-size: 1.1rem; }
.rl-row6 .rl-cell { font-size: .74rem; }
.rl-chip { position: absolute; right: -4px; top: -6px; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 999px; background: var(--gold); color: var(--ink); border: 2px dashed #fff; font-size: .7rem; display: grid; place-items: center; z-index: 1; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.jeton.j5 { background: #c93a3f; }
.jeton[aria-pressed="true"] { outline: 3px solid var(--gold); outline-offset: 3px; }
/* Machine à sous : borne néon années 80 */
.sl-jack { text-align: center; padding: 10px 14px; border-radius: 16px; background: linear-gradient(180deg, #2a1640, #1a0f2b); box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(234,185,78,.35); }
.sl-jack small { display: block; text-transform: uppercase; letter-spacing: .16em; font-size: .7rem; font-weight: 800; color: var(--neon); }
.sl-jack strong { font-family: var(--font-display); font-weight: 400; font-size: 2.2rem; line-height: 1.1; color: var(--gold); text-shadow: 0 0 10px rgba(234,185,78,.6); font-variant-numeric: tabular-nums; }
.sl-feed:empty { display: none; }
.sl-feed { display: flex; flex-direction: column; gap: 6px; }
.sl-news { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(63,208,201,.12); border: 1px solid rgba(63,208,201,.45); font-size: .9rem; animation: deal .35s ease-out; }
.sl-news.jackpot { background: rgba(234,185,78,.18); border-color: var(--gold); }
.sl-news .icn, .sl-news .sl-sym { width: 30px; height: 30px; flex: none; }
.sl-cab { position: relative; margin: 2px 26px 0 0; padding: 14px 12px 16px; border-radius: 26px 26px 18px 18px; background: linear-gradient(180deg, #3a1d55, #22123a 60%, #180d29); box-shadow: 0 0 0 3px var(--neon), 0 0 24px rgba(255,95,162,.4), inset 0 2px 0 rgba(255,255,255,.12); }
.sl-top { text-align: center; font-family: var(--font-display); color: #fff4fb; letter-spacing: .08em; margin-bottom: 10px; text-shadow: 0 0 8px rgba(63,208,201,.8); }
.sl-reels { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; border-radius: 14px; background: #0d0716; box-shadow: inset 0 0 0 2px var(--gold); }
.sl-win { position: relative; height: 92px; overflow: hidden; border-radius: 9px; background: #fffaf0; }
.sl-win::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.45), transparent 26%, transparent 74%, rgba(0,0,0,.45)); }
.sl-strip { display: flex; flex-direction: column; will-change: transform; }
.sl-strip .sl-sym { height: 92px; flex: none; display: grid; place-items: center; padding: 10px; font-weight: 900; font-size: 1.6rem; color: var(--ink); }
.sl-sym .icn { width: 100%; height: 100%; }
.sl-sym.sm { width: 26px; height: 26px; padding: 0; display: inline-grid; place-items: center; font-size: .7rem; font-weight: 900; }
.sl-line { position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; background: rgba(214,69,106,.55); pointer-events: none; }
.sl-lever { position: absolute; right: -26px; top: 46px; width: 14px; height: 74px; border-radius: 7px; background: linear-gradient(90deg, #8d8d99, #e8e8f0, #8d8d99); transform-origin: 50% 100%; }
.sl-lever i { position: absolute; left: 50%; top: -14px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff9bc4, var(--neon) 55%, #b02a67); box-shadow: 0 0 10px rgba(255,95,162,.6); }
.sl-lever.pull { animation: pull .45s ease-in-out; }
@keyframes pull { 40% { transform: scaleY(-.55); } 100% { transform: none; } }
.sl-res { text-align: center; font-family: var(--font-display); font-size: 1.5rem; line-height: 1.2; color: var(--muted); padding: 4px 0; }
.sl-res small { display: block; font-family: var(--font-body); font-size: .9rem; color: var(--teal); font-weight: 800; }
.sl-res.gold { color: var(--gold); text-shadow: 0 0 12px rgba(234,185,78,.55); }
.sl-res.jackpot { font-size: 2rem; animation: blink .5s steps(2) 6; }
@keyframes blink { 50% { color: var(--neon); } }
.sl-go { background: linear-gradient(180deg, #ff86b8, var(--neon)) !important; color: #2a0b1c; }
.sl-pay summary { cursor: pointer; font-weight: 800; color: var(--muted); }
.sl-pay ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sl-pay li { display: flex; align-items: center; gap: 4px; }
.sl-pay li span:last-child { margin-left: auto; color: var(--gold); font-weight: 800; }
.sl-rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.sl-rank li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; }
.sl-rank li small { grid-column: 2 / 4; color: var(--muted); font-size: .78rem; margin-top: -4px; }
.sl-rank li.me { background: rgba(255,95,162,.14); }
.sl-rank li.off { opacity: .5; }
.sl-rank .pos { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; background: rgba(255,255,255,.1); }
.sl-rank li:first-child .pos { background: var(--gold); color: var(--ink); }
.podium { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 8px; }
.podium .pl { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.podium .pl b { overflow-wrap: anywhere; }
.podium .step { width: 100%; display: grid; place-items: center; border-radius: 10px 10px 0 0; font-family: var(--font-display); font-size: 1.6rem; color: var(--ink); background: var(--paper); }
.podium .p1 { order: 2; } .podium .p1 .step { height: 92px; background: var(--gold); }
.podium .p2 { order: 1; } .podium .p2 .step { height: 66px; }
.podium .p3 { order: 3; } .podium .p3 .step { height: 48px; background: #e0b38a; }
/* Course de chevaux */
.ch-board { display: flex; flex-direction: column; gap: 6px; }
.ch-bet { position: relative; display: grid; grid-template-columns: 26px 40px 1fr; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 14px; text-align: left; background: rgba(20,12,34,.7); border: 2px solid var(--c); color: #fff; }
.ch-bet .ch-nm small { display: block; color: var(--muted); font-size: .78rem; }
.ch-bet .rl-chip { top: 50%; right: 10px; transform: translateY(-50%); }
.ch-num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; background: rgba(255,255,255,.12); }
.ch-ic svg.icn, .ch-horse svg.icn { width: 40px; height: 40px; }
.ch-track { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; border-radius: 16px; background: linear-gradient(90deg, #2c6b3f, #23593a); box-shadow: inset 0 0 0 3px #eab94e, 0 10px 26px rgba(0,0,0,.45); overflow: hidden; }
.ch-lane { position: relative; height: 44px; border-bottom: 1px dashed rgba(255,255,255,.25); display: flex; align-items: center; }
.ch-lane:last-of-type { border-bottom: 0; }
.ch-lane .ch-num { position: absolute; left: 0; z-index: 1; background: rgba(0,0,0,.35); }
.ch-horse { position: absolute; left: 4px; will-change: transform; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
.ch-finish { position: absolute; top: 0; bottom: 0; right: 6px; width: 10px; background: repeating-linear-gradient(0deg, #fff 0 8px, #1a1024 8px 16px); opacity: .9; }
.ch-say { text-align: center; font-family: var(--font-display); font-size: 1.3rem; color: var(--gold); text-shadow: 0 0 10px rgba(255,95,162,.45); min-height: 2.6em; margin: 0; display: grid; place-items: center; }
.ch-hist { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.ch-hist span { font-size: .78rem; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--c); color: #fff; }
.podium .pl .ch-ic svg.icn { width: 46px; height: 46px; }
/* Salle de jeu : moquette bordeaux à losanges dorés, néons */
body { background-color: var(--felt);
  background-image: linear-gradient(180deg, rgba(255,95,162,.16) 0%, rgba(234,120,80,.10) 18%, transparent 42%),
    linear-gradient(0deg, rgba(63,208,201,.10), transparent 30%),
    repeating-linear-gradient(45deg, rgba(234,185,78,.05) 0 2px, transparent 2px 28px), repeating-linear-gradient(-45deg, rgba(234,185,78,.05) 0 2px, transparent 2px 28px);
  background-attachment: fixed; }
/* Enseigne au néon, façon Las Vegas des années 80 */
.logo { color: var(--gold); text-shadow: 0 0 6px rgba(255,95,162,.55), 0 0 18px rgba(255,95,162,.35); }
.logo span { color: #fff4fb; text-shadow: 0 0 6px rgba(63,208,201,.6), 0 0 18px rgba(63,208,201,.35); }
.home-head::after { content: ""; display: block; height: 3px; margin-top: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--neon), var(--gold), var(--teal)); box-shadow: 0 0 10px rgba(255,95,162,.5); }
.sec-title span:last-child { color: var(--teal); }
.btn { background: var(--gold); }
.btn.big { background: linear-gradient(180deg, #f3c862, #e0a63c); }
.panel { border-color: #4a3570; background: rgba(20,12,34,.55); }
.son-fab { border-color: var(--neon); } .son-fab svg { stroke: var(--neon); } .son-fab svg path:first-child { fill: var(--neon); }
.son-fab.on { background: var(--neon); }
.room { box-shadow: 0 0 0 3px var(--neon), 0 0 22px rgba(255,95,162,.35); }
.turn strong { color: var(--gold); text-shadow: 0 0 12px rgba(255,95,162,.45); }
.felt-table, .rl-board { box-shadow: inset 0 0 30px rgba(0,0,0,.45), 0 0 0 2px rgba(231,181,82,.5), 0 12px 30px rgba(0,0,0,.45); }
.banner.gold { box-shadow: 0 0 20px rgba(231,181,82,.45); }
</style>

<script>
/* ---------- Cartes et jetons communs ---------- */
// Jetons fictifs uniquement : aucun argent réel, aucune mise réelle, aucun achat possible.
const SUIT_SYM = { s: '♠', h: '♥', d: '♦', c: '♣' };
const RANKS = '23456789TJQKA';
const CASINO_STACK = 1000;
const newDeck = (k = 1) => shuffle(Array.from({ length: 52 * k }, (_, i) => RANKS[i % 13] + 'shdc'[Math.floor(i / 13) % 4]));
const isCard = c => typeof c === 'string' && c.length === 2 && RANKS.includes(c[0]) && SUIT_SYM[c[1]];
const pcard = (c, cls = '') => isCard(c)
  ? `<span class="pc ${'hd'.includes(c[1]) ? 'red' : ''} ${cls}" aria-label="${c[0] === 'T' ? '10' : c[0]} ${SUIT_SYM[c[1]]}"><b>${c[0] === 'T' ? '10' : c[0]}</b><i>${SUIT_SYM[c[1]]}</i></span>`
  : `<span class="pc back ${cls}" aria-label="carte cachée"></span>`;
const pcards = (l, cls = '') => `<span class="pcs">${(l || []).map(c => pcard(c, cls)).join('')}</span>`;
const chipsTxt = n => `${(n || 0).toLocaleString('fr-FR')} jetons`;
const casinoNew = p => Object.assign(p, { chips: CASINO_STACK, re: 0 });
// Recave : un joueur à sec repart avec un tapis neuf (compté, pour la frime)
function casinoRebuy(p) { if (p && p.chips < 10) { p.chips = CASINO_STACK; p.re = (p.re || 0) + 1; mpPush(); } }
const casinoLobby = (v, opts) => {
  if (MP.role !== 'host') return `${roomBox(false)}<section class="panel"><h3><span>À la table</span><span>${v.players.length}</span></h3>
    <div class="chips">${v.players.map(p => `<span class="chip tap">${avatar(p.name)}${esc(p.name)}</span>`).join('')}</div></section>
    <p class="howto">L'hôte va ouvrir la table. Chacun commence avec ${chipsTxt(CASINO_STACK)} (fictifs).</p>`;
  const H = MP.H, n = H.players.filter(p => p.on).length;
  return `${roomBox(true)}
  <section class="panel"><h3><span>À la table</span><span>${H.players.length}</span></h3>
    <ul class="plist">${H.players.map(p => `<li><span class="dot ${p.on ? '' : 'off'}"></span><span class="nm"><b>${avatar(p.name)}${esc(p.name)}</b>${p.cid === MP_CID ? '<small>toi</small>' : p.on ? '' : '<small>déconnecté·e</small>'}</span>${p.cid === MP_CID ? '' : `<button class="mini" data-a="mp-kick" data-v="${esc(p.cid)}" aria-label="Retirer ${esc(p.name)}">✕</button>`}</li>`).join('')}</ul>
    <p class="hint">On peut aussi rejoindre la table en cours de partie, entre deux mains.</p>

// Six chevaux, des cotes du favori à l'outsider. L'hôte tire l'arrivée au hasard (selon les cotes) et la course
// est rejouée à l'identique sur tous les téléphones, avec les commentaires.
const CH_PAY = [2.5, 4, 5, 7, 9, 14];
const CH_COLORS = ['#ff5fa2', '#3fd0c9', '#eab94e', '#8fb6ff', '#7fe0b0', '#ff8a5c'];
const CH_NAMES = ['Tonnerre de Brest', 'Petit Poney', 'Éclair de Lune', 'Brioche', 'Pégase Turbo', 'Croquette', 'Flamme du Désert', 'Gros Câlin', 'Roi du Turf', 'Paillette', 'Cacahuète', 'Tempête', 'Saucisson Sec', 'Fusée Rose', 'Galopin', 'Madame Rillettes', 'Comète', 'Biscotte', 'Grand Duc', 'Princesse Néon', 'Dernier Espoir', 'Vent du Sud', 'Patate Douce', 'Jackpot'];

function chHorses() { return shuffle(CH_NAMES.slice()).slice(0, 6).map((name, i) => ({ name, pay: CH_PAY[i], color: CH_COLORS[i] })); }
// L'arrivée : tirage pondéré par les cotes (le favori gagne plus souvent), puis des trajectoires qui font des rebondissements
function chRace(horses) {
  const left = horses.map((h, i) => i), order = [];
  while (left.length) {
    const w = left.map(i => 1 / horses[i].pay), tot = w.reduce((a, b) => a + b, 0);
    let r = Math.random() * tot, k = 0;
    while (k < left.length - 1 && (r -= w[k]) > 0) k++;
    order.push(left.splice(k, 1)[0]);
  }
  const T = [], tracks = [];
  order.forEach((h, rank) => { T[h] = 10500 + rank * (380 + rand(260)); });
  horses.forEach((h, i) => {
    const sp = Array.from({ length: CH_SEG }, () => .55 + Math.random() * .9), tot = sp.reduce((a, b) => a + b, 0);
    let x = 0; tracks[i] = [0].concat(sp.map(v => +(x += v / tot).toFixed(4)));
    tracks[i][CH_SEG] = 1;
  });
  return { order, T, tracks, dur: Math.max(...T) + 900 };

function chPos(race, i, t) {

const tpMe = v => v.players.find(p => p.me) || {};

MPG.pk.sound = (prev, v) => {

};

MPG.rl.sound = (prev, v) => {

};

MPG.sl.sound = (prev, v) => {

// Bruitages de la machine à sous
Object.assign(SFX, {

  bugle(t) { [[67, .14], [72, .14], [76, .14], [79, .28], [76, .14], [79, .5]].reduce((s, [m, d]) => { note(s, m, d, .05, { type: 'sawtooth', cut: 2600, a: .015, rel: .1, fx: .3, bus: 'sfx', detune: 4 }); return s + d + .02; }, t); },
