<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10261e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Tournée">
<title>La Tournée</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;800&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap">
<style>
/* Layout: une colonne de 480px max, comme un tapis de jeu ; les cartes sont des cartes à jouer en papier posées sur le feutre. */
:root {
  color-scheme: dark;
  --felt: #10261e;
  --felt-2: #183a2d;
  --felt-line: #2b5544;
  --paper: #f4ecdb;
  --paper-edge: #d9ccb0;
  --ink: #221c17;
  --ink-soft: #6d6255;
  --red: #c93a3f;
  --gold: #e7b552;
  --fg: #eef3ee;
  --muted: #a3bcb0;
  --font-display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-card: "Fraunces", Georgia, "Times New Roman", serif;
  --r: 14px;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--felt);
  background-image: radial-gradient(120% 80% at 50% 0%, var(--felt-2), var(--felt) 70%);
  background-attachment: fixed;
  color: var(--fg);
  font: 16px/1.5 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 96px; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.topbar h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: .01em; }
.back { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--felt-line); font-size: 1.3rem; display: grid; place-items: center; flex: none; }

.logo { font-family: var(--font-display); font-weight: 400; font-size: clamp(3rem, 15vw, 4.4rem); line-height: .95; color: var(--gold); padding-top: 12px; }
.logo span { color: var(--paper); display: block; }
.tag { color: var(--muted); max-width: 32ch; }

.panel { border: 1px solid var(--felt-line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,.12); }
.panel h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 6px 6px 14px; font-weight: 600; }
.chip { padding-left: 5px; }
.chip button.sex { font-weight: 800; font-size: .75rem; color: var(--paper); background: var(--ink); }
.chip button.sex.f { background: var(--red); }
.add .sexbtn { padding-inline: 14px; flex: none; }
.chip button { width: 26px; height: 26px; border-radius: 50%; background: var(--paper-edge); color: var(--ink); font-size: .9rem; line-height: 1; }
.hint { font-size: .85rem; color: var(--muted); }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--felt-line); background: var(--felt); color: var(--fg); }

.games { display: grid; grid-template-columns: 1fr; gap: 10px; }
.game { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: var(--r); background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 var(--paper-edge), 0 10px 24px rgba(0,0,0,.25); transition: transform .15s; }
.game:active { transform: translateY(2px); }
.game[disabled] { opacity: .45; cursor: not-allowed; }
.game .suit { font-family: var(--font-display); font-size: 1.6rem; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; border: 2px solid currentColor; color: var(--red); }
.game .suit.b { color: var(--ink); }
.game b { display: block; font-size: 1.08rem; }
.game small { color: var(--ink-soft); font-size: .86rem; line-height: 1.35; display: block; }
.game .go { font-size: 1.3rem; color: var(--ink-soft); }
.rule { font-size: .88rem; color: var(--muted); border-top: 1px dashed var(--felt-line); padding-top: 14px; }
.rule strong { color: var(--gold); }

.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: rgba(0,0,0,.2); padding: 4px; border-radius: 12px; }
.levels button { padding: 9px 2px; border-radius: 9px; font-weight: 600; font-size: .8rem; line-height: 1.15; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); }
.levels button .pips { font-size: .5rem; letter-spacing: 1px; color: var(--red); }
.levels.two { grid-template-columns: 1fr 1fr; }
.levels.two button { font-size: .82rem; padding: 10px 6px; }
.levels button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }

.turn { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.turn small { text-transform: uppercase; letter-spacing: .14em; font-size: .75rem; color: var(--muted); }
.turn strong { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 10vw, 2.8rem); color: var(--gold); line-height: 1.1; overflow-wrap: anywhere; }

.card { position: relative; background: var(--paper); color: var(--ink); border-radius: 18px; min-height: min(300px, 36vh); padding: 40px 26px; display: flex; flex-direction: column; justify-content: center; gap: 14px; box-shadow: 0 3px 0 var(--paper-edge), 0 18px 40px rgba(0,0,0,.35); animation: deal .35s cubic-bezier(.2,.9,.3,1.2); }
.card .idx { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: 1; font-family: var(--font-display); color: var(--red); }
.card .idx b { font-size: 1.5rem; font-weight: 400; }
.card .idx i { font-style: normal; font-size: .5rem; letter-spacing: 1px; margin-top: 4px; }
.card .idx.tl { top: 14px; left: 16px; }
.card .idx.br { bottom: 14px; right: 16px; transform: rotate(180deg); }
.card .kind { text-transform: uppercase; letter-spacing: .16em; font-size: .78rem; font-weight: 800; color: var(--red); text-align: center; }
.card .text { font-family: var(--font-card); font-size: clamp(1.35rem, 6vw, 1.7rem); line-height: 1.3; text-align: center; text-wrap: pretty; overflow-wrap: anywhere; }
.card .text em { font-style: italic; color: var(--red); }
.card.black .idx, .card.black .kind { color: var(--ink); }
.card .or { font-family: var(--font-display); color: var(--red); text-align: center; font-size: 1.3rem; }
.card .sub { text-align: center; color: var(--ink-soft); font-size: .9rem; }
.card.verso { background: var(--red); background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 14px), repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 14px); color: var(--paper); align-items: center; text-align: center; border: 8px solid var(--paper); }
.card.verso .text { color: var(--paper); }
@keyframes deal { from { transform: translateY(18px) rotate(-3deg) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } .game { transition: none; } }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.btn { padding: 15px 18px; border-radius: 12px; font-weight: 800; font-size: 1.02rem; background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 #a87d2c; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a87d2c; }
.btn.red { background: var(--red); color: var(--paper); box-shadow: 0 3px 0 #8a2229; }
.btn.paper { background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 var(--paper-edge); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--felt-line); box-shadow: none; font-weight: 600; }
.btn.big { font-size: 1.3rem; padding: 22px 18px; font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.howto { font-size: .92rem; color: var(--muted); text-align: center; max-width: 38ch; margin: 0 auto; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 12px 18px; border-radius: 999px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); text-align: center; }

.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper .ctl { display: flex; align-items: center; gap: 12px; }
.stepper .ctl button { width: 40px; height: 40px; border-radius: 50%; background: var(--paper); color: var(--ink); font-size: 1.3rem; font-weight: 800; }
.stepper .ctl button[disabled] { opacity: .35; }
.stepper output { font-family: var(--font-display); font-size: 1.6rem; min-width: 1.5ch; text-align: center; font-variant-numeric: tabular-nums; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle button { width: 58px; height: 32px; border-radius: 999px; background: var(--felt-line); position: relative; flex: none; }
.toggle button::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--paper); transition: left .15s; }
.toggle button[aria-pressed="true"] { background: var(--gold); }
.toggle button[aria-pressed="true"]::after { left: 30px; }

.order { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: o; }
.order li { counter-increment: o; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.18); border: 1px solid var(--felt-line); font-weight: 600; }
.order li::before { content: counter(o); font-family: var(--font-display); color: var(--gold); width: 1.6ch; text-align: center; font-variant-numeric: tabular-nums; }
.order li.dead { opacity: .4; text-decoration: line-through; }
.vote { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.vote button { padding: 16px 10px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 800; overflow-wrap: anywhere; box-shadow: 0 3px 0 var(--paper-edge); }
.vote button[aria-pressed="true"] { background: var(--red); color: var(--paper); box-shadow: 0 3px 0 #8a2229; }
.guess { display: flex; flex-direction: column; gap: 10px; }
.guess input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--paper-edge); background: #fff; color: var(--ink); }
.roles { display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.roles div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--paper-edge); padding-bottom: 6px; }
.roles span:last-child { color: var(--ink-soft); }
.roles .imp span:last-child { color: var(--red); font-weight: 700; }
.warn { font-size: .85rem; color: var(--gold); text-align: center; }
.levels.three { grid-template-columns: repeat(3, 1fr); }
.chip.tap { padding: 8px 14px; border: 0; }
.chip .n { font-variant-numeric: tabular-nums; color: var(--red); font-weight: 800; margin-left: 4px; }
.chip .heart, .pairs .heart { color: var(--red); }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tool { text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--felt-line); background: rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 2px; }
.tool small { color: var(--muted); font-size: .82rem; }
.sips { display: flex; flex-direction: column; gap: 10px; }
.sips h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sips h3 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
.timer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 18px; border-radius: 12px; background: var(--gold); color: var(--ink); }
.timer strong { font-family: var(--font-display); font-weight: 400; font-size: 2.2rem; font-variant-numeric: tabular-nums; }
.timer .btn.ghost { color: var(--ink); border-color: var(--ink); flex: none; }
.table-ring { flex: none; position: relative; width: min(100%, 340px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; border-radius: 50%; border: 2px dashed var(--felt-line); background: radial-gradient(circle, var(--felt-2), transparent 70%); }
.seat { position: absolute; transform: translate(-50%, -50%); background: var(--felt); border: 1px solid var(--felt-line); color: var(--fg); padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: .85rem; white-space: nowrap; max-width: 34%; overflow: hidden; text-overflow: ellipsis; }
.seat.me { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.seat.hit { background: var(--red); color: var(--paper); border-color: var(--red); }
.bottle { pointer-events: none; position: absolute; left: 50%; top: 50%; width: 34px; height: 136px; margin: -68px 0 0 -17px; transform-origin: 50% 50%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
.pairs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pairs li { display: grid; grid-template-columns: 1fr auto 1fr auto; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 700; }
.pairs li span:first-child { text-align: right; }
.pairs.big li { font-size: 1.2rem; padding: 14px; }
.x { width: 30px; height: 30px; border-radius: 50%; background: var(--paper-edge); color: var(--ink); flex: none; }
.pick { display: flex; align-items: center; gap: 8px; }
.pick select { flex: 1; min-width: 0; }
select, textarea, #customForm input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--felt-line); background: var(--felt); color: var(--fg); }
textarea { resize: vertical; }
.prefs { display: flex; flex-direction: column; gap: 10px; }
.pref { display: flex; flex-direction: column; gap: 6px; }
.mine { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mine li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,.18); }
.mine li span { min-width: 0; overflow-wrap: anywhere; }
.mine small { display: block; color: var(--gold); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; }
.titles { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.titles b { font-size: 1.1rem; }
.titles div { background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; }
.titles small { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--red); font-weight: 800; }
.titles b { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; overflow-wrap: anywhere; }
.titles span { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.score th, .score td { padding: 10px 6px; border-bottom: 1px solid var(--felt-line); text-align: center; }
.score th[scope="row"], .score thead th:first-child { text-align: left; }
.score thead th { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.adj { display: inline-flex; align-items: center; gap: 8px; }
.adj button { width: 30px; height: 30px; border-radius: 50%; background: var(--paper); color: var(--ink); font-weight: 800; }
.adj b { min-width: 2ch; }
.info { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); color: var(--gold); font-family: var(--font-card); font-style: italic; font-weight: 500; font-size: 1.2rem; display: grid; place-items: center; flex: none; }
.legal-card { justify-content: flex-start; padding: 28px 22px; animation: none; }
.rules-title { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; text-align: center; color: var(--ink); }
.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 10px; line-height: 1.45; }
.steps li::marker { font-weight: 800; color: var(--red); }
.tips { margin: 0; padding: 12px 0 0 1.2em; border-top: 1px dashed var(--paper-edge); display: flex; flex-direction: column; gap: 6px; color: var(--ink-soft); font-size: .92rem; }
.legal-wrap { background: rgba(0,0,0,.35); border: 1px solid var(--felt-line); border-radius: 22px; padding: 26px 22px; display: flex; flex-direction: column; gap: 30px; }
.legal { display: flex; flex-direction: column; gap: 12px; }
.legal h2 { font-family: var(--font-body); font-weight: 800; font-size: 1.55rem; color: var(--fg); line-height: 1.2; }
.legal p { color: var(--muted); line-height: 1.55; overflow-wrap: anywhere; }
.foot { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; color: var(--muted); font-size: .85rem; padding-top: 6px; }
.link { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; font-size: .95rem; padding: 4px 8px; }
.wheel-box { flex: none; position: relative; width: min(100%, 330px); aspect-ratio: 1; max-width: 100%; margin: 6px auto 0; }
.wheel { pointer-events: none; width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 0 0 6px var(--paper), 0 16px 36px rgba(0,0,0,.45); }
.pointer { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--gold); z-index: 2; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
.chips.qs { justify-content: center; }
.chip.tap.on { background: var(--gold); }
.turn strong.q { font-size: clamp(1.4rem, 7vw, 1.9rem); }
.card .text.big-result { font-family: var(--font-display); font-size: clamp(2rem, 11vw, 3rem); color: var(--red); }
.drv { justify-content: space-between; gap: 12px; }
.drv span { font-weight: 600; }
.drv select { flex: 0 1 55%; }
.drv-badge { font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; background: var(--gold); color: var(--ink); border-radius: 999px; padding: 2px 7px; }
.packs { display: flex; flex-direction: column; gap: 6px; }
.chip.tap { color: var(--ink); }
.coin { width: 150px; height: 150px; margin: 8px auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f6d58a, var(--gold) 55%, #a87d2c); color: var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-size: 2.2rem; box-shadow: 0 0 0 6px #a87d2c, 0 14px 30px rgba(0,0,0,.45); flex: none; }
.coin.spin { animation: flip .35s linear infinite; }
.coin.done { animation: land .5s ease-out; }
.coin.face { background: radial-gradient(circle at 35% 30%, #ffffff, var(--paper) 55%, var(--paper-edge)); box-shadow: 0 0 0 6px var(--paper-edge), 0 14px 30px rgba(0,0,0,.45); }
@keyframes flip { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
@keyframes land { from { transform: scale(1.25); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .coin.spin, .coin.done { animation: none; } }
.recap { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 22px 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 3px 0 var(--paper-edge), 0 18px 40px rgba(0,0,0,.35); }
.recap .kind { text-transform: uppercase; letter-spacing: .16em; font-size: .78rem; font-weight: 800; color: var(--red); text-align: center; }
.recap h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; text-align: center; line-height: 1.15; }
.recap .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.recap .nums b { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; color: var(--red); display: block; font-variant-numeric: tabular-nums; }
.recap .nums small { color: var(--ink-soft); font-size: .78rem; }
.recap .titles div { background: var(--felt); color: var(--fg); }
.recap .titles small { color: var(--gold); }
.recap .titles span { color: var(--muted); }
.recap .block { display: flex; flex-direction: column; gap: 6px; }
.recap .block > small { text-transform: uppercase; letter-spacing: .1em; font-size: .72rem; font-weight: 800; color: var(--red); }
.recap .pairs li { background: var(--felt); color: var(--fg); }
.recap .line { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--paper-edge); padding-bottom: 4px; font-size: .9rem; }
.recap .line span:last-child { color: var(--ink-soft); text-align: right; }
textarea.copy { width: 100%; font: .85rem/1.4 var(--font-body); }
.levels.four { grid-template-columns: repeat(4, 1fr); }
.music { display: flex; flex-direction: column; gap: 8px; }
.music-row { display: flex; align-items: center; gap: 12px; }
.music-row .btn { flex: none; padding: 11px 16px; }

function targets(cur, level) {
  let pool = S.players.filter(p => p !== cur && !blocked(p.name, cur.name));
  if (level === 'soft') return pool;
  if (S.coupleMode) {
    const part = partnerHere(cur.name);
    if (part) return pool.filter(p => p.name === part);
    pool = pool.filter(p => !partnerHere(p.name));
  }
  if (S.target === 'oppose' && !cur.pref) {
    const opp = pool.filter(p => p.g !== cur.g);
    if (opp.length) pool = opp;
  }
  return pool;
}

// Avec une préférence, ~4 défis sur 5 tombent sur le sexe préféré
function pickTarget(cur, level) {
  const pool = targets(cur, level);

  if (level !== 'soft' && cur.pref) {
    const yes = pool.filter(p => p.g === cur.pref), no = pool.filter(p => p.g !== cur.pref);
    const from = yes.length && (!no.length || Math.random() < .8) ? yes : no;

}

// Musique composée en direct par l'appli (synthèse Web Audio) : création originale,
// donc libre de droits, sans fichier à télécharger et jouable hors ligne.
const MUSIC_STYLES = {
  chill:   { label: 'Chill',   bpm: 84,  chords: [[57, [0, 3, 7, 10]], [53, [0, 4, 7, 11]], [48, [0, 4, 7, 11]], [55, [0, 4, 7, 10]]] },
  soiree:  { label: 'Soirée',  bpm: 120, chords: [[57, [0, 3, 7]], [53, [0, 4, 7]], [48, [0, 4, 7]], [55, [0, 4, 7]]] },
  sensuel: { label: 'Sensuel', bpm: 90,  chords: [[50, [0, 3, 7, 10, 14]], [46, [0, 4, 7, 11]], [43, [0, 3, 7, 10]], [45, [0, 4, 7, 10]]] },
};
const M = { on: false, style: store.get('music', 'auto'), vol: store.get('musicVol', .6), step: 0, next: 0, cur: 'chill', timer: null, out: null, fx: null, noise: null };
const musicStyle = () => M.style === 'auto' ? (LEVEL_IDX(S.level) >= 2 ? 'sensuel' : 'soiree') : M.style;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function musicInit() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const c = audioCtx;
  if (M.out) return;
  const comp = c.createDynamicsCompressor();
  M.out = c.createGain(); M.out.gain.value = M.vol * .8;
  M.out.connect(comp); comp.connect(c.destination);

  M.fx = c.createDelay(); M.fx.delayTime.value = .32;
  const fb = c.createGain(); fb.gain.value = .35;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
  const wet = c.createGain(); wet.gain.value = .3;
  M.fx.connect(lp); lp.connect(fb); fb.connect(M.fx); lp.connect(wet); wet.connect(M.out);
  M.noise = c.createBuffer(1, c.sampleRate, c.sampleRate);
  const d = M.noise.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function env(g, t, v, a, r) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + r); }
function kick(t, v) {

  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
  env(g, t, v, .005, .35); o.connect(g); g.connect(M.out); o.start(t); o.stop(t + .4);
}
function noiseHit(t, v, type, freq, len, q = .8) {

  src.buffer = M.noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
  env(g, t, v, .002, len); src.connect(f); f.connect(g); g.connect(M.out); src.start(t, Math.random() * .5); src.stop(t + len + .05);
}
const hat = (t, v, open) => noiseHit(t, v, 'highpass', 7000, open ? .18 : .04);
const snare = (t, v) => noiseHit(t, v, 'bandpass', 1800, .18);
const clap = (t, v) => [0, .012, .024].forEach(d => noiseHit(t + d, v, 'bandpass', 1400, .1, 1.2));
function synth(t, midi, dur, v, { type = 'sawtooth', cut = 900, a = .01, fx = 0, detune = 0 } = {}) {
  const c = audioCtx, f = c.createBiquadFilter(), g = c.createGain();
  f.type = 'lowpass'; f.frequency.value = cut;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a);
  g.gain.setValueAtTime(v, t + Math.max(a, dur - .05)); g.gain.exponentialRampToValueAtTime(.0001, t + dur + .3);
  f.connect(g); g.connect(M.out);
  if (fx) { const s = c.createGain(); s.gain.value = fx; g.connect(s); s.connect(M.fx); }
  (detune ? [-detune, detune] : [0]).forEach(dt => {
    const o = c.createOscillator(); o.type = type; o.frequency.value = mtof(midi); o.detune.value = dt;
    o.connect(f); o.start(t); o.stop(t + dur + .35);

}
const bass = (t, m, dur, v) => synth(t, m, dur, v, { cut: 380 });
const pad = (t, notes, dur, v) => notes.forEach(m => synth(t, m, dur, v, { cut: 1100, a: .35, fx: .6, detune: 7 }));
const stab = (t, notes, v) => notes.forEach(m => synth(t, m, .12, v, { cut: 2400, fx: .5 }));
const pluck = (t, m, v) => synth(t, m, .18, v, { type: 'triangle', cut: 3000, fx: .8 });
const keys = (t, notes, dur, v) => notes.forEach(m => synth(t, m, dur, v, { type: 'sine', cut: 4000, a: .02, fx: .5 }));

function playStep(step, t, sd) {
  const s = step % 16, bar = Math.floor(step / 16) % 4;
  if (s === 0) M.cur = musicStyle();
  const st = MUSIC_STYLES[M.cur], [root, iv] = st.chords[bar], notes = iv.map(i => root + i), barLen = sd * 16;
  const pick = () => root + 12 + iv[rand(iv.length)];
  if (M.cur === 'chill') {
    if (s === 0 || s === 10) kick(t, .55);
    if (s === 4 || s === 12) snare(t, .12);
    if (s % 2 === 0) hat(t, s % 4 === 2 ? .07 : .04);
    if (s === 0) { pad(t, notes, barLen, .045); bass(t, root - 12, barLen * .55, .16); }
    if (s === 10) bass(t, root - 12, barLen * .2, .12);
    if (s % 2 === 0 && Math.random() < .3) pluck(t, pick(), .06);
  } else if (M.cur === 'soiree') {
    if (s % 4 === 0) kick(t, .9);
    if (s === 4 || s === 12) clap(t, .28);
    if (s % 4 === 2) { hat(t, .1, true); bass(t, root - 12, sd * 1.6, .2); }
    else if (s % 2 === 1) hat(t, .035);
    if (s === 6 || s === 14) stab(t, notes.map(n => n + 12), .05);
    if (s === 0) pad(t, notes, barLen, .025);
    if (bar === 3 && s >= 12 && Math.random() < .5) snare(t, .08);

    const swing = s % 2 ? sd * .18 : 0;
    if (s === 0 || s === 7 || s === 10) kick(t, .7);
    if (s === 8) snare(t + swing, .22);
    hat(t + swing, s % 2 ? .025 : .045);
    if (s === 0) { bass(t, root - 12, barLen * .85, .2); keys(t, notes.map(n => n + 12), barLen * .45, .05); pad(t, notes, barLen, .02); }
    if (s === 8) keys(t, notes.map(n => n + 12), barLen * .4, .04);
    if (s % 4 === 2 && Math.random() < .25) pluck(t, pick() + 12, .04);

}
function musicTick() {

    M.next += sd; M.step = (M.step + 1) % 64;

}
function musicPlay() {

    clearInterval(M.timer); M.timer = setInterval(musicTick, 25);

}

document.addEventListener('visibilitychange', () => {

  }).join('');

  <div class="turn"><small>${c ? 'Défi pour' : 'Fais tourner'}</small><strong>${c ? `${esc(cur.name)} & ${esc(b.target)}` : esc(cur.name)}</strong></div>

/* ---------- La Roue ---------- */
const wheelCur = () => S.players[S.wheel.turn % S.players.length];
// 8 gages faisables ici, complétés par les niveaux inférieurs si besoin
function wheelGages() {
  if (S.alcohol && S.wheel && isDriver(wheelCur().name)) return dry(wheelGages);
  const ok = it => okHere(it.text) && (S.alcohol || !it.alcohol);
  const idx = LEVEL_IDX(S.level);
  let pool = shuffle(WHEEL[S.level].filter(ok));
  for (let i = idx - 1; pool.length < 8 && i >= 0; i--) pool = pool.concat(shuffle(WHEEL[LEVELS[i].id].filter(ok)));
  return pool.slice(0, 8);
}
function wheelSegs() {
  const w = S.wheel;
  if (w.mode === 'qui') return S.players.map(p => ({ label: p.name }));
  if (w.mode === 'perso') return S.wheelPerso.map(t => ({ label: t }));
  return w.gages;
}
function wheelSvg(segs, angle) {
  const n = segs.length, seg = 360 / n, R = 96, C = 100;
  const pt = a => [C + R * Math.cos((a - 90) * Math.PI / 180), C + R * Math.sin((a - 90) * Math.PI / 180)];
  const fs = n <= 6 ? 10 : n <= 10 ? 8.5 : 7;
  const parts = segs.map((sg, i) => {
    const [bg, fg] = WHEEL_COLORS[i % WHEEL_COLORS.length === 0 && i === n - 1 && n % 4 === 1 ? 1 : i % WHEEL_COLORS.length];
    const [x0, y0] = pt(i * seg), [x1, y1] = pt((i + 1) * seg);
    const label = sg.label.length > 13 ? sg.label.slice(0, 12) + '…' : sg.label;
    const mid = i * seg + seg / 2;
    return `<path d="M${C} ${C}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" style="fill:var(${bg});stroke:var(--felt);stroke-width:1"/>
      <text x="${C + R - 8}" y="${C}" transform="rotate(${mid - 90} ${C} ${C})" text-anchor="end" dominant-baseline="middle" style="fill:var(${fg});font:800 ${fs}px var(--font-body)">${esc(label)}</text>`;
  }).join('');
  return `<div class="wheel-box"><span class="pointer" aria-hidden="true"></span>
    <svg class="wheel" id="wheel" viewBox="0 0 200 200" role="img" aria-label="Roue" style="transform:rotate(${angle}deg)">${parts}
      <circle cx="100" cy="100" r="14" style="fill:var(--paper);stroke:var(--red);stroke-width:3"/></svg></div>`;
}
function wheel() {
  const w = S.wheel, segs = wheelSegs(), cur = wheelCur();
  const modes = `<div class="levels three" role="group" aria-label="Mode de la roue">${[['gage', 'Gages'], ['qui', 'Qui ?'], ['perso', 'Perso']].map(([id, l]) =>
    `<button data-a="w-mode" data-v="${id}" aria-pressed="${w.mode === id}">${l}</button>`).join('')}</div>`;
  let head = '', extra = '';
  if (w.mode === 'gage') {
    head = `${levelPicker()}<div class="turn"><small>Gage pour</small><strong>${esc(cur.name)}</strong></div>`;
  } else if (w.mode === 'qui') {
    head = `<div class="chips qs">${WHEEL_QUESTIONS.map(q => `<button class="chip tap ${w.q === q ? 'on' : ''}" data-a="w-q" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <div class="turn"><small>La roue décide</small><strong class="q">${esc(w.q)}</strong></div>`;
  } else {
    extra = `<form class="panel" id="persoForm"><h3><span>Ta roue</span><span>${S.wheelPerso.length} cases</span></h3>
      <textarea id="persoText" rows="5" aria-label="Cases de la roue, une par ligne">${esc(S.wheelPerso.join('\n'))}</textarea>
      <p class="hint">Une case par ligne, de 2 à 16 cases.</p><button class="btn paper" type="submit">Mettre à jour la roue</button></form>`;
  }
  const r = w.result;
  let res = '';
  if (r && !w.spinning) {
    if (w.mode === 'gage') res = `<div class="card">${cardIdx('♠', r.level)}<p class="kind">${esc(r.label)}</p><p class="text">${r.html}</p>${softNote(r)}</div>
      ${timerBlock(r.secs)}
      <div class="row"><button class="btn" data-a="w-done">Fait, au suivant</button><button class="btn ghost" data-a="w-joker">${W().joker}</button></div>`;
    else res = `<div class="card"><p class="kind">${w.mode === 'qui' ? esc(w.q) : 'La roue a choisi'}</p><p class="text big-result">${esc(r.label)}</p></div>`;
  }
  return `${topbar('La Roue', 'wheel')}${modes}${head}${wheelSvg(segs, w.from)}
    <button class="btn big" data-a="w-spin" ${w.spinning || segs.length < 2 ? 'disabled' : ''}>${w.spinning ? 'Ça tourne…' : r ? 'Relancer la roue' : 'Lancer la roue'}</button>
    ${res}${extra}`;
}
function spinWheel() {
  const el = document.getElementById('wheel');
  if (!el) return;
  const fast = matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.getBoundingClientRect();
  el.style.transition = `transform ${fast ? .3 : 3.4}s cubic-bezier(.12,.7,.15,1)`;
  el.style.transform = `rotate(${S.wheel.to}deg)`;
  setTimeout(() => {
    const w = S.wheel;
    if (!w || !w.spinning) return;
    w.spinning = false; w.from = w.to;
    const sg = wheelSegs()[w.hit];
    if (w.mode === 'gage') {
      const cur = wheelCur();
      let text = sg.text, level = S.level, x = null;
      if (text.includes('{x}')) {
        x = pickTarget(cur, S.level);
        const lvl = capLevel(cur, x, S.level);
        if (lvl !== S.level) { level = lvl; text = draw('wcap', WHEEL[lvl].filter(it => it.text.includes('{x}'))).text; }
      }
      w.result = { label: sg.label, level, capped: level !== S.level, html: isDriver(cur.name) ? dry(() => fill(text, x)) : fill(text, x), secs: secondsIn(text) };
    } else w.result = { label: sg.label };
    ring();
    render(false);
  }, fast ? 350 : 3500);
}

  const pile = pa.coin === 'pile';
  return `${topbar('Paranoïa', 'para')}

    <button class="btn big" data-a="p-next">Tour suivant</button>`;
}

/* ---------- Récap de soirée ---------- */

function sdNew() {
  const H = shuffle(S.players.filter(p => p.g === 'h').map(p => p.name));
  const F = shuffle(S.players.filter(p => p.g === 'f').map(p => p.name));
  const n = Math.max(H.length, F.length);
  while (H.length < n) H.push(null);
  while (F.length < n) F.push(null);
  const rounds = [];
  for (let r = 0; r < n; r++) {
    const pairs = [], pause = [];
    for (let i = 0; i < n; i++) {
      const h = H[i], f = F[(i + r) % n];
      if (h && f && !blocked(h, f)) pairs.push([h, f]);
      else { if (h) pause.push(h); if (f) pause.push(f); }
    }
    rounds.push({ pairs, pause, q: draw('sd' + S.level, SD_QUESTIONS[S.level]) });
  }
  const met = {};
  rounds.forEach(r => r.pairs.forEach(([a, b]) => { (met[a] = met[a] || []).push(b); (met[b] = met[b] || []).push(a); }));
  const canVote = n => !(S.coupleMode && partnerHere(n));
  Object.keys(met).forEach(k => { met[k] = met[k].filter(canVote); if (!canVote(k) || !met[k].length) delete met[k]; });
  S.sd = { rounds, r: 0, level: S.level, step: 'round', met, voters: shuffle(Object.keys(met)), v: 0, revealed: false, sel: [], votes: {} };
}

  if (s.matches) return s.matches;

    if ((s.votes[b] || []).includes(a)) { const k = [a, b].sort().join('|'); if (!done.has(k)) { done.add(k); matches.push([a, b]); } }
    else oneWay++;
  }));
  s.matches = matches; s.oneWay = oneWay;
  return matches;
}

  const maxU = max - (cfg.white ? 1 : 0);

  return `${topbar('Undercover', 'uc')}

    <div class="stepper"><span><b>Undercover</b><br><span class="hint">Ont un mot proche de celui des civils</span></span>

function ucNew() {
  const cfg = S.ucCfg;
  const words = UC_WORDS.concat(cfg.hot ? UC_WORDS_HOT : [], ...S.packs.filter(k => PACKS[k]).map(k => PACKS[k].uc));
  let pair = draw('uc', words);
  if (Math.random() < .5) pair = [pair[1], pair[0]];
  const roles = shuffle([
    ...Array(cfg.under).fill('under'),
    ...(cfg.white ? ['white'] : []),
    ...Array(S.players.length - cfg.under - (cfg.white ? 1 : 0)).fill('civil'),
  ]);
  S.uc = {
    civil: pair[0], under: pair[1],
    ps: S.players.map((p, i) => ({ name: p.name, role: roles[i], alive: true })),
    step: 'pass', idx: 0, revealed: false, round: 1, order: [], sel: null, out: null, guess: null, winner: null,
  };
}
function ucOrder() {
  const alive = shuffle(S.uc.ps.filter(p => p.alive));
  const k = alive.findIndex(p => p.role !== 'white');
  S.uc.order = alive.slice(k).concat(alive.slice(0, k)).map(p => p.name);
}
const roleName = r => ({ civil: 'Civil', under: 'Undercover', white: 'Mr White' }[r]);

/* ---------- Classement ---------- */
function score() {
  const rows = S.players.map(p => ({ n: p.name, ...stat(p.name) }));
  const best = (f, label) => { const top = rows.slice().sort((a, b) => b[f] - a[f])[0]; return top && top[f] > 0 ? `<div><small>${label}</small><b>${esc(top.n)}</b><span>${top[f]}</span></div>` : ''; };
  const titles = best('sips', W().top) + best('done', 'Le plus courageux') + best('jokers', 'Roi du joker');
  return `${topbar('Classement')}
  ${titles ? `<section class="titles">${titles}</section>` : `<p class="howto">Les compteurs se remplissent tout seuls quand vous jouez : défis faits, jokers, ${W().sips.toLowerCase()}.</p>`}
  <div class="scroll"><table class="score">
    <thead><tr><th scope="col">Joueur</th><th scope="col">${W().sips}</th><th scope="col">Jokers</th><th scope="col">Défis</th></tr></thead>
    <tbody>${rows.sort((a, b) => b.sips - a.sips).map(r => `<tr><th scope="row">${esc(r.n)}</th>
      <td><span class="adj"><button data-a="sip-minus" data-v="${esc(r.n)}" aria-label="Retirer une gorgée à ${esc(r.n)}">−</button><b>${r.sips}</b><button data-a="sip" data-v="${esc(r.n)}" aria-label="Ajouter une gorgée à ${esc(r.n)}">+</button></span></td>
      <td>${r.jokers}</td><td>${r.done}</td></tr>`).join('')}</tbody>
  </table></div>
  ${S.confirm === 'reset' ? `<div class="row"><button class="btn red" data-a="reset-ok">Oui, tout remettre à zéro</button><button class="btn ghost" data-a="reset-no">Annuler</button></div>`
    : `<button class="btn ghost" data-a="reset">Remettre les compteurs à zéro</button>`}
  <button class="btn" data-a="open" data-v="recap">Voir le récap de la soirée</button>
  <section class="panel"><h3><span>Cartes déjà vues</span><span>${seenCount()}</span></h3>
    <p class="hint">Les cartes ne reviennent pas d'une soirée à l'autre tant que tout le paquet n'a pas été joué.</p>
    <button class="btn ghost" data-a="seen-reset">Revoir toutes les cartes</button></section>`;
}

const SCREENS = { home, aov, bottle, wheel, para, recap, ucsetup: ucSetup, uc, sdsetup: sdSetup, sd, rel, custom, score, legal, mp, mpjoin };
let lastScreen = null;
function render(scroll = true) {
  const s = S.screen;
  app.innerHTML = S.intro ? intro() : S.gate ? gate() : S.info ? rules() : SCREENS[s] ? SCREENS[s]() : deck(s);
  document.body.classList.toggle('on-tabs', !S.intro && !S.gate && !S.info && s === 'home');
  document.body.classList.toggle('on-intro', S.intro);
  const key = (S.intro && 'intro') || S.gate || (S.info && 'info') || (s === 'home' ? 'home-' + S.tab : s);
  if (scroll && key !== lastScreen) window.scrollTo(0, 0);
  lastScreen = key;
  if (s === 'bottle' && S.bottle.spinning && !S.gate && !S.info) spinBottle();
  if (s === 'wheel' && S.wheel.spinning && !S.gate && !S.info) spinWheel();
  if (s === 'mp' && !S.intro && !S.gate && !S.info) mpAfter();
}

function spinBottle() {
  const el = document.getElementById('bottle');
  if (!el) return;
  const fast = matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.getBoundingClientRect();
  el.style.transition = `transform ${fast ? .3 : 2.6}s cubic-bezier(.15,.75,.2,1)`;
  el.style.transform = `rotate(${S.bottle.to}deg)`;
  setTimeout(() => {
    const b = S.bottle;
    if (!b || !b.spinning) return;
    b.spinning = false; b.from = b.to;
    const cur = S.players[b.turn % S.players.length], x = byName(b.target);
    const make = () => {
      const lvl = capLevel(cur, x, S.level);
      const raw = draw('bottle' + lvl, cards('bottle', lvl));
      return { level: lvl, capped: lvl !== S.level, html: fill(raw, x), secs: secondsIn(raw) };
    };
    b.card = isDriver(cur.name) ? dry(make) : make();
    render(false);
  }, fast ? 350 : 2700);
}

function drawDeck() {
  const g = S.screen, lvl = S.level;
  S.deck.card = { v: draw(g + lvl, cards(g, lvl)), level: lvl };
}

// Sans alcool, le joker donne un gage tiré au hasard (faisable sur place)
function joker(n) {
  bump(n, 'jokers');
  if (S.alcohol && !isDriver(n)) { bump(n, 'sips', 2); toast(`Joker ! 2 gorgées pour ${n}.`); return; }
  bump(n, 'sips');
  const ok = GAGES.filter(okHere);
  toast(`Joker ! Gage pour ${n} : ${draw('gage', ok.length ? ok : GAGES)}`);
}

/* ---------- Chacun son téléphone : parties en ligne ---------- */
// Le téléphone qui crée la partie sert de serveur : les autres s'y connectent en direct (WebRTC, via PeerJS)
// avec un code à 4 lettres. L'hôte garde tout l'état et n'envoie à chaque téléphone que ce qu'il doit voir.
const MP_PREFIX = 'la-tournee-v1-';
const MP_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ'; // sans I, L, O : pas de confusion avec 1 et 0
const MP_LOCAL = /[?&]local(=|&|$)/.test(location.search); // tests : partie entre onglets d'un même navigateur, sans réseau
const MP_CID = (() => { // identifiant de ce téléphone : il retrouve sa place (et sa carte) après une coupure
  const k = 'tournee.cid', mk = () => Math.random().toString(36).slice(2, 12);
  try { const box = MP_LOCAL ? sessionStorage : localStorage; let c = box.getItem(k); if (!c) { c = mk(); box.setItem(k, c); } return c; } catch (e) { return mk(); }
})();
const MP_GAMES = [
  { id: 'lg', name: 'Loup-Garou', icon: '🐺', desc: "Tu es le maître du jeu : la roue distribue une carte secrète sur le téléphone de chacun." },
  { id: 'gp', name: 'Téléphone dessiné', icon: '✏️', desc: "Écris, dessine, devine : la phrase passe de téléphone en téléphone et se déforme." },
  { id: 'pk', name: 'Poker', icon: '♠️', desc: "Texas Hold'em entre amis : tes cartes sur ton téléphone, jetons fictifs, l'appli gère pot et blindes." },
  { id: 'bj', name: 'Blackjack', icon: '🃏', desc: "Tout le monde contre la banque, tenue par l'appli. Avec gages de soirée en option." },
];
let MP = null, mpLock = null;

const mpCode = () => Array.from({ length: 4 }, () => MP_CHARS[rand(MP_CHARS.length)]).join('');
const mpCleanName = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 20);
const mpGameName = id => (MP_GAMES.find(g => g.id === id) || {}).name || 'Partie en ligne';
function mpLoadLib() {
  if (MP_LOCAL || window.Peer) return Promise.resolve();
  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'vendor/peerjs.min.js'; s.onload = ok; s.onerror = ko;
    document.head.appendChild(s);
  });
}
const mpNewPeer = id => MP_LOCAL ? localPeer(id) : id ? new Peer(id, { debug: 0 }) : new Peer({ debug: 0 });

// Imite la petite partie de l'API PeerJS utilisée ici, avec un BroadcastChannel (mode ?local)
function localPeer(id) {
  const me = id || 'g' + Math.random().toString(36).slice(2, 9), bc = new BroadcastChannel('la-tournee-mp');
  const h = {}, conns = {}, post = m => bc.postMessage({ ...m, from: me });
  const mk = other => {
    const ev = {}, c = conns[other] = {
      peer: other, open: false, on(e, f) { ev[e] = f; },
      send(d) { post({ k: 'data', to: other, d }); },
      close() { post({ k: 'close', to: other }); c.drop(); },
      drop() { if (c.dead) return; c.dead = true; c.open = false; delete conns[other]; ev.close && ev.close(); },
      up() { c.open = true; ev.open && ev.open(); }, ev,
    };
    return c;
  };
  const peer = {
    id: me, destroyed: false, disconnected: false, on(e, f) { h[e] = f; }, reconnect() {},
    connect(to) {
      const c = mk(to);
      setTimeout(() => post({ k: 'open', to }), 0);
      setTimeout(() => { if (!c.open && !c.dead && h.error) h.error({ type: 'peer-unavailable' }); }, 2500);
      return c;
    },
    destroy() { peer.destroyed = true; Object.values(conns).forEach(c => c.close()); bc.close(); },
  };
  bc.onmessage = ({ data: m }) => {
    if (m.to !== me || peer.destroyed) return;
    if (m.k === 'open') { const c = mk(m.from); h.connection && h.connection(c); post({ k: 'ack', to: m.from }); setTimeout(() => c.up(), 0); }
    else if (m.k === 'ack') { const c = conns[m.from]; c && c.up(); }
    else if (m.k === 'data') { const c = conns[m.from]; c && c.ev.data && c.ev.data(m.d); }
    else if (m.k === 'close') { const c = conns[m.from]; c && c.drop(); }
  };
  setTimeout(() => h.open && h.open(me), 0);
  return peer;
}

function mpWake() {
  try { if (navigator.wakeLock && !mpLock) navigator.wakeLock.request('screen').then(l => { mpLock = l; l.addEventListener('release', () => { if (mpLock === l) mpLock = null; }); }).catch(() => {}); } catch (e) {}
}
function mpClose(forget) {
  const m = MP;
  if (!m) return;
  MP = null;
  [m.retry, m.wd, m.lgT, m.gpT, m.gpG].forEach(clearTimeout);
  if (m.role === 'host') {
    m.conns.forEach(c => { try { c.send({ t: 'bye' }); } catch (e) {} });
    if (forget) store.set('mpHost', null);
  }
  setTimeout(() => { try { m.peer && m.peer.destroy(); } catch (e) {} }, 300);
  if (mpLock) { mpLock.release().catch(() => {}); mpLock = null; }
}
function mpFail(msg) { if (!MP) return; MP.status = 'error'; MP.err = msg; mpRefresh(); }
const NET_ERR = "Impossible de joindre le serveur de parties. Vérifie ta connexion internet.";

/* --- Hôte --- */
function mpHost(game, opts = {}) {
  mpClose();
  const resume = opts.resume;
  MP = { role: 'host', game, code: resume ? resume.code : mpCode(), status: 'connecting', conns: new Map(), H: resume ? resume.H : MPG[game].init(opts.name), resumed: !!resume, tries: 0 };
  if (resume) { MP.H.players.forEach(p => { p.on = p.cid === MP_CID; }); MPG[game].resume && MPG[game].resume(); }
  S.screen = 'mp'; S.confirm = null; render();
  const m = MP;
  mpLoadLib().then(() => MP === m && mpHostPeer(), () => mpFail(NET_ERR));
  mpWake();
}
function mpHostPeer() {
  const m = MP, peer = m.peer = mpNewPeer(MP_PREFIX + m.code);
  peer.on('open', () => { if (MP !== m || m.peer !== peer) return; m.status = 'open'; m.tries = 0; mpSave(); mpRefresh(); });
  peer.on('connection', conn => mpAccept(m, conn));
  peer.on('disconnected', () => setTimeout(() => { try { if (MP === m && peer.disconnected && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 2000));
  peer.on('error', e => {
    if (MP !== m || m.peer !== peer) return;
    if (e.type === 'unavailable-id') {
      // Code déjà pris. En reprise de partie, l'ancien salon met quelques secondes à se libérer : on insiste.
      try { peer.destroy(); } catch (x) {}
      if (!m.resumed || m.tries++ > 15) { m.resumed = false; m.code = mpCode(); }
      setTimeout(() => MP === m && mpHostPeer(), m.resumed ? 2500 : 50);
    } else if (m.status !== 'open') { try { peer.destroy(); } catch (x) {} mpFail(NET_ERR); }
  });
}
function mpAccept(m, conn) {
  conn.on('data', d => { if (MP === m) mpHostRecv(conn, d); });
  conn.on('close', () => {
    if (MP !== m || !conn.cid || m.conns.get(conn.cid) !== conn) return;
    m.conns.delete(conn.cid);
    const p = mpP(conn.cid);
    if (p) p.on = false;
    mpPush();
  });
  conn.on('error', () => {});
}
const mpP = cid => MP.H.players.find(p => p.cid === cid);
function mpRefuse(conn, msg) { try { conn.send({ t: 'refuse', msg }); } catch (e) {} setTimeout(() => { try { conn.close(); } catch (e) {} }, 800); }
function mpHostRecv(conn, d) {
  if (!d || typeof d !== 'object') return;
  const H = MP.H;
  if (d.t === 'hello') {
    const cid = String(d.cid || '').slice(0, 24), name = mpCleanName(d.name);
    if (!cid || !name || cid === MP_CID) return mpRefuse(conn, "Impossible de rejoindre ta propre partie depuis le même téléphone.");
    let p = mpP(cid);
    if (!p) {
      if (H.step !== 'lobby' && !MPG[MP.game].lateJoin) return mpRefuse(conn, 'La partie a déjà commencé. Attends la prochaine !');
      if (H.players.length >= 20) return mpRefuse(conn, 'La partie est complète (20 joueurs maximum).');
      let nm = name, k = 2;
      while (H.players.some(x => x.name.toLowerCase() === nm.toLowerCase())) nm = `${name} ${k++}`;

function mpJoin(code, name) {
  mpClose();

function mpGuestConnect() {
  const m = MP;
  [m.retry, m.wd].forEach(clearTimeout);
  if (m.peer) { const old = m.peer; setTimeout(() => { try { old.destroy(); } catch (e) {} }, 0); }
  m.conn = null;
  const peer = m.peer = mpNewPeer();
  peer.on('open', () => {
    if (MP !== m || m.peer !== peer) return;
    const conn = m.conn = peer.connect(MP_PREFIX + m.code, { reliable: true });
    conn.on('open', () => { if (MP === m && m.conn === conn) conn.send({ t: 'hello', cid: MP_CID, name: m.name }); });
    conn.on('data', d => { if (MP === m && m.conn === conn) mpGuestRecv(d); });
    conn.on('close', () => { if (MP === m && m.conn === conn) mpLost(); });
    conn.on('error', () => {});
    m.wd = setTimeout(() => { if (MP === m && m.conn === conn && m.status !== 'open') mpLost(); }, 12000);
  });

}

  if (d.t === 'state' && d.v && MPG[d.v.game]) {
    clearTimeout(m.wd);
    const prev = m.view;
    m.ever = true; m.status = 'open'; m.view = d.v; m.game = d.v.game;
    store.set('mpLast', { code: m.code, name: m.name });
    MPG[m.game].notify && MPG[m.game].notify(prev, d.v);
    mpRefresh();
  } else if (d.t === 'refuse' || d.t === 'bye') {
    m.status = d.t === 'bye' ? 'ended' : 'refused';
    m.err = d.t === 'bye' ? "L'hôte a fermé la partie." : String(d.msg || '').slice(0, 200);

}

}

app.addEventListener('input', e => { if (e.target.id === 'musicVol') musicVolume(+e.target.value); });
app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  if (S.timer && !KEEP_TIMER.has(b.dataset.a)) stopTimer();
  actions[b.dataset.a](b.dataset.v);
});
app.addEventListener('change', e => {
  if (e.target.id === 'driverSel') { S.driver = e.target.value || null; store.set('driver', S.driver); render(false); return; }
  if (e.target.id !== 'cGame') return;
  const g = e.target.value;
  document.getElementById('cText2').hidden = g !== 'tp';
  document.getElementById('cText').placeholder = { action: 'Ex : Fais un bisou à {x} sur le front.', verite: 'Ex : Qu\'est-ce que tu penses vraiment de {x} ?', bottle: 'Ex : Faites un tango, {x} et toi.', nhie: 'Ex : volé un panneau de signalisation', qui: 'Ex : finir marié·e à Las Vegas', tp: 'Premier choix' }[g];
  document.getElementById('cHint').textContent = CUSTOM_HINTS[g];
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'addForm') {
    const inp = document.getElementById('newPlayer');
    const name = inp.value.trim();
    if (!name) return;
    if (S.players.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast(`${name} est déjà dans la partie.`); return; }
    S.players.push({ name, g: e.submitter && e.submitter.value === 'f' ? 'f' : 'h' }); savePlayers(); render(false);
    document.getElementById('newPlayer').focus();
  } else if (id === 'joinForm') {
    const name = mpCleanName(document.getElementById('jName').value);
    const ci = document.getElementById('jCode');
    const code = ci ? ci.value.toUpperCase().replace(/[^A-Z]/g, '') : '';
    if (ci && code.length !== 4) { toast('Le code fait 4 lettres.'); return; }
    if (!name) { toast('Écris ton prénom.'); return; }
    store.set('mpLast', { ...store.get('mpLast', {}), name });
    if (ci) { S.mpCode = code; mpJoin(code, name); } else mpHost(S.mpForm, { name });
  } else if (id === 'guessForm') {
    const g = document.getElementById('guessIn').value.trim();
    if (!g) return;
    S.uc.guess = g;
    if (norm(g) === norm(S.uc.civil)) S.uc.winner = 'white';
    render(false);
  } else if (id === 'persoForm') {
    const list = document.getElementById('persoText').value.split('\n').map(t => t.trim()).filter(Boolean).slice(0, 16);
    if (list.length < 2) { toast('Il faut au moins 2 cases.'); return; }
    S.wheelPerso = list; store.set('wheelPerso', list); S.wheel.result = null; toast('Roue mise à jour.'); render(false);
  } else if (id === 'customForm') {
    const game = document.getElementById('cGame').value, level = document.getElementById('cLevel').value;
    const text = document.getElementById('cText').value.trim(), text2 = document.getElementById('cText2').value.trim();
    if (!text || (game === 'tp' && !text2)) { toast(game === 'tp' ? 'Remplis les deux choix.' : 'Écris le texte de la carte.'); return; }
    S.custom.unshift(game === 'tp' ? { game, level, text, text2 } : { game, level, text });
    store.set('custom', S.custom); toast('Carte ajoutée au paquet.'); render(false);
  }
});

// Appli Android : le bouton retour revient au menu au lieu de quitter le jeu
const capApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (capApp) capApp.addListener('backButton', () => {
  if (S.timer) stopTimer();
  if (S.info) actions['info-close']();
  else if (S.gate) actions['gate-no']();
  else if (S.edit) actions['bl-done']();
  else if (S.intro) actions['intro-go']();
  else if (S.screen === 'mp') actions[S.confirm === 'mpquit' ? 'mp-quit-no' : 'mp-quit']();
  else if (S.screen !== 'home') actions.home();
  else if (S.tab !== 'jeux') actions.tab('jeux');
  else capApp.exitApp();
});

// Lien d'invitation : ...?code=ABCD ouvre directement l'écran pour rejoindre
const urlCode = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z]/g, '');
if (urlCode.length === 4) { S.intro = false; S.mpCode = urlCode; S.mpForm = 'join'; S.screen = 'mpjoin'; }

render();
</script>
