<style>
/* Layout: une colonne de 480px max, comme un tapis de jeu ; les cartes sont des cartes à jouer en papier posées sur le feutre. */
:root {
  color-scheme: dark;
  --felt: #10261e;
  --felt-2: #183a2d;
  --felt-line: #2b5544;
  --paper: #f4ecdb;
  --paper-edge: #d9ccb0;
  --ink: #221c17;
  --ink-soft: #6d6255;
  --red: #c93a3f;
  --gold: #e7b552;
  --fg: #eef3ee;
  --muted: #a3bcb0;
  --font-display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-card: "Fraunces", Georgia, "Times New Roman", serif;
  --r: 14px;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--felt);
  background-image: radial-gradient(120% 80% at 50% 0%, var(--felt-2), var(--felt) 70%);
  background-attachment: fixed;
  color: var(--fg);
  font: 16px/1.5 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.topbar h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: .01em; }
.back { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--felt-line); font-size: 1.3rem; display: grid; place-items: center; flex: none; }

.logo { font-family: var(--font-display); font-weight: 400; font-size: clamp(3rem, 15vw, 4.4rem); line-height: .95; color: var(--gold); padding-top: 12px; }
.logo span { color: var(--paper); display: block; }
.tag { color: var(--muted); max-width: 32ch; }

.panel { border: 1px solid var(--felt-line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,.12); }
.panel h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 6px 6px 14px; font-weight: 600; }
.chip { padding-left: 5px; }
.chip button.sex { font-weight: 800; font-size: .75rem; color: var(--paper); background: var(--ink); }
.chip button.sex.f { background: var(--red); }
.add .sexbtn { padding-inline: 14px; flex: none; }
.chip button { width: 26px; height: 26px; border-radius: 50%; background: var(--paper-edge); color: var(--ink); font-size: .9rem; line-height: 1; }
.hint { font-size: .85rem; color: var(--muted); }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--felt-line); background: var(--felt); color: var(--fg); }

.games { display: grid; grid-template-columns: 1fr; gap: 10px; }
.game { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: var(--r); background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 var(--paper-edge), 0 10px 24px rgba(0,0,0,.25); transition: transform .15s; }
.game:active { transform: translateY(2px); }
.game[disabled] { opacity: .45; cursor: not-allowed; }
.game .suit { font-family: var(--font-display); font-size: 1.6rem; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; border: 2px solid currentColor; color: var(--red); }
.game .suit.b { color: var(--ink); }
.game b { display: block; font-size: 1.08rem; }
.game small { color: var(--ink-soft); font-size: .86rem; line-height: 1.35; display: block; }
.game .go { font-size: 1.3rem; color: var(--ink-soft); }
.rule { font-size: .88rem; color: var(--muted); border-top: 1px dashed var(--felt-line); padding-top: 14px; }
.rule strong { color: var(--gold); }

.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: rgba(0,0,0,.2); padding: 4px; border-radius: 12px; }
.levels button { padding: 9px 2px; border-radius: 9px; font-weight: 600; font-size: .8rem; line-height: 1.15; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); }
.levels button .pips { font-size: .5rem; letter-spacing: 1px; color: var(--red); }
.levels.two { grid-template-columns: 1fr 1fr; }
.levels.two button { font-size: .82rem; padding: 10px 6px; }
.levels button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }

.turn { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.turn small { text-transform: uppercase; letter-spacing: .14em; font-size: .75rem; color: var(--muted); }
.turn strong { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 10vw, 2.8rem); color: var(--gold); line-height: 1.1; overflow-wrap: anywhere; }

.card { position: relative; background: var(--paper); color: var(--ink); border-radius: 18px; min-height: min(300px, 36vh); padding: 40px 26px; display: flex; flex-direction: column; justify-content: center; gap: 14px; box-shadow: 0 3px 0 var(--paper-edge), 0 18px 40px rgba(0,0,0,.35); animation: deal .35s cubic-bezier(.2,.9,.3,1.2); }
.card .idx { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: 1; font-family: var(--font-display); color: var(--red); }
.card .idx b { font-size: 1.5rem; font-weight: 400; }
.card .idx i { font-style: normal; font-size: .5rem; letter-spacing: 1px; margin-top: 4px; }
.card .idx.tl { top: 14px; left: 16px; }
.card .idx.br { bottom: 14px; right: 16px; transform: rotate(180deg); }
.card .kind { text-transform: uppercase; letter-spacing: .16em; font-size: .78rem; font-weight: 800; color: var(--red); text-align: center; }
.card .text { font-family: var(--font-card); font-size: clamp(1.35rem, 6vw, 1.7rem); line-height: 1.3; text-align: center; text-wrap: pretty; overflow-wrap: anywhere; }
.card .text em { font-style: italic; color: var(--red); }
.card.black .idx, .card.black .kind { color: var(--ink); }
.card .or { font-family: var(--font-display); color: var(--red); text-align: center; font-size: 1.3rem; }
.card .sub { text-align: center; color: var(--ink-soft); font-size: .9rem; }
.card.back { background: var(--red); background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 14px), repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 14px); color: var(--paper); align-items: center; text-align: center; border: 8px solid var(--paper); }
.card.back .text { color: var(--paper); }
@keyframes deal { from { transform: translateY(18px) rotate(-3deg) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } .game { transition: none; } }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.btn { padding: 15px 18px; border-radius: 12px; font-weight: 800; font-size: 1.02rem; background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 #a87d2c; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a87d2c; }
.btn.red { background: var(--red); color: var(--paper); box-shadow: 0 3px 0 #8a2229; }
.btn.paper { background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 var(--paper-edge); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--felt-line); box-shadow: none; font-weight: 600; }
.btn.big { font-size: 1.3rem; padding: 22px 18px; font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.howto { font-size: .92rem; color: var(--muted); text-align: center; max-width: 38ch; margin: 0 auto; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 12px 18px; border-radius: 999px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); text-align: center; }

.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper .ctl { display: flex; align-items: center; gap: 12px; }
.stepper .ctl button { width: 40px; height: 40px; border-radius: 50%; background: var(--paper); color: var(--ink); font-size: 1.3rem; font-weight: 800; }
.stepper .ctl button[disabled] { opacity: .35; }
.stepper output { font-family: var(--font-display); font-size: 1.6rem; min-width: 1.5ch; text-align: center; font-variant-numeric: tabular-nums; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle button { width: 58px; height: 32px; border-radius: 999px; background: var(--felt-line); position: relative; flex: none; }
.toggle button::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--paper); transition: left .15s; }
.toggle button[aria-pressed="true"] { background: var(--gold); }
.toggle button[aria-pressed="true"]::after { left: 30px; }

.order { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: o; }
.order li { counter-increment: o; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.18); border: 1px solid var(--felt-line); font-weight: 600; }
.order li::before { content: counter(o); font-family: var(--font-display); color: var(--gold); width: 1.6ch; text-align: center; font-variant-numeric: tabular-nums; }
.order li.dead { opacity: .4; text-decoration: line-through; }
.vote { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.vote button { padding: 16px 10px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 800; overflow-wrap: anywhere; box-shadow: 0 3px 0 var(--paper-edge); }
.vote button[aria-pressed="true"] { background: var(--red); color: var(--paper); box-shadow: 0 3px 0 #8a2229; }
.guess { display: flex; flex-direction: column; gap: 10px; }
.guess input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--paper-edge); background: #fff; color: var(--ink); }
.roles { display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.roles div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--paper-edge); padding-bottom: 6px; }
.roles span:last-child { color: var(--ink-soft); }
.roles .imp span:last-child { color: var(--red); font-weight: 700; }
.warn { font-size: .85rem; color: var(--gold); text-align: center; }
</style>

const used = {};
function draw(key, arr) {
  const u = used[key] || (used[key] = new Set());
  if (u.size >= arr.length) u.clear();
  let i; do { i = rand(arr.length); } while (u.has(i));
  u.add(i);
  return arr[i];
}

function fill(text, current, level) {
  const others = S.players.filter(p => p !== current);
  let pool = others;
  if (S.target === 'oppose' && level !== 'soft') {
    const opp = others.filter(p => p.g !== current.g);
    if (opp.length) pool = opp;
  }
  const x = pool.length ? pool[rand(pool.length)] : null;
  return esc(text)
    .replace(/\{x\}/g, x ? `<em>${esc(x.name)}</em>` : "quelqu'un")
    .replace(/\{il\}/g, x && x.g === 'f' ? 'elle' : 'il');
}

  <p class="tag">Cinq jeux de soirée, un seul téléphone qui fait le tour de la table.</p>
  <section class="panel">
    <h3><span>Joueurs</span><span>${n}</span></h3>
    ${S.examples ? `<p class="hint">Noms d'exemple : supprime-les et ajoute ta bande.</p>` : ''}
    <div class="chips">${S.players.map((p, i) => `<span class="chip"><button class="sex ${p.g}" data-a="sex" data-v="${i}" aria-label="${esc(p.name)} : ${p.g === 'f' ? 'femme' : 'homme'}, toucher pour changer">${p.g === 'f' ? 'F' : 'H'}</button>${esc(p.name)}<button data-a="rm" data-v="${i}" aria-label="Retirer ${esc(p.name)}">✕</button></span>`).join('')}</div>
    <form class="add" id="addForm"><input id="newPlayer" placeholder="Prénom" maxlength="20" autocomplete="off" aria-label="Prénom du joueur"><button class="btn sexbtn" type="submit" value="h" aria-label="Ajouter un homme">+ H</button><button class="btn red sexbtn" type="submit" value="f" aria-label="Ajouter une femme">+ F</button></form>
    <p class="hint">Touche le H ou le F d'un joueur pour le changer.</p>
  </section>
  <section class="games">
    ${GAMES.map(g => `<button class="game" data-a="open" data-v="${g.id}" ${n < g.min ? 'disabled' : ''}>
      <span class="suit ${g.suit === '♠' || g.suit === '♣' ? 'b' : ''}" aria-hidden="true">${g.suit}</span>
      <span><b>${g.name}</b><small>${n < g.min ? `Il faut au moins ${g.min} joueurs.` : g.desc}</small></span>
      <span class="go" aria-hidden="true">›</span></button>`).join('')}
  </section>
  <p class="rule"><strong>Règle d'or :</strong> tout le monde peut refuser un défi, sans se justifier. Le joker coûte 2 gorgées (ou un gage soft choisi par le groupe). Les niveaux Hot, Intense et Sans limite sont réservés aux majeurs consentants : c'est osé, jamais porno.</p>`;
}

const targetPicker = () => `<div class="levels two" role="group" aria-label="Défis avec">
  <button data-a="target" data-v="oppose" aria-pressed="${S.target === 'oppose'}">Défis avec le sexe opposé</button>
  <button data-a="target" data-v="tous" aria-pressed="${S.target === 'tous'}">Défis avec tout le monde</button></div>`;
function aov() {
  const p = S.players[S.aov.turn % S.players.length];
  const c = S.aov.card;
  let body;
  if (!c) {
    body = `
    <div class="card back"><p class="text">Action<br>ou<br>Vérité ?</p></div>
    <div class="row"><button class="btn big red" data-a="aov-pick" data-v="action">Action</button><button class="btn big paper" data-a="aov-pick" data-v="verite">Vérité</button></div>
    <button class="btn ghost" data-a="aov-pick" data-v="random">Laisser le hasard choisir</button>`;
  } else {
    const isA = c.kind === 'action';
    body = `
    <div class="card ${isA ? '' : 'black'}">${cardIdx(isA ? 'A' : 'V', c.level)}
      <p class="kind">${isA ? 'Action' : 'Vérité'}</p>
      <p class="text">${c.html}</p>
    </div>
    <div class="row"><button class="btn" data-a="aov-next">Fait, au suivant</button><button class="btn ghost" data-a="aov-joker">Joker</button></div>
    <button class="btn ghost" data-a="aov-pick" data-v="${c.kind}">Autre carte</button>`;
  }
  return `${topbar('Action ou Vérité')}${levelPicker()}${targetPicker()}
  <div class="turn"><small>C'est au tour de</small><strong>${esc(p.name)}</strong></div>${body}`;
}

const DECKS = {
  nhie: { title: "Je n'ai jamais", how: "Lis la carte à voix haute. Ceux qui l'ont déjà fait boivent une gorgée, et racontent si le groupe insiste." },
  qui: { title: 'Qui pourrait…', how: "Lis la carte, compte jusqu'à 3, et tout le monde pointe quelqu'un. La personne la plus désignée boit autant de gorgées que de doigts pointés vers elle." },
  tp: { title: 'Tu préfères', how: "Chacun choisit en même temps (main gauche ou main droite). Le camp minoritaire boit." },
};
function deck(game) {
  const d = DECKS[game], c = S.deck.card;
  let face;
  if (!c) face = `<div class="card back"><p class="text">${d.title}</p></div>`;
  else if (game === 'tp') face = `<div class="card">${cardIdx('?', c.level)}<p class="kind">Tu préfères…</p><p class="text">${esc(c.v[0])}</p><p class="or">ou</p><p class="text">${esc(c.v[1])}</p></div>`;
  else if (game === 'nhie') face = `<div class="card black">${cardIdx('J', c.level)}<p class="kind">Je n'ai jamais…</p><p class="text">${esc(c.v)}.</p></div>`;
  else face = `<div class="card">${cardIdx('Q', c.level)}<p class="kind">Qui est le plus susceptible de…</p><p class="text">${esc(c.v)} ?</p></div>`;
  return `${topbar(d.title)}${levelPicker()}${face}
  <button class="btn big" data-a="deck-next">${c ? 'Carte suivante' : 'Tirer une carte'}</button>
  <p class="howto">${d.how}</p>`;
}

/* ---------- Undercover ---------- */
function ucMaxImp(n) { return Math.max(1, Math.ceil(n / 2) - 1); }
function ucSetup() {
  const n = S.players.length, cfg = S.ucCfg;
  const max = ucMaxImp(n);
  cfg.white = cfg.white && n >= 4;
  const maxU = max - (cfg.white ? 1 : 0);
  cfg.under = Math.min(Math.max(cfg.under, cfg.white ? 0 : 1), Math.max(maxU, 0));
  const civ = n - cfg.under - (cfg.white ? 1 : 0);
  return `${topbar('Undercover')}
  <section class="panel">
    <div class="stepper"><span><b>Undercover</b><br><span class="hint">Ont un mot proche de celui des civils</span></span>
      <span class="ctl"><button data-a="uc-u" data-v="-1" aria-label="Moins" ${cfg.under <= (cfg.white ? 0 : 1) ? 'disabled' : ''}>−</button><output>${cfg.under}</output><button data-a="uc-u" data-v="1" aria-label="Plus" ${cfg.under >= maxU ? 'disabled' : ''}>+</button></span></div>
    <div class="toggle"><span><b>Mr White</b><br><span class="hint">${n >= 4 ? "N'a aucun mot, doit bluffer" : 'À partir de 4 joueurs'}</span></span>
      <button data-a="uc-w" aria-pressed="${cfg.white}" aria-label="Activer Mr White" ${n < 4 ? 'disabled' : ''}></button></div>
    <p class="hint">${civ} civil${civ > 1 ? 's' : ''} · ${cfg.under} undercover${cfg.white ? ' · 1 Mr White' : ''}</p>
  </section>
  <section class="panel">
    <h3><span>Comment on joue</span></h3>
    <p class="hint">1. Le téléphone passe de main en main, chacun découvre son mot en secret.<br>
    2. À chaque tour, chacun donne un indice en un mot, sans dévoiler le sien.<br>
    3. On débat, puis on vote pour éliminer quelqu'un.<br>
    4. Les civils gagnent s'ils éliminent tous les imposteurs. Les imposteurs gagnent s'il ne reste qu'un civil. Mr White éliminé peut tenter de deviner le mot des civils pour gagner.</p>
  </section>
  <button class="btn big" data-a="uc-start">Distribuer les mots</button>`;
}

function ucNew() {
  const cfg = S.ucCfg;
  let pair = draw('uc', UC_WORDS);
  if (Math.random() < .5) pair = [pair[1], pair[0]];
  const roles = shuffle([
    ...Array(cfg.under).fill('under'),
    ...(cfg.white ? ['white'] : []),
    ...Array(S.players.length - cfg.under - (cfg.white ? 1 : 0)).fill('civil'),
  ]);
  S.uc = {
    civil: pair[0], under: pair[1],
    ps: S.players.map((p, i) => ({ name: p.name, role: roles[i], alive: true })),
    step: 'pass', idx: 0, revealed: false, round: 1, order: [], sel: null, out: null, guess: null, winner: null,
  };
}
function ucOrder() {
  const alive = shuffle(S.uc.ps.filter(p => p.alive));
  const k = alive.findIndex(p => p.role !== 'white');
  S.uc.order = alive.slice(k).concat(alive.slice(0, k)).map(p => p.name);
}
const roleName = r => ({ civil: 'Civil', under: 'Undercover', white: 'Mr White' }[r]);
function ucWin() {
  const a = S.uc.ps.filter(p => p.alive);
  const civ = a.filter(p => p.role === 'civil').length, imp = a.length - civ;
  if (imp === 0) return 'civils';
  if (civ <= 1) return 'imposteurs';
  return null;
}

function uc() {
  const u = S.uc;
  if (u.step === 'pass') {
    const p = u.ps[u.idx];
    if (!u.revealed) return `${topbar('Undercover')}
      <div class="turn"><small>Passe le téléphone à</small><strong>${esc(p.name)}</strong></div>
      <div class="card back"><p class="text">Mot secret</p></div>
      <button class="btn big" data-a="uc-reveal">Je suis ${esc(p.name)}, voir mon mot</button>
      <p class="howto">${u.idx + 1} / ${u.ps.length}. Ne montre ton écran à personne.</p>`;
    const word = p.role === 'white'
      ? `<p class="kind">Mr White</p><p class="text">Tu n'as pas de mot.</p><p class="sub">Écoute les indices des autres et bluffe. Si tu es éliminé·e, tu pourras deviner le mot des civils.</p>`
      : `<p class="kind">Ton mot</p><p class="text">${esc(p.role === 'civil' ? u.civil : u.under)}</p><p class="sub">Tu ne sais pas si tu es civil ou undercover.</p>`;
    return `${topbar('Undercover')}<div class="turn"><small>Mot de</small><strong>${esc(p.name)}</strong></div>
      <div class="card black">${cardIdx('♠', 'soft').replace(/<i>.*?<\/i>/g, '')}${word}</div>
      <button class="btn big" data-a="uc-hide">${u.idx + 1 < u.ps.length ? 'Cacher et passer' : 'Cacher et commencer'}</button>`;
  }
  if (u.step === 'play') return `${topbar('Undercover')}
    <div class="turn"><small>Tour</small><strong>${u.round}</strong></div>
    <section class="panel"><h3><span>Ordre de parole</span></h3>
      <p class="hint">Chacun donne un indice en un mot, dans cet ordre. Ensuite, débat libre.</p>
      <ol class="order">${u.order.map(n => `<li>${esc(n)}</li>`).join('')}</ol></section>
    <button class="btn big" data-a="uc-vote">Passer au vote</button>`;
  if (u.step === 'vote') return `${topbar('Undercover')}
    <div class="turn"><small>Tour ${u.round}</small><strong>Qui on élimine ?</strong></div>
    <div class="vote">${u.ps.filter(p => p.alive).map(p => `<button data-a="uc-sel" data-v="${esc(p.name)}" aria-pressed="${u.sel === p.name}">${esc(p.name)}</button>`).join('')}</div>
    ${u.sel ? `<button class="btn big red" data-a="uc-kill">Éliminer ${esc(u.sel)}</button>` : `<p class="howto">Touchez le nom du joueur qui a reçu le plus de votes.</p>`}
    <button class="btn ghost" data-a="uc-back">Retour aux indices</button>`;
  if (u.step === 'reveal') {
    const p = u.ps.find(x => x.name === u.out);
    let extra = '';
    if (p.role === 'white' && u.guess === null) extra = `<form class="guess" id="guessForm"><label for="guessIn" class="sub">Mr White, devine le mot des civils :</label><input id="guessIn" autocomplete="off" placeholder="Ton mot"><div class="row"><button class="btn red" type="submit">Valider</button><button class="btn paper" type="button" data-a="uc-giveup">J'abandonne</button></div></form>`;
    else if (p.role === 'white') extra = `<p class="sub">Réponse : « ${esc(u.guess)} ». ${u.winner === 'white' ? 'Bien vu !' : 'Raté.'}</p>`;
    return `${topbar('Undercover')}
      <div class="card ${p.role === 'civil' ? 'black' : ''}"><p class="kind">Éliminé·e</p><p class="text">${esc(p.name)}<br>était <em>${roleName(p.role)}</em></p>${extra}</div>
      ${p.role === 'white' && u.guess === null ? '' : `<button class="btn big" data-a="uc-continue">Continuer</button>`}`;
  }
  // fin
  const msg = { civils: 'Les civils gagnent !', imposteurs: 'Les imposteurs gagnent !', white: 'Mr White gagne !' }[u.winner];
  return `${topbar('Undercover')}
    <div class="turn"><small>Fin de partie</small><strong>${msg}</strong></div>
    <div class="card"><p class="kind">Les mots</p><p class="text">Civils : ${esc(u.civil)}<br>Undercover : <em>${esc(u.under)}</em></p>
      <div class="roles">${u.ps.map(p => `<div class="${p.role === 'civil' ? '' : 'imp'}"><span>${esc(p.name)}</span><span>${roleName(p.role)}</span></div>`).join('')}</div></div>
    <p class="howto">Les perdants boivent une gorgée.</p>
    <div class="row"><button class="btn" data-a="uc-again">Rejouer</button><button class="btn ghost" data-a="home">Menu</button></div>`;
}

/* ---------- Rendu & actions ---------- */
function gate() {
  const l = LEVELS.find(x => x.id === S.gate);
  return `<div class="turn"><small>Niveau</small><strong>${l.label}</strong></div>
  <div class="card"><p class="kind">Avant de continuer</p>
    <p class="text">Tout le monde autour de la table est majeur et partant ?</p>
    <p class="sub">Les défis vont jusqu'aux sous-vêtements, aux bisous et aux pelles, jamais plus loin. Chacun peut refuser à tout moment avec le joker, sans se justifier.</p></div>
  <button class="btn big red" data-a="gate-ok">On est tous majeurs et d'accord</button>
  <button class="btn ghost" data-a="gate-no">Rester au niveau actuel</button>`;
}

function render() {
  const s = S.screen;
  if (S.gate) { app.innerHTML = gate(); window.scrollTo(0, 0); return; }
  app.innerHTML = s === 'home' ? home() : s === 'aov' ? aov() : s === 'ucsetup' ? ucSetup() : s === 'uc' ? uc() : deck(s);
  window.scrollTo(0, 0);
}

function drawDeck() {
  const g = S.screen, lvl = S.level;
  const src = g === 'nhie' ? NHIE : g === 'qui' ? QUI : TP;
  S.deck.card = { v: draw(g + lvl, src[lvl]), level: lvl };
}

const actions = {
  home() { S.screen = 'home'; S.uc = null; render(); },
  rm(v) { S.players.splice(+v, 1); savePlayers(); render(); },
  sex(v) { const p = S.players[+v]; p.g = p.g === 'f' ? 'h' : 'f'; savePlayers(); render(); },
  target(v) { S.target = v; store.set('target', v); if (S.aov.card) S.aov.card = null; render(); },
  'gate-ok'() { S.adultOk = true; const v = S.gate; S.gate = null; actions.level(v); },
  'gate-no'() { S.gate = null; render(); },
  level(v) {
    if (LEVELS.find(l => l.id === v).adult && !S.adultOk) { S.gate = v; render(); return; }
    S.level = v; store.set('level', v);
    if (v === 'hot') toast('Niveau Hot : majeurs uniquement, et chacun peut refuser.');
    if (S.screen === 'aov') S.aov.card = null;
    else if (S.deck.card) drawDeck();
    render();
  },
  open(v) {
    if (v === 'uc') { S.ucCfg = S.ucCfg || { under: 1, white: false }; S.screen = 'ucsetup'; }
    else { S.screen = v; S.aov.card = null; S.deck.card = null; S.aov.turn = rand(S.players.length); }
    render();
  },
  'aov-pick'(v) {
    const kind = v === 'random' ? (Math.random() < .5 ? 'action' : 'verite') : v;
    const p = S.players[S.aov.turn % S.players.length];
    S.aov.card = { kind, level: S.level, html: fill(draw('aov' + S.level + kind, AOV[S.level][kind]), p, S.level) };
    render();
  },
  'aov-next'() { S.aov.turn++; S.aov.card = null; render(); },
  'aov-joker'() { toast('Joker ! 2 gorgées.'); actions['aov-next'](); },
  'deck-next'() { drawDeck(); render(); },
  'uc-u'(v) { S.ucCfg.under += +v; render(); },
  'uc-w'() { S.ucCfg.white = !S.ucCfg.white; render(); },
  'uc-start'() { ucNew(); S.screen = 'uc'; render(); },
  'uc-reveal'() { S.uc.revealed = true; render(); },
  'uc-hide'() {
    const u = S.uc; u.revealed = false;
    if (++u.idx >= u.ps.length) { u.step = 'play'; ucOrder(); }
    render();
  },
  'uc-vote'() { S.uc.step = 'vote'; S.uc.sel = null; render(); },
  'uc-back'() { S.uc.step = 'play'; render(); },
  'uc-sel'(v) { S.uc.sel = v; render(); },
  'uc-kill'() {
    const u = S.uc; u.ps.find(p => p.name === u.sel).alive = false;
    u.out = u.sel; u.guess = null; u.step = 'reveal'; render();
  },
  'uc-giveup'() { S.uc.guess = '…'; render(); },
  'uc-continue'() {
    const u = S.uc;
    const w = u.winner || ucWin();
    if (w) { u.winner = w; u.step = 'end'; }
    else { u.round++; ucOrder(); u.step = 'play'; }
    render();
  },
  'uc-again'() { ucNew(); render(); },
};

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  actions[b.dataset.a](b.dataset.v);
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'addForm') {
    const inp = document.getElementById('newPlayer');
    const name = inp.value.trim();
    if (!name) return;
    if (S.players.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast(`${name} est déjà dans la partie.`); return; }
    S.players.push({ name, g: e.submitter && e.submitter.value === 'f' ? 'f' : 'h' }); savePlayers(); render();
    document.getElementById('newPlayer').focus();
  } else if (e.target.id === 'guessForm') {
    const g = document.getElementById('guessIn').value.trim();
    if (!g) return;
    S.uc.guess = g;
    if (norm(g) === norm(S.uc.civil)) S.uc.winner = 'white';
    render();
  }
});

render();
</script>
</body>
</html>
