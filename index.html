<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10261e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Tournée">
<title>La Tournée</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;800&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap">
<style>
/* Layout: une colonne de 480px max, comme un tapis de jeu ; les cartes sont des cartes à jouer en papier posées sur le feutre. */
:root {
  color-scheme: dark;
  --felt: #10261e;
  --felt-2: #183a2d;
  --felt-line: #2b5544;
  --paper: #f4ecdb;
  --paper-edge: #d9ccb0;
  --ink: #221c17;
  --ink-soft: #6d6255;
  --red: #c93a3f;
  --gold: #e7b552;
  --fg: #eef3ee;
  --muted: #a3bcb0;
  --font-display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-card: "Fraunces", Georgia, "Times New Roman", serif;
  --r: 14px;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--felt);
  background-image: radial-gradient(120% 80% at 50% 0%, var(--felt-2), var(--felt) 70%);
  background-attachment: fixed;
  color: var(--fg);
  font: 16px/1.5 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.topbar h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: .01em; }
.back { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--felt-line); font-size: 1.3rem; display: grid; place-items: center; flex: none; }

.logo { font-family: var(--font-display); font-weight: 400; font-size: clamp(3rem, 15vw, 4.4rem); line-height: .95; color: var(--gold); padding-top: 12px; }
.logo span { color: var(--paper); display: block; }
.tag { color: var(--muted); max-width: 32ch; }

.panel { border: 1px solid var(--felt-line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,.12); }
.panel h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 6px 6px 14px; font-weight: 600; }
.chip { padding-left: 5px; }
.chip button.sex { font-weight: 800; font-size: .75rem; color: var(--paper); background: var(--ink); }
.chip button.sex.f { background: var(--red); }
.add .sexbtn { padding-inline: 14px; flex: none; }
.chip button { width: 26px; height: 26px; border-radius: 50%; background: var(--paper-edge); color: var(--ink); font-size: .9rem; line-height: 1; }
.hint { font-size: .85rem; color: var(--muted); }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--felt-line); background: var(--felt); color: var(--fg); }

.games { display: grid; grid-template-columns: 1fr; gap: 10px; }
.game { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: var(--r); background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 var(--paper-edge), 0 10px 24px rgba(0,0,0,.25); transition: transform .15s; }
.game:active { transform: translateY(2px); }
.game[disabled] { opacity: .45; cursor: not-allowed; }
.game .suit { font-family: var(--font-display); font-size: 1.6rem; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; border: 2px solid currentColor; color: var(--red); }
.game .suit.b { color: var(--ink); }
.game b { display: block; font-size: 1.08rem; }
.game small { color: var(--ink-soft); font-size: .86rem; line-height: 1.35; display: block; }
.game .go { font-size: 1.3rem; color: var(--ink-soft); }
.rule { font-size: .88rem; color: var(--muted); border-top: 1px dashed var(--felt-line); padding-top: 14px; }
.rule strong { color: var(--gold); }

.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: rgba(0,0,0,.2); padding: 4px; border-radius: 12px; }
.levels button { padding: 9px 2px; border-radius: 9px; font-weight: 600; font-size: .8rem; line-height: 1.15; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); }
.levels button .pips { font-size: .5rem; letter-spacing: 1px; color: var(--red); }
.levels.two { grid-template-columns: 1fr 1fr; }
.levels.two button { font-size: .82rem; padding: 10px 6px; }
.levels button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }

.turn { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.turn small { text-transform: uppercase; letter-spacing: .14em; font-size: .75rem; color: var(--muted); }
.turn strong { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 10vw, 2.8rem); color: var(--gold); line-height: 1.1; overflow-wrap: anywhere; }

.card { position: relative; background: var(--paper); color: var(--ink); border-radius: 18px; min-height: min(300px, 36vh); padding: 40px 26px; display: flex; flex-direction: column; justify-content: center; gap: 14px; box-shadow: 0 3px 0 var(--paper-edge), 0 18px 40px rgba(0,0,0,.35); animation: deal .35s cubic-bezier(.2,.9,.3,1.2); }
.card .idx { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: 1; font-family: var(--font-display); color: var(--red); }
.card .idx b { font-size: 1.5rem; font-weight: 400; }
.card .idx i { font-style: normal; font-size: .5rem; letter-spacing: 1px; margin-top: 4px; }
.card .idx.tl { top: 14px; left: 16px; }
.card .idx.br { bottom: 14px; right: 16px; transform: rotate(180deg); }
.card .kind { text-transform: uppercase; letter-spacing: .16em; font-size: .78rem; font-weight: 800; color: var(--red); text-align: center; }
.card .text { font-family: var(--font-card); font-size: clamp(1.35rem, 6vw, 1.7rem); line-height: 1.3; text-align: center; text-wrap: pretty; overflow-wrap: anywhere; }
.card .text em { font-style: italic; color: var(--red); }
.card.black .idx, .card.black .kind { color: var(--ink); }
.card .or { font-family: var(--font-display); color: var(--red); text-align: center; font-size: 1.3rem; }
.card .sub { text-align: center; color: var(--ink-soft); font-size: .9rem; }
.card.verso { background: var(--red); background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 14px), repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 14px); color: var(--paper); align-items: center; text-align: center; border: 8px solid var(--paper); }
.card.verso .text { color: var(--paper); }
@keyframes deal { from { transform: translateY(18px) rotate(-3deg) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } .game { transition: none; } }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.btn { padding: 15px 18px; border-radius: 12px; font-weight: 800; font-size: 1.02rem; background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 #a87d2c; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a87d2c; }
.btn.red { background: var(--red); color: var(--paper); box-shadow: 0 3px 0 #8a2229; }
.btn.paper { background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 var(--paper-edge); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--felt-line); box-shadow: none; font-weight: 600; }
.btn.big { font-size: 1.3rem; padding: 22px 18px; font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.howto { font-size: .92rem; color: var(--muted); text-align: center; max-width: 38ch; margin: 0 auto; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 12px 18px; border-radius: 999px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); text-align: center; }

.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper .ctl { display: flex; align-items: center; gap: 12px; }
.stepper .ctl button { width: 40px; height: 40px; border-radius: 50%; background: var(--paper); color: var(--ink); font-size: 1.3rem; font-weight: 800; }
.stepper .ctl button[disabled] { opacity: .35; }
.stepper output { font-family: var(--font-display); font-size: 1.6rem; min-width: 1.5ch; text-align: center; font-variant-numeric: tabular-nums; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle button { width: 58px; height: 32px; border-radius: 999px; background: var(--felt-line); position: relative; flex: none; }
.toggle button::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--paper); transition: left .15s; }
.toggle button[aria-pressed="true"] { background: var(--gold); }
.toggle button[aria-pressed="true"]::after { left: 30px; }

.order { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: o; }
.order li { counter-increment: o; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.18); border: 1px solid var(--felt-line); font-weight: 600; }
.order li::before { content: counter(o); font-family: var(--font-display); color: var(--gold); width: 1.6ch; text-align: center; font-variant-numeric: tabular-nums; }
.order li.dead { opacity: .4; text-decoration: line-through; }
.vote { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.vote button { padding: 16px 10px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 800; overflow-wrap: anywhere; box-shadow: 0 3px 0 var(--paper-edge); }
.vote button[aria-pressed="true"] { background: var(--red); color: var(--paper); box-shadow: 0 3px 0 #8a2229; }
.guess { display: flex; flex-direction: column; gap: 10px; }
.guess input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--paper-edge); background: #fff; color: var(--ink); }
.roles { display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.roles div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--paper-edge); padding-bottom: 6px; }
.roles span:last-child { color: var(--ink-soft); }
.roles .imp span:last-child { color: var(--red); font-weight: 700; }
.warn { font-size: .85rem; color: var(--gold); text-align: center; }
.levels.three { grid-template-columns: repeat(3, 1fr); }
.chip.tap { padding: 8px 14px; border: 0; }
.chip .n { font-variant-numeric: tabular-nums; color: var(--red); font-weight: 800; margin-left: 4px; }
.chip .heart, .pairs .heart { color: var(--red); }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tool { text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--felt-line); background: rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 2px; }
.tool small { color: var(--muted); font-size: .82rem; }
.sips { display: flex; flex-direction: column; gap: 10px; }
.sips h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sips h3 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
.timer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 18px; border-radius: 12px; background: var(--gold); color: var(--ink); }
.timer strong { font-family: var(--font-display); font-weight: 400; font-size: 2.2rem; font-variant-numeric: tabular-nums; }
.timer .btn.ghost { color: var(--ink); border-color: var(--ink); flex: none; }
.table-ring { flex: none; position: relative; width: min(100%, 340px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; border-radius: 50%; border: 2px dashed var(--felt-line); background: radial-gradient(circle, var(--felt-2), transparent 70%); }
.seat { position: absolute; transform: translate(-50%, -50%); background: var(--felt); border: 1px solid var(--felt-line); color: var(--fg); padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: .85rem; white-space: nowrap; max-width: 34%; overflow: hidden; text-overflow: ellipsis; }
.seat.me { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.seat.hit { background: var(--red); color: var(--paper); border-color: var(--red); }
.bottle { pointer-events: none; position: absolute; left: 50%; top: 50%; width: 34px; height: 136px; margin: -68px 0 0 -17px; transform-origin: 50% 50%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
.pairs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pairs li { display: grid; grid-template-columns: 1fr auto 1fr auto; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 700; }
.pairs li span:first-child { text-align: right; }
.pairs.big li { font-size: 1.2rem; padding: 14px; }
.x { width: 30px; height: 30px; border-radius: 50%; background: var(--paper-edge); color: var(--ink); flex: none; }
.pick { display: flex; align-items: center; gap: 8px; }
.pick select { flex: 1; min-width: 0; }
select, textarea, #customForm input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--felt-line); background: var(--felt); color: var(--fg); }
textarea { resize: vertical; }
.prefs { display: flex; flex-direction: column; gap: 10px; }
.pref { display: flex; flex-direction: column; gap: 6px; }
.mine { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mine li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,.18); }
.mine li span { min-width: 0; overflow-wrap: anywhere; }
.mine small { display: block; color: var(--gold); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; }
.titles { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.titles b { font-size: 1.1rem; }
.titles div { background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; }
.titles small { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--red); font-weight: 800; }
.titles b { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; overflow-wrap: anywhere; }
.titles span { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.score th, .score td { padding: 10px 6px; border-bottom: 1px solid var(--felt-line); text-align: center; }
.score th[scope="row"], .score thead th:first-child { text-align: left; }
.score thead th { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.adj { display: inline-flex; align-items: center; gap: 8px; }
.adj button { width: 30px; height: 30px; border-radius: 50%; background: var(--paper); color: var(--ink); font-weight: 800; }
.adj b { min-width: 2ch; }
.info { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); color: var(--gold); font-family: var(--font-card); font-style: italic; font-weight: 500; font-size: 1.2rem; display: grid; place-items: center; flex: none; }
.legal-card { justify-content: flex-start; padding: 28px 22px; animation: none; }
.rules-title { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; text-align: center; color: var(--ink); }
.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 10px; line-height: 1.45; }
.steps li::marker { font-weight: 800; color: var(--red); }
.tips { margin: 0; padding: 12px 0 0 1.2em; border-top: 1px dashed var(--paper-edge); display: flex; flex-direction: column; gap: 6px; color: var(--ink-soft); font-size: .92rem; }
.legal-wrap { background: rgba(0,0,0,.35); border: 1px solid var(--felt-line); border-radius: 22px; padding: 26px 22px; display: flex; flex-direction: column; gap: 30px; }
.legal { display: flex; flex-direction: column; gap: 12px; }
.legal h2 { font-family: var(--font-body); font-weight: 800; font-size: 1.55rem; color: var(--fg); line-height: 1.2; }
.legal p { color: var(--muted); line-height: 1.55; overflow-wrap: anywhere; }
.foot { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; color: var(--muted); font-size: .85rem; padding-top: 6px; }
.link { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; font-size: .95rem; padding: 4px 8px; }
.wheel-box { flex: none; position: relative; width: min(100%, 330px); aspect-ratio: 1; max-width: 100%; margin: 6px auto 0; }
.wheel { pointer-events: none; width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 0 0 6px var(--paper), 0 16px 36px rgba(0,0,0,.45); }
.pointer { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--gold); z-index: 2; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
.chips.qs { justify-content: center; }
.chip.tap.on { background: var(--gold); }
.turn strong.q { font-size: clamp(1.4rem, 7vw, 1.9rem); }
.card .text.big-result { font-family: var(--font-display); font-size: clamp(2rem, 11vw, 3rem); color: var(--red); }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Contenu ---------- */
const LEVELS = [

// {x} = un·e autre joueur·se (selon les réglages), {il} = il/elle et {lui} = lui/elle selon {x}

  if (u.size >= arr.length) u.clear();

}

function cards(game, level) {
  const base = game === 'action' || game === 'verite' ? AOV[level][game]
    : game === 'bottle' ? BOTTLE[level] : game === 'nhie' ? NHIE[level] : game === 'qui' ? QUI[level] : TP[level];
  const mine = S.custom.filter(c => c.game === game && c.level === level).map(c => game === 'tp' ? [c.text, c.text2] : c.text);
  let all = base.concat(mine);
  if (game === 'action' || game === 'bottle' || game === 'tp') {
    all = all.filter(c => okHere(Array.isArray(c) ? c.join(' ') : c));
    const pack = (PLACE_PACK[S.place] || {})[level] || [];
    if (game !== 'tp') all = all.concat(pack.filter(t => (S.alcohol || !NEEDS_ALCOHOL.test(t)) && (game === 'action' || t.includes('{x}'))));
  }
  if (game === 'nhie' || game === 'qui' || game === 'verite') return all;
  return all.length ? all : base;
}

/* ---------- Couples & liste noire ---------- */
const blocked = (a, b) => S.black.includes(a + '>' + b) || S.black.includes(b + '>' + a);
const partnerOf = n => { const c = S.couples.find(c => c.includes(n)); return c ? (c[0] === n ? c[1] : c[0]) : null; };
const partnerHere = n => { const p = partnerOf(n); return p && byName(p) ? p : null; };

// Qui peut être visé par un défi de `cur` à ce niveau
function targets(cur, level) {
  let pool = S.players.filter(p => p !== cur && !blocked(p.name, cur.name));
  if (level === 'soft') return pool;
  if (S.coupleMode) {
    const part = partnerHere(cur.name);
    if (part) return pool.filter(p => p.name === part);
    pool = pool.filter(p => !partnerHere(p.name));
  }
  if (S.target === 'oppose' && !cur.pref) {
    const opp = pool.filter(p => p.g !== cur.g);
    if (opp.length) pool = opp;
  }
  return pool;
}

// Avec une préférence, ~4 défis sur 5 tombent sur le sexe préféré
function pickTarget(cur, level) {
  const pool = targets(cur, level);
  if (!pool.length) return null;
  if (level !== 'soft' && cur.pref) {
    const yes = pool.filter(p => p.g === cur.pref), no = pool.filter(p => p.g !== cur.pref);
    const from = yes.length && (!no.length || Math.random() < .8) ? yes : no;
    return from[rand(from.length)];
  }
  return pool[rand(pool.length)];
}
// Hors préférences (dans un sens ou dans l'autre), le défi ne dépasse pas Piquant
const LEVEL_IDX = id => LEVELS.findIndex(l => l.id === id);
function capLevel(cur, x, level) {
  if (!x || LEVEL_IDX(level) <= LEVEL_IDX('piquant')) return level;
  const off = (cur.pref && x.g !== cur.pref) || (x.pref && cur.g !== x.pref);
  return off ? 'piquant' : level;
}

function secondsIn(text) {
  const m = text.match(/(\d+)\s*(secondes?|minutes?)/i);
  if (m) return +m[1] * (/^m/i.test(m[2]) ? 60 : 1);
  if (/une minute/i.test(text)) return 60;
  return 0;
}
const timeLeft = () => Math.max(0, Math.ceil((S.timer.end - Date.now()) / 1000));

  if (S.timer) return `<div class="timer" role="timer"><strong id="timerTxt">${fmt(timeLeft())}</strong><button class="btn ghost" data-a="timer-stop">Arrêter</button></div>`;
  return sec ? `<button class="btn paper" data-a="timer-go" data-v="${sec}">Lancer le chrono · ${fmt(sec)}</button>` : '';
}
function ring() {
  try {
    if (audioCtx) [0, .35, .7].forEach(d => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.25, audioCtx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + d + .3);
      o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + .3);
    });
    navigator.vibrate && navigator.vibrate([300, 120, 300]);
  } catch (e) {}
}
function stopTimer() {
  S.timer = null;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

/* ---------- La Roue ---------- */
const wheelCur = () => S.players[S.wheel.turn % S.players.length];
// 8 gages faisables ici, complétés par les niveaux inférieurs si besoin

  const ok = it => okHere(it.text) && (S.alcohol || !it.alcohol);
  const idx = LEVEL_IDX(S.level);
  let pool = shuffle(WHEEL[S.level].filter(ok));
  for (let i = idx - 1; pool.length < 8 && i >= 0; i--) pool = pool.concat(shuffle(WHEEL[LEVELS[i].id].filter(ok)));

}

}

  const fs = n <= 6 ? 10 : n <= 10 ? 8.5 : 7;

    const [bg, fg] = WHEEL_COLORS[i % WHEEL_COLORS.length === 0 && i === n - 1 && n % 4 === 1 ? 1 : i % WHEEL_COLORS.length];
    const [x0, y0] = pt(i * seg), [x1, y1] = pt((i + 1) * seg);
    const label = sg.label.length > 13 ? sg.label.slice(0, 12) + '…' : sg.label;
    const mid = i * seg + seg / 2;
    return `<path d="M${C} ${C}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" style="fill:var(${bg});stroke:var(--felt);stroke-width:1"/>
      <text x="${C + R - 8}" y="${C}" transform="rotate(${mid - 90} ${C} ${C})" text-anchor="end" dominant-baseline="middle" style="fill:var(${fg});font:800 ${fs}px var(--font-body)">${esc(label)}</text>`;
  }).join('');
  return `<div class="wheel-box"><span class="pointer" aria-hidden="true"></span>
    <svg class="wheel" id="wheel" viewBox="0 0 200 200" role="img" aria-label="Roue" style="transform:rotate(${angle}deg)">${parts}

}
function wheel() {

function spinWheel() {
  const el = document.getElementById('wheel');

  const fast = matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.getBoundingClientRect();
  el.style.transition = `transform ${fast ? .3 : 3.4}s cubic-bezier(.12,.7,.15,1)`;
  el.style.transform = `rotate(${S.wheel.to}deg)`;
  setTimeout(() => {
    const w = S.wheel;
    if (!w || !w.spinning) return;
    w.spinning = false; w.from = w.to;
    const sg = wheelSegs()[w.hit];
    if (w.mode === 'gage') {
      const cur = wheelCur();
      let text = sg.text, level = S.level, x = null;
      if (text.includes('{x}')) {
        x = pickTarget(cur, S.level);
        const lvl = capLevel(cur, x, S.level);
        if (lvl !== S.level) { level = lvl; text = draw('wcap', WHEEL[lvl].filter(it => it.text.includes('{x}'))).text; }
      }
      w.result = { label: sg.label, level, capped: level !== S.level, html: fill(text, x), secs: secondsIn(text) };
    } else w.result = { label: sg.label };
    ring();
    render(false);
  }, fast ? 350 : 3500);
}

function sdNew() {
  const H = shuffle(S.players.filter(p => p.g === 'h').map(p => p.name));
  const F = shuffle(S.players.filter(p => p.g === 'f').map(p => p.name));
  const n = Math.max(H.length, F.length);
  while (H.length < n) H.push(null);
  while (F.length < n) F.push(null);
  const rounds = [];
  for (let r = 0; r < n; r++) {
    const pairs = [], pause = [];
    for (let i = 0; i < n; i++) {
      const h = H[i], f = F[(i + r) % n];
      if (h && f && !blocked(h, f)) pairs.push([h, f]);
      else { if (h) pause.push(h); if (f) pause.push(f); }
    }
    rounds.push({ pairs, pause, q: draw('sd' + S.level, SD_QUESTIONS[S.level]) });
  }
  const met = {};
  rounds.forEach(r => r.pairs.forEach(([a, b]) => { (met[a] = met[a] || []).push(b); (met[b] = met[b] || []).push(a); }));
  const canVote = n => !(S.coupleMode && partnerHere(n));
  Object.keys(met).forEach(k => { met[k] = met[k].filter(canVote); if (!canVote(k) || !met[k].length) delete met[k]; });
  S.sd = { rounds, r: 0, level: S.level, step: 'round', met, voters: shuffle(Object.keys(met)), v: 0, revealed: false, sel: [], votes: {} };
}
function sd() {
  const s = S.sd;

    : `<p class="howto">Personne ne s'est choisi mutuellement… La soirée est encore longue.</p>`}
    <p class="howto">${oneWay} crush${oneWay > 1 ? 's' : ''} à sens unique, qui ${oneWay > 1 ? 'resteront' : 'restera'} secret${oneWay > 1 ? 's' : ''}.</p>

      <button class="btn big" data-a="uc-hide">${u.idx + 1 < u.ps.length ? 'Cacher et passer' : 'Cacher et commencer'}</button>`;
  }
  if (u.step === 'play') return `${topbar('Undercover', 'uc')}
    <div class="turn"><small>Tour</small><strong>${u.round}</strong></div>

    <div class="vote">${u.ps.filter(p => p.alive).map(p => `<button data-a="uc-sel" data-v="${esc(p.name)}" aria-pressed="${u.sel === p.name}">${esc(p.name)}</button>`).join('')}</div>

    <button class="btn ghost" data-a="uc-back">Retour aux indices</button>`;
  if (u.step === 'reveal') {
    const p = u.ps.find(x => x.name === u.out);
    let extra = '';
    if (p.role === 'white' && u.guess === null) extra = `<form class="guess" id="guessForm"><label for="guessIn" class="sub">Mr White, devine le mot des civils :</label><input id="guessIn" autocomplete="off" placeholder="Ton mot"><div class="row"><button class="btn red" type="submit">Valider</button><button class="btn paper" type="button" data-a="uc-giveup">J'abandonne</button></div></form>`;

      <div class="card ${p.role === 'civil' ? 'black' : ''}"><p class="kind">Éliminé·e</p><p class="text">${esc(p.name)}<br>était <em>${roleName(p.role)}</em></p>${extra}</div>
      ${p.role === 'white' && u.guess === null ? '' : `<button class="btn big" data-a="uc-continue">Continuer</button>`}`;
  }
  const msg = { civils: 'Les civils gagnent !', imposteurs: 'Les imposteurs gagnent !', white: 'Mr White gagne !' }[u.winner];
  return `${topbar('Undercover', 'uc')}

function score() {
  const rows = S.players.map(p => ({ n: p.name, ...stat(p.name) }));
  const best = (f, label) => { const top = rows.slice().sort((a, b) => b[f] - a[f])[0]; return top && top[f] > 0 ? `<div><small>${label}</small><b>${esc(top.n)}</b><span>${top[f]}</span></div>` : ''; };
  const titles = best('sips', W().top) + best('done', 'Le plus courageux') + best('jokers', 'Roi du joker');
  return `${topbar('Classement')}
  ${titles ? `<section class="titles">${titles}</section>` : `<p class="howto">Les compteurs se remplissent tout seuls quand vous jouez : défis faits, jokers, ${W().sips.toLowerCase()}.</p>`}

/* ---------- Rendu ---------- */
const SCREENS = { home, aov, bottle, wheel, ucsetup: ucSetup, uc, sdsetup: sdSetup, sd, rel, custom, score, legal };
let lastScreen = null;
function render(scroll = true) {
  const s = S.screen;
  app.innerHTML = S.gate ? gate() : S.info ? rules() : SCREENS[s] ? SCREENS[s]() : deck(s);
  const key = S.gate || (S.info && 'info') || s;
  if (scroll && key !== lastScreen) window.scrollTo(0, 0);
  lastScreen = key;
  if (s === 'bottle' && S.bottle.spinning && !S.gate && !S.info) spinBottle();
  if (s === 'wheel' && S.wheel.spinning && !S.gate && !S.info) spinWheel();
}

function spinBottle() {
  const el = document.getElementById('bottle');
  if (!el) return;
  const fast = matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.getBoundingClientRect();
  el.style.transition = `transform ${fast ? .3 : 2.6}s cubic-bezier(.15,.75,.2,1)`;
  el.style.transform = `rotate(${S.bottle.to}deg)`;
  setTimeout(() => {
    const b = S.bottle;
    if (!b || !b.spinning) return;
    b.spinning = false; b.from = b.to;
    const cur = S.players[b.turn % S.players.length], x = byName(b.target);
    const lvl = capLevel(cur, x, S.level);
    const raw = draw('bottle' + lvl, cards('bottle', lvl));
    b.card = { level: lvl, capped: lvl !== S.level, html: fill(raw, x), secs: secondsIn(raw) };
    render(false);
  }, fast ? 350 : 2700);
}

function drawDeck() {
  const g = S.screen, lvl = S.level;
  S.deck.card = { v: draw(g + lvl, cards(g, lvl)), level: lvl };
}

// Sans alcool, le joker donne un gage tiré au hasard (faisable sur place)
function joker(n) {
  bump(n, 'jokers');
  if (S.alcohol) { bump(n, 'sips', 2); toast(`Joker ! 2 gorgées pour ${n}.`); return; }
  bump(n, 'sips');
  const ok = GAGES.filter(okHere);
  toast(`Joker ! Gage pour ${n} : ${draw('gage', ok.length ? ok : GAGES)}`);
}

/* ---------- Actions ---------- */
const actions = {
  home() { S.info = null; S.screen = 'home'; S.uc = null; S.sd = null; S.bottle = null; S.edit = null; S.confirm = null; render(); },
  rm(v) {
    const name = S.players[+v].name;
    S.players.splice(+v, 1); savePlayers();
    S.couples = S.couples.filter(c => !c.includes(name)); store.set('couples', S.couples);
    render();
  },
  sex(v) { const p = S.players[+v]; p.g = p.g === 'f' ? 'h' : 'f'; savePlayers(); render(); },
  target(v) { S.target = v; store.set('target', v); S.aov.card = null; render(); },
  level(v) {
    if (LEVELS.find(l => l.id === v).adult && !S.adultOk) { S.gate = v; render(); return; }
    S.level = v; store.set('level', v);
    if (v === 'hot') toast('Niveau Hot : majeurs uniquement, et chacun peut refuser.');
    if (S.screen === 'aov') S.aov.card = null;
    else if (S.screen === 'bottle') { if (!S.bottle.spinning) S.bottle.card = null; }
    else if (S.screen === 'wheel') { if (!S.wheel.spinning) { S.wheel.result = null; S.wheel.gages = wheelGages(); } }
    else if (DECKS[S.screen] && S.deck.card) drawDeck();
    render();
  },
  'gate-ok'() { S.adultOk = true; const v = S.gate; S.gate = null; actions.level(v); },
  'gate-no'() { S.gate = null; render(); },
  info(v) { S.info = v; render(); },
  'info-close'() { S.info = null; render(); },
  wipe() { S.confirm = 'wipe'; render(false); },
  'wipe-no'() { S.confirm = null; render(false); },
  'wipe-ok'() {
    try { Object.keys(localStorage).filter(k => k.startsWith('tournee.')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    location.reload();
  },
  open(v) {
    if (v === 'uc') { S.ucCfg = S.ucCfg || { under: 1, white: false }; S.screen = 'ucsetup'; }
    else if (v === 'sd') S.screen = 'sdsetup';
    else if (v === 'wheel') { S.screen = 'wheel'; S.wheel = { mode: 'gage', turn: rand(S.players.length), from: 0, to: 0, spinning: false, result: null, hit: 0, q: WHEEL_QUESTIONS[0], gages: wheelGages() }; }
    else if (v === 'bottle') { S.screen = 'bottle'; S.bottle = { turn: rand(S.players.length), from: 0, to: 0, target: null, card: null, spinning: false }; }
    else { S.screen = v; S.aov.card = null; S.deck.card = null; S.aov.turn = rand(S.players.length); }
    render();
  },

  // Action ou Vérité
  'aov-pick'(v) {
    const kind = v === 'random' ? (Math.random() < .5 ? 'action' : 'verite') : v;
    const p = S.players[S.aov.turn % S.players.length];
    const x = pickTarget(p, S.level);
    const lvl = kind === 'action' ? capLevel(p, x, S.level) : S.level;
    const raw = draw('aov' + lvl + kind, cards(kind, lvl));
    S.aov.card = { kind, level: lvl, capped: lvl !== S.level, html: fill(raw, x), secs: kind === 'action' ? secondsIn(raw) : 0 };
    render(false);
  },
  'aov-next'() { bump(S.players[S.aov.turn % S.players.length].name, 'done'); S.aov.turn++; S.aov.card = null; render(false); },
  'aov-joker'() {
    const n = S.players[S.aov.turn % S.players.length].name;
    joker(n);
    S.aov.turn++; S.aov.card = null; render(false);
  },

  // Bouteille
  'w-mode'(v) { const w = S.wheel; w.mode = v; w.result = null; if (v === 'gage') w.gages = wheelGages(); render(false); },
  'w-q'(v) { S.wheel.q = v; S.wheel.result = null; render(false); },
  'w-spin'() {
    const w = S.wheel;
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
    if (w.mode === 'gage' && w.result) w.gages = wheelGages();
    const n = wheelSegs().length;
    if (n < 2) return;
    w.hit = rand(n);
    const seg = 360 / n, center = w.hit * seg + seg / 2 + (Math.random() - .5) * seg * .6;
    const now = ((w.from % 360) + 360) % 360;
    w.to = w.from + 360 * 5 + (((360 - center) - now + 720) % 360);
    w.result = null; w.spinning = true;
    render(false);
  },
  'w-done'() { const w = S.wheel; bump(wheelCur().name, 'done'); w.turn++; w.result = null; w.gages = wheelGages(); render(false); },
  'w-joker'() { const w = S.wheel; joker(wheelCur().name); w.turn++; w.result = null; w.gages = wheelGages(); render(false); },
  'b-spin'() {
    const b = S.bottle, n = S.players.length, cur = S.players[b.turn % n];
    const t = pickTarget(cur, S.level);
    if (!t) { toast(`Personne de disponible pour ${cur.name} avec ces réglages.`); return; }
    const i = S.players.indexOf(t);
    const goal = i / n * 360, now = ((b.from % 360) + 360) % 360;
    b.to = b.from + 360 * 4 + ((goal - now + 360) % 360);
    b.target = t.name; b.card = null; b.spinning = true;
    render(false);
  },
  'b-done'() {
    const b = S.bottle, cur = S.players[b.turn % S.players.length];
    bump(cur.name, 'done'); bump(b.target, 'done');
    b.turn = S.players.findIndex(p => p.name === b.target); b.card = null;
    render(false);
  },
  'b-joker'() {
    const b = S.bottle, cur = S.players[b.turn % S.players.length];
    joker(cur.name);
    b.turn = S.players.findIndex(p => p.name === b.target); b.card = null;
    render(false);
  },

  // Cartes simples
  'deck-next'() { drawDeck(); render(false); },
  sip(v) { bump(v, 'sips'); if (S.screen !== 'score') toast(`${v} : ${stat(v).sips} ${W().sip}${stat(v).sips > 1 ? 's' : ''}`); render(false); },
  place(v) { S.place = v; store.set('place', v); render(false); },
  alcohol(v) { S.alcohol = v === '1'; store.set('alcohol', S.alcohol); render(false); },
  'sip-minus'(v) { bump(v, 'sips', -1); render(false); },
  reset() { S.confirm = 'reset'; render(false); },
  'reset-no'() { S.confirm = null; render(false); },
  'reset-ok'() { S.stats = {}; store.set('stats', S.stats); S.confirm = null; toast('Compteurs remis à zéro.'); render(false); },

  // Minuteur
  'timer-go'(v) {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
    S.timer = { end: Date.now() + v * 1000 };
    render(false);
  },
  'timer-stop'() { stopTimer(); render(false); },

  // Speed Dating
  'sd-secs'(v) { S.sdCfg.secs = +v; render(false); },
  'sd-start'() { sdNew(); S.screen = 'sd'; render(); },
  'sd-next'() {
    const s = S.sd;
    if (s.r + 1 < s.rounds.length) { s.r++; render(); return; }
    if (!s.voters.length) { s.step = 'result'; render(); return; }
    s.step = 'vote'; s.v = 0; s.revealed = false; render();
  },
  'sd-reveal'() { S.sd.revealed = true; S.sd.sel = []; render(false); },
  'sd-sel'(v) { const s = S.sd; s.sel = s.sel.includes(v) ? s.sel.filter(x => x !== v) : s.sel.concat(v); render(false); },
  'sd-cast'() {
    const s = S.sd; s.votes[s.voters[s.v]] = s.sel; s.sel = []; s.revealed = false;
    if (++s.v >= s.voters.length) s.step = 'result';
    render();
  },

  // Undercover
  'uc-u'(v) { S.ucCfg.under += +v; render(false); },
  'uc-hot'() { S.ucCfg.hot = !S.ucCfg.hot; render(false); },
  'uc-w'() { S.ucCfg.white = !S.ucCfg.white; render(false); },
  'uc-start'() { ucNew(); S.screen = 'uc'; render(); },
  'uc-reveal'() { S.uc.revealed = true; render(); },
  'uc-hide'() {
    const u = S.uc; u.revealed = false;
    if (++u.idx >= u.ps.length) { u.step = 'play'; ucOrder(); }
    render();
  },
  'uc-vote'() { S.uc.step = 'vote'; S.uc.sel = null; render(); },
  'uc-back'() { S.uc.step = 'play'; render(); },
  'uc-sel'(v) { S.uc.sel = v; render(false); },
  'uc-kill'() {
    const u = S.uc; u.ps.find(p => p.name === u.sel).alive = false;
    u.out = u.sel; u.guess = null; u.step = 'reveal'; render();
  },
  'uc-giveup'() { S.uc.guess = '…'; render(false); },
  'uc-continue'() {
    const u = S.uc;
    const w = u.winner || ucWin();
    if (w) {
      u.winner = w; u.step = 'end';
      const civilsWon = w === 'civils';
      u.ps.forEach(p => { if ((p.role === 'civil') !== civilsWon) bump(p.name, 'sips'); });
    } else { u.round++; ucOrder(); u.step = 'play'; }
    render();
  },
  'uc-again'() { ucNew(); render(); },

  // Couples & liste noire
  'cp-add'() {
    const a = document.getElementById('cp1').value, b = document.getElementById('cp2').value;
    if (!a || !b || a === b) { toast('Choisis deux personnes différentes.'); return; }
    S.couples = S.couples.filter(c => !c.includes(a) && !c.includes(b)).concat([[a, b]]);
    store.set('couples', S.couples); render(false);
  },
  'cp-rm'(v) { S.couples = S.couples.filter(c => !c.includes(v)); store.set('couples', S.couples); render(false); },
  pref(v) { const [i, g] = v.split(':'); const p = S.players[+i]; if (g === '-') delete p.pref; else p.pref = g; savePlayers(); render(false); },
  'cp-mode'() { S.coupleMode = !S.coupleMode; store.set('coupleMode', S.coupleMode); render(false); },
  'bl-edit'(v) { S.edit = v; render(); },
  'bl-toggle'(v) {
    const k = S.edit + '>' + v;
    S.black = S.black.includes(k) ? S.black.filter(x => x !== k) : S.black.concat(k);
    store.set('black', S.black); render(false);
  },
  'bl-done'() { S.edit = null; toast('Liste enregistrée et cachée.'); render(); },

  // Cartes perso
  'c-rm'(v) { S.custom.splice(+v, 1); store.set('custom', S.custom); render(false); },
};

// Tout autre geste arrête le chrono (on a changé de carte ou d'écran)
const KEEP_TIMER = new Set(['timer-go', 'sip', 'sip-minus', 'target', 'info', 'info-close']);
app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  if (S.timer && !KEEP_TIMER.has(b.dataset.a)) stopTimer();
  actions[b.dataset.a](b.dataset.v);
});
app.addEventListener('change', e => {
  if (e.target.id !== 'cGame') return;
  const g = e.target.value;
  document.getElementById('cText2').hidden = g !== 'tp';
  document.getElementById('cText').placeholder = { action: 'Ex : Fais un bisou à {x} sur le front.', verite: 'Ex : Qu\'est-ce que tu penses vraiment de {x} ?', bottle: 'Ex : Faites un tango, {x} et toi.', nhie: 'Ex : volé un panneau de signalisation', qui: 'Ex : finir marié·e à Las Vegas', tp: 'Premier choix' }[g];
  document.getElementById('cHint').textContent = CUSTOM_HINTS[g];
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'addForm') {
    const inp = document.getElementById('newPlayer');
    const name = inp.value.trim();
    if (!name) return;
    if (S.players.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast(`${name} est déjà dans la partie.`); return; }
    S.players.push({ name, g: e.submitter && e.submitter.value === 'f' ? 'f' : 'h' }); savePlayers(); render(false);
    document.getElementById('newPlayer').focus();
  } else if (id === 'guessForm') {
    const g = document.getElementById('guessIn').value.trim();
    if (!g) return;
    S.uc.guess = g;
    if (norm(g) === norm(S.uc.civil)) S.uc.winner = 'white';
    render(false);
  } else if (id === 'persoForm') {
    const list = document.getElementById('persoText').value.split('\n').map(t => t.trim()).filter(Boolean).slice(0, 16);
    if (list.length < 2) { toast('Il faut au moins 2 cases.'); return; }
    S.wheelPerso = list; store.set('wheelPerso', list); S.wheel.result = null; toast('Roue mise à jour.'); render(false);
  } else if (id === 'customForm') {
    const game = document.getElementById('cGame').value, level = document.getElementById('cLevel').value;
    const text = document.getElementById('cText').value.trim(), text2 = document.getElementById('cText2').value.trim();
    if (!text || (game === 'tp' && !text2)) { toast(game === 'tp' ? 'Remplis les deux choix.' : 'Écris le texte de la carte.'); return; }
    S.custom.unshift(game === 'tp' ? { game, level, text, text2 } : { game, level, text });
    store.set('custom', S.custom); toast('Carte ajoutée au paquet.'); render(false);
  }
});

// Appli Android : le bouton retour revient au menu au lieu de quitter le jeu
const capApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (capApp) capApp.addListener('backButton', () => {
  if (S.timer) stopTimer();
  if (S.info) actions['info-close']();
  else if (S.gate) actions['gate-no']();
  else if (S.edit) actions['bl-done']();
  else if (S.screen !== 'home') actions.home();
  else capApp.exitApp();
});

render();
</script>
